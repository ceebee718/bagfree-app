<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passport — BagFree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- React-via-Babel on Larry's cdnjs convention -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<!-- Supabase on the same jsdelivr path the existing account/dashboard pages use -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#071B3A; --navy-2:#0A2349; --navy-3:#0E2C58; --navy-ink:#04122A;
  --gold:#D4AF6A; --gold-soft:#E8CF9E; --gold-rgb:212,175,106;
  --cream:#F4EFE3; --cream-rgb:244,239,227;
  --em:#5DCAA5; --em-rgb:93,202,165;
  --coral:#E08A6E;
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-body:'DM Sans','Helvetica Neue',sans-serif;
  --line:rgba(var(--gold-rgb),0.14);
  --line-soft:rgba(var(--cream-rgb),0.08);
  --glass:rgba(255,255,255,0.028);
  --glass-2:rgba(255,255,255,0.05);
  --shadow:0 24px 60px rgba(2,8,20,0.55);
}
html.light{
  --navy:#F6F2E9; --navy-2:#FFFFFF; --navy-3:#F1EADC; --navy-ink:#EFE9DC;
  --gold:#9A7B3D; --gold-soft:#B89A5C; --gold-rgb:154,123,61;
  --cream:#21304A; --cream-rgb:33,48,74; --em:#2C8E6E; --em-rgb:44,142,110;
  --line:rgba(154,123,61,0.18); --line-soft:rgba(33,48,74,0.08);
  --glass:rgba(33,48,74,0.022); --glass-2:rgba(33,48,74,0.045);
  --shadow:0 22px 50px rgba(120,104,70,0.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff-body);color:rgba(var(--cream-rgb),0.86);background:var(--navy);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 78% -8%, rgba(var(--gold-rgb),0.10), transparent 60%),
             radial-gradient(800px 700px at -10% 110%, rgba(var(--em-rgb),0.07), transparent 60%);}
a{color:var(--gold);text-decoration:none}
button{cursor:pointer;border:none;font-family:var(--ff-body);background:none;color:inherit}
::selection{background:rgba(var(--gold-rgb),0.25);color:var(--cream)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}
.eyebrow{font-size:.56rem;letter-spacing:3.4px;text-transform:uppercase;font-weight:600;color:var(--gold)}

/* ─────────── App frame ─────────── */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* ─────────── Sidebar (identical to dashboard.html) ─────────── */
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--navy-ink),color-mix(in srgb,var(--navy-ink) 86%, #000));
  border-right:1px solid var(--line);padding:1.6rem 1.1rem 1.2rem;}
html.light .side{background:linear-gradient(180deg,var(--navy-ink),#E8E0CF)}
.brand{display:flex;align-items:center;gap:.55rem;padding:.2rem .5rem 1.4rem;text-decoration:none;cursor:pointer}
.brand-logo-img{width:130px;max-width:100%;height:auto;object-fit:contain;display:block}
.nav-group-label{font-size:.5rem;letter-spacing:2.6px;text-transform:uppercase;color:rgba(var(--cream-rgb),0.32);font-weight:600;padding:.9rem .75rem .4rem}
.nav-item{display:flex;align-items:center;gap:.7rem;width:100%;padding:.62rem .75rem;border-radius:11px;
  font-size:.82rem;font-weight:500;color:rgba(var(--cream-rgb),0.6);text-align:left;transition:all .2s ease;position:relative}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.8}
.nav-item:hover{color:var(--cream);background:var(--glass)}
.nav-item.active{color:var(--navy-ink);font-weight:600;background:linear-gradient(135deg,var(--gold),var(--gold-soft));box-shadow:0 8px 22px rgba(var(--gold-rgb),0.28)}
html.light .nav-item.active{color:#FFF}
.nav-item.muted{color:rgba(var(--cream-rgb),0.4)}
.nav-item.muted:hover{color:rgba(var(--cream-rgb),0.7)}
.side-spacer{flex:1}
.invite-card{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;background:var(--glass);margin-bottom:.7rem}
.invite-card .t{font-size:.78rem;color:rgba(var(--cream-rgb),0.72);line-height:1.4;margin-bottom:.35rem}
.invite-card .a{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.2rem .4rem}
.help{display:flex;align-items:center;gap:.5rem;font-size:.74rem;color:rgba(var(--cream-rgb),0.5)}
.theme-switch{position:relative;width:62px;height:31px;border-radius:31px;border:1px solid var(--line);background:var(--glass);display:flex;align-items:center;justify-content:space-between;padding:0 8px;cursor:pointer;transition:border-color .25s,background .25s;flex-shrink:0}
.theme-switch:hover{border-color:rgba(var(--gold-rgb),0.45);background:var(--glass-2)}
.theme-switch svg{width:14px;height:14px;position:relative;z-index:2;transition:color .3s}
.theme-switch .ts-sun{color:rgba(var(--cream-rgb),0.4)}
.theme-switch .ts-moon{color:#3a2c12}
html.light .theme-switch .ts-sun{color:#3a2c12}
html.light .theme-switch .ts-moon{color:rgba(var(--cream-rgb),0.4)}
.ts-thumb{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--gold));box-shadow:0 3px 9px rgba(0,0,0,.35),0 0 0 1px rgba(var(--gold-rgb),0.35),inset 0 1px 1px rgba(255,255,255,.4);transform:translateX(31px);transition:transform .36s cubic-bezier(.4,0,.2,1);z-index:1}
html.light .ts-thumb{transform:translateX(0)}

/* ─────────── Topbar ─────────── */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:flex-end;gap:.9rem;padding:1rem 2.2rem;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--navy) 80%, transparent);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40}
.hamburger{display:none;margin-right:auto}
.hamburger svg{width:24px;height:24px;color:var(--cream)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:rgba(var(--cream-rgb),0.7);transition:.2s}
.bell:hover{color:var(--gold);border-color:rgba(var(--gold-rgb),0.4)}
.bell .dot{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.user-chip{display:flex;align-items:center;gap:.55rem;padding:.32rem .35rem .32rem .7rem;border:1px solid var(--line);border-radius:30px;transition:.2s}
.user-chip:hover{border-color:rgba(var(--gold-rgb),0.4)}
.user-name{font-size:.82rem;color:rgba(var(--cream-rgb),0.8)}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(var(--gold-rgb),0.12);border:1px solid rgba(var(--gold-rgb),0.4);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--ff-display);font-size:.95rem}

/* ─────────── Content shell ─────────── */
.content{padding:2rem 2.2rem 4rem;max-width:1180px;width:100%;margin:0 auto}
.reveal{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.hero h1{font-family:var(--ff-display);font-weight:300;font-size:clamp(2rem,4.2vw,3.05rem);color:var(--cream);line-height:1.04;letter-spacing:-.5px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{font-size:.92rem;color:rgba(var(--cream-rgb),0.5);margin-top:.45rem;font-weight:300;max-width:38ch}
.hero-chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:.45rem;border:1px solid var(--line);border-radius:30px;padding:.45rem .85rem;font-size:.72rem;color:rgba(var(--cream-rgb),0.78);background:var(--glass)}
.chip b{color:var(--gold);font-weight:600}

.card{border:1px solid var(--line);border-radius:18px;background:var(--glass);position:relative;overflow:hidden}

/* ── City tabs ── */
.city-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
.city-tab{font-size:.72rem;font-weight:600;padding:.55rem 1.1rem;border-radius:30px;border:1px solid var(--line);color:rgba(var(--cream-rgb),0.6);transition:.2s;letter-spacing:.3px;display:flex;align-items:center;gap:.4rem}
.city-tab:hover{color:var(--cream);border-color:rgba(var(--gold-rgb),0.4)}
.city-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:var(--navy-ink);border-color:transparent;font-weight:700;box-shadow:0 6px 16px rgba(var(--gold-rgb),0.28)}
.city-tab.soon{opacity:.45;cursor:default}
.city-tab.soon:hover{color:rgba(var(--cream-rgb),0.6);border-color:var(--line)}
.city-tab .soon-pill{font-size:.52rem;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--line-soft);border-radius:10px;padding:.1rem .4rem}

/* ── Passport spread (signature element) ── */
.spread{display:grid;grid-template-columns:340px 1fr;gap:0;align-items:stretch;border:1px solid rgba(var(--gold-rgb),0.28);border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg, rgba(var(--gold-rgb),0.05), transparent 40%),var(--glass);box-shadow:var(--shadow)}
.spread-left{padding:1.6rem;display:flex;flex-direction:column;border-right:1px dashed rgba(var(--gold-rgb),0.25);position:relative}
.spread-left::after{content:'';position:absolute;top:1.2rem;bottom:1.2rem;right:-1px;width:1px;
  background:repeating-linear-gradient(180deg,rgba(var(--gold-rgb),0.4) 0 6px,transparent 6px 12px)}
.spread-hero{border-radius:13px;overflow:hidden;position:relative;height:150px;background:var(--navy-ink);margin-bottom:1.1rem}
.spread-hero svg{width:100%;height:100%;display:block}
.spread-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(4,18,42,0.85))}
.spread-city{position:absolute;left:.9rem;bottom:.6rem;z-index:2;font-family:var(--ff-display);font-style:italic;font-size:1.3rem;color:var(--cream);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.spread-level{font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:.3rem}
.spread-count{display:flex;align-items:baseline;gap:.4rem;margin-bottom:.3rem}
.spread-count .n{font-family:var(--ff-display);font-size:3rem;color:var(--cream);line-height:1}
.spread-count .d{font-size:1.1rem;color:rgba(var(--cream-rgb),0.4)}
.spread-progress{height:7px;border-radius:5px;background:rgba(var(--cream-rgb),0.08);margin:.6rem 0 1.1rem;overflow:hidden}
.spread-progress i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.spread-note{font-size:.8rem;color:rgba(var(--cream-rgb),0.55);line-height:1.55;margin-top:auto}
.spread-note b{color:var(--gold);font-weight:600}
.spread-map-cta{display:block;text-align:center;margin-top:1rem;padding:.8rem;border-radius:11px;border:1px solid rgba(var(--gold-rgb),0.4);font-size:.62rem;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;color:var(--gold);transition:.25s}
.spread-map-cta:hover{background:rgba(var(--gold-rgb),0.1)}

.spread-right{padding:1.4rem 1.6rem}
.stamp-list{display:flex;flex-direction:column;gap:.5rem}
.stamp-row{display:flex;align-items:center;gap:.9rem;padding:.75rem .9rem;border-radius:12px;border:1px solid var(--line-soft);background:var(--glass-2);transition:.2s}
.stamp-row:hover{border-color:rgba(var(--gold-rgb),0.35);transform:translateX(2px)}
.stamp-row.next{border-color:rgba(var(--em-rgb),0.4);background:rgba(var(--em-rgb),0.05)}
.stamp-badge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.stamp-badge.filled{border:1.5px solid var(--gold);background:radial-gradient(circle,rgba(var(--gold-rgb),0.22),rgba(var(--gold-rgb),0.06));color:var(--gold);box-shadow:0 4px 12px rgba(var(--gold-rgb),0.2)}
.stamp-badge.empty{border:1.5px dashed rgba(var(--cream-rgb),0.18);color:rgba(var(--cream-rgb),0.22)}
.stamp-badge.next{border:1.5px dashed var(--em);color:var(--em);animation:beacon 2.2s ease-in-out infinite}
@keyframes beacon{0%,100%{box-shadow:0 0 0 0 rgba(var(--em-rgb),0.35)}50%{box-shadow:0 0 0 7px rgba(var(--em-rgb),0)}}
.stamp-info{flex:1;min-width:0}
.stamp-name{font-size:.86rem;color:var(--cream);font-weight:500}
.stamp-sub{font-size:.68rem;color:rgba(var(--cream-rgb),0.42);margin-top:1px}
.stamp-pts{font-size:.62rem;font-weight:700;color:var(--gold);border:1px solid rgba(var(--gold-rgb),0.35);border-radius:20px;padding:.28rem .6rem;background:rgba(var(--gold-rgb),0.07);white-space:nowrap;flex-shrink:0}
.stamp-pts.next{color:var(--em);border-color:rgba(var(--em-rgb),0.35);background:rgba(var(--em-rgb),0.08)}

/* ── How it works ── */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:2.4rem 0 1rem}
.sec-h h2{font-family:var(--ff-display);font-weight:400;font-size:1.55rem;color:var(--cream)}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.how-card{border:1px solid var(--line);border-radius:16px;background:var(--glass);padding:1.3rem}
.how-num{font-family:var(--ff-display);font-size:1.6rem;color:var(--gold);margin-bottom:.5rem}
.how-t{font-size:.92rem;color:var(--cream);font-weight:500;margin-bottom:.35rem}
.how-d{font-size:.78rem;color:rgba(var(--cream-rgb),0.5);line-height:1.55}

/* ── Coming soon strip ── */
.soon-strip{border:1px dashed rgba(var(--gold-rgb),0.3);border-radius:16px;padding:1.1rem 1.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:1.6rem;background:var(--glass-2)}
.soon-strip .t{font-size:.85rem;color:var(--cream)}
.soon-strip .t b{color:var(--gold)}
.soon-strip .d{font-size:.74rem;color:rgba(var(--cream-rgb),0.45);margin-top:.2rem}

/* loading */
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:var(--navy);z-index:200}
.boot .sp{width:42px;height:42px;border:2px solid rgba(var(--gold-rgb),0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
.boot .t{font-family:var(--ff-display);font-style:italic;font-size:1.1rem;color:rgba(var(--cream-rgb),0.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.scrim{display:none}

@media(max-width:1080px){ .spread{grid-template-columns:1fr} .spread-left::after{display:none} .spread-left{border-right:none;border-bottom:1px dashed rgba(var(--gold-rgb),0.25)} }
@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:120;width:264px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
  .app.nav-open .side{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(2,8,20,.6);z-index:110;backdrop-filter:blur(2px)}
  .hamburger{display:flex}
  .content{padding:1.4rem 1.1rem 3.5rem}
  .topbar{padding:.85rem 1.1rem}
  .how-grid{grid-template-columns:1fr}
}
@media(max-width:620px){ .user-name{display:none} }
@media(prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.05ms!important} }
</style>
</head>

<div id="root"><div class="boot"><div class="sp"></div><div class="t">Opening your passport…</div></div></div>

const NAV = [
  {k:'dashboard',label:'Dashboard',icon:I.home,href:'/dashboard.html',group:'primary'},
  {k:'passport',label:'Passport',icon:I.passport,href:'/passport.html',group:'primary'},
  {k:'map',label:'Map',icon:I.map,href:'/map.html',group:'primary'},
  {k:'nearby',label:'Nearby',icon:I.nearby,href:'/dashboard.html#happening',group:'primary'},
  {k:'trips',label:'Trips',icon:I.trips,href:'/plan-my-trip.html',group:'primary'},
  {k:'exp',label:'Experiences',icon:I.exp,href:'/experiences.html',group:'primary'},
  {k:'rewards',label:'Rewards',icon:I.rewards,href:'/membership.html',group:'primary'},
  {k:'orders',label:'Orders',icon:I.orders,href:'/account.html',group:'account'},
  {k:'member',label:'Membership',icon:I.member,href:'/membership.html',group:'account'},
  {k:'profile',label:'Profile',icon:I.profile,href:'/account.html',group:'account'},
  {k:'settings',label:'Settings',icon:I.settings,href:'/account.html',group:'account'},
];

/* ───────────────────── Passport data ───────────────────── */
// Real, named stops only exist for Savannah today (mirrors dashboard.html's
// STAMPS list). Other launch cities show as "Coming Soon" until their POI
// lists are built, rather than inventing placeholder landmark names.
const CITY_STAMPS = {
  'Savannah, GA': [
    {name:'Forsyth Park',sub:'Attractions · 0.2 mi',got:true,pts:25},
    {name:'Bonaventure Cemetery',sub:'Attractions · 3.1 mi',got:true,pts:25},
    {name:'City Market',sub:'Shopping · 0.4 mi',got:true,pts:15},
    {name:'Cathedral of St. John',sub:'Attractions · 0.5 mi',got:true,pts:20},
    {name:'River Street',sub:'Attractions · 0.3 mi',got:false,next:true,pts:25},
    {name:'Jones Street',sub:'Attractions · 0.6 mi',got:false,pts:15},
    {name:'Wormsloe Historic Site',sub:'Tours · 8 mi',got:false,pts:30},
    {name:'Telfair Museums',sub:'Attractions · 0.5 mi',got:false,pts:20},
    {name:'Tybee Island Light',sub:'Attractions · 18 mi',got:false,pts:35},
    {name:'Pin Point Heritage Museum',sub:'Attractions · 9 mi',got:false,pts:25},
  ],
};
const CITY_SKYLINE = {
  'Savannah, GA': [28,52,38,60,34,48,40],
  'Atlanta, GA': [68,44,82,52,92,58,72],
  'Tampa, FL': [48,72,44,58,78,48,62],
  'Orlando, FL': [52,38,58,86,48,66,42],
  'Miami, FL': [62,86,52,72,48,80,58],
};
const LAUNCH_CITIES = ['Savannah, GA','Atlanta, GA','Tampa, FL','Orlando, FL','Miami, FL'];

/* ───────────────────── Theme toggle ───────────────────── */
function ThemeToggle({light,toggleTheme}){
  return (
    <button className="theme-switch" role="switch" aria-checked={light}
            aria-label="Toggle light and dark mode" title="Toggle theme" onClick={toggleTheme}>
      <Icon className="ts-sun" d={<g><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>}/>
      <Icon className="ts-moon" d={<path d="M21 12.8A8.5 8.5 0 0 1 11.2 3a7 7 0 1 0 9.8 9.8z"/>}/>
      <span className="ts-thumb"></span>
    </button>
  );
}

/* ───────────────────── Sidebar (identical to dashboard.html) ───────────────────── */
function Sidebar({active,light,toggleTheme,closeNav}){
  const primary=NAV.filter(n=>n.group==='primary');
  const account=NAV.filter(n=>n.group==='account');
  return (
    <aside className="side">
      <a href="/" className="brand"><img src="/bagfree-logo-full.png" alt="BagFree" className="brand-logo-img"/></a>
      <div className="nav-group-label">Explore</div>
      {primary.map(n=>(
        <a key={n.k} href={n.href} className={'nav-item'+(active===n.k?' active':'')} onClick={closeNav}>
          <Icon d={n.icon}/><span>{n.label}</span>
        </a>
      ))}
      <div className="nav-group-label">Account</div>
      {account.map(n=>(
        <a key={n.k} href={n.href} className="nav-item muted" onClick={closeNav}>
          <Icon d={n.icon}/><span>{n.label}</span>
        </a>
      ))}
      <div className="side-spacer"></div>
      <div className="invite-card">
        <div className="t">Invite friends. Give $25, get $25.</div>
        <a href="/membership.html" className="a">Refer &amp; Earn →</a>
      </div>
      <div className="side-foot">
        <a href="/account.html" className="help"><Icon d={I.msg}/> Need help?</a>
      </div>
    </aside>
  );
}

/* ───────────────────── Skyline hero (no external images) ───────────────────── */
function SkylineHero({city}){
  const heights=CITY_SKYLINE[city]||CITY_SKYLINE['Savannah, GA'];
  const w=700,h=300,barW=w/heights.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMax slice" width="100%" height="100%" style={{display:'block'}}>
      <defs>
        <linearGradient id="phSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="rgba(var(--gold-rgb),0.16)"/>
          <stop offset="100%" stopColor="rgba(var(--em-rgb),0.06)"/>
        </linearGradient>
        <linearGradient id="phBldg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--gold-soft)"/>
          <stop offset="100%" stopColor="var(--gold)"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width={w} height={h} fill="url(#phSky)"/>
      {heights.map((pct,i)=>{
        const bh=(pct/100)*h*0.62, x=i*barW+barW*0.12, bw=barW*0.76;
        return <rect key={i} x={x} y={h-bh} width={bw} height={bh} rx="2" fill="url(#phBldg)" opacity={0.5+(i%3)*0.12}/>;
      })}
    </svg>
  );
}

/* ───────────────────── Passport spread ───────────────────── */
function PassportSpread({city,level}){
  const ref=useRef(null);
  const stamps=CITY_STAMPS[city]||[];
  const filled=stamps.filter(s=>s.got).length;
  const total=stamps.length||10;
  useEffect(()=>{const t=setTimeout(()=>{if(ref.current)ref.current.style.width=Math.round(filled/total*100)+'%';},250);return()=>clearTimeout(t);},[filled,total,city]);
  return (
    <div className="spread reveal" style={{animationDelay:'.06s'}}>
      <div className="spread-left">
        <div className="spread-hero">
          <SkylineHero city={city}/>
          <span className="spread-city">{city}</span>
        </div>
        <div className="spread-level">{level} · {city.split(',')[0]} Passport</div>
        <div className="spread-count"><span className="n">{filled}</span><span className="d">/ {total} stamps</span></div>
        <div className="spread-progress"><i ref={ref}></i></div>
        <p className="spread-note">Tap in at a BagFree beacon near each partner location to collect a stamp. <b>Fill this passport</b> to unlock BAG Points and city-exclusive perks.</p>
        <a href="/map.html" className="spread-map-cta">Open Map →</a>
      </div>
      <div className="spread-right">
        <div className="stamp-list">
          {stamps.map((s,i)=>(
            <div key={i} className={'stamp-row'+(s.next?' next':'')}>
              <span className={'stamp-badge '+(s.got?'filled':s.next?'next':'empty')}>{s.got?'✦':s.next?'•':''}</span>
              <span className="stamp-info">
                <span className="stamp-name">{s.name}</span>
                <span className="stamp-sub">{s.sub}</span>
              </span>
              <span className={'stamp-pts'+(s.next?' next':'')}>{s.got?'Collected':(s.next?'Nearest · ':'')+'+'+s.pts+' pts'}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ───────────────────── How it works ───────────────────── */
function HowItWorks(){
  const steps=[
    {n:'01',t:'Walk to a partner spot',d:'Every stamp ties to a real place — a park, a landmark, a café — already on your city map.'},
    {n:'02',t:'Tap the BagFree beacon',d:'Check in when you arrive. No app scavenger hunt, just proof you actually went.'},
    {n:'03',t:'Collect points & perks',d:'Each stamp earns BAG Points, and a full passport unlocks city-exclusive rewards.'},
  ];
  return (
    <div>
      <div className="sec-h"><h2>How stamps work</h2></div>
      <div className="how-grid">
        {steps.map(s=>(
          <div className="how-card" key={s.n}>
            <div className="how-num">{s.n}</div>
            <div className="how-t">{s.t}</div>
            <div className="how-d">{s.d}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ───────────────────── App ───────────────────── */
function App(){
  const [light,setLight]=useState(()=>{try{return localStorage.getItem('bf-theme')==='light';}catch(e){return false;}});
  const [navOpen,setNavOpen]=useState(false);
  const [loading,setLoading]=useState(true);
  const [activeCity,setActiveCity]=useState('Savannah, GA');
  const [data,setData]=useState({name:'Traveler', initial:'T', city:'Savannah, GA', level:'Explorer', notif:2});

  useEffect(()=>{document.documentElement.classList.toggle('light',light);},[light]);
  const toggleTheme=()=>{setLight(v=>{const nv=!v;try{localStorage.setItem('bf-theme',nv?'light':'dark');}catch(e){}return nv;});};

  useEffect(()=>{(async()=>{
    if(!sb){setLoading(false);return;}
    try{
      const {data:s}=await sb.auth.getSession();
      if(!s.session){
        if(REQUIRE_AUTH){window.location.href='/account-login.html';return;}
        setLoading(false);return;
      }
      const u=s.session.user;
      const next={};
      const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).single();
      if(p){
        const nm=p.first_name||u.email.split('@')[0];
        next.name=nm; next.initial=nm.charAt(0).toUpperCase();
        if(p.preferred_city){ next.city=p.preferred_city; setActiveCity(LAUNCH_CITIES.includes(p.preferred_city)?p.preferred_city:'Savannah, GA'); }
      }
      const {data:gp}=await sb.from('game_profiles').select('level').eq('user_id',u.id).single();
      if(gp){const lv=gp.level||1;next.level=lv>=5?'Voyager':lv>=3?'Wayfarer':lv>=2?'Explorer':'Wanderer';}
      setData(d=>({...d,...next}));
    }catch(e){console.warn('Passport load (preview mode):',e&&e.message);}
    setLoading(false);
  })();},[]);

  return (
    <div className={'app'+(navOpen?' nav-open':'')}>
      <Sidebar active="passport" light={light} toggleTheme={toggleTheme} closeNav={()=>setNavOpen(false)}/>
      <div className="scrim" onClick={()=>setNavOpen(false)}></div>
      <div className="main">
        <div className="topbar">
          <button className="hamburger" onClick={()=>setNavOpen(true)} aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <ThemeToggle light={light} toggleTheme={toggleTheme}/>
          <button className="bell" aria-label="Notifications"><Icon d={I.bell}/>{data.notif>0&&<span className="dot">{data.notif}</span>}</button>
          <a className="user-chip" href="/account.html">
            <span className="user-name">{data.name}</span>
            <span className="avatar">{data.initial}</span>
          </a>
        </div>

        <div className="content">
          <div className="hero reveal">
            <div>
              <h1>Your <em>Passport.</em></h1>
              <p>Every stamp is a place you actually went. Collect them city by city, on the ground — not from a menu.</p>
            </div>
            <div className="hero-chips">
              <span className="chip"><Icon d={I.compass} style={{width:14,height:14,color:'var(--gold)'}}/> {data.level}</span>
              <span className="chip"><Icon d={I.pin} style={{width:14,height:14,color:'var(--gold)'}}/><b>{activeCity}</b></span>
            </div>
          </div>

          <div className="city-tabs">
            {LAUNCH_CITIES.map(c=>{
              const available = !!CITY_STAMPS[c];
              return available
                ? <button key={c} className={'city-tab'+(activeCity===c?' active':'')} onClick={()=>setActiveCity(c)}>{c.split(',')[0]}</button>
                : <button key={c} className="city-tab soon" disabled title={c.split(',')[0]+' passport is coming soon'}>{c.split(',')[0]} <span className="soon-pill">Soon</span></button>;
            })}
          </div>

          <PassportSpread city={activeCity} level={data.level}/>

          <HowItWorks/>

          <div className="soon-strip">
            <div>
              <div className="t">More cities, more stamps — <b>on the way.</b></div>
              <div className="d">Atlanta, Tampa, Orlando, and Miami passports unlock as their partner networks go live.</div>
            </div>
            <a href="/plan-my-trip.html" className="chip" style={{color:'var(--gold)'}}>Plan a trip <Icon d={I.arrow} style={{width:13,height:13}}/></a>
          </div>
        </div>
      </div>
      {loading&&<div className="boot"><div className="sp"></div><div className="t">Opening your passport…</div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
