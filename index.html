    <div style={{paddingTop:60,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',textAlign:'center',padding:'4rem 2rem',background:'var(--noir)'}}>
      <div style={{fontFamily:'var(--ff-display)',fontSize:'0.65rem',letterSpacing:'4px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'1.5rem'}}>Application Received</div>
      <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(2.5rem,5vw,4rem)',fontWeight:300,marginBottom:'1rem'}}>
        You&apos;re on the <em style={{color:'var(--gold)',fontStyle:'italic'}}>list</em>
      </h1>
      <p style={{fontSize:'1.02rem',color:'var(--mist)',lineHeight:1.9,maxWidth:520,marginBottom:'2rem'}}>
        Thank you, <strong style={{color:'var(--white)'}}>{form.biz}</strong>. Our team will review your application and reach out to <strong style={{color:'var(--white)'}}>{form.email}</strong> within 3 business days. Once approved, your listing goes live free for 6 months — then auto-converts to your chosen plan. No reapplication needed.
      </p>
      <div style={{background:'rgba(var(--gold-rgb),0.08)',border:'1px solid rgba(var(--gold-rgb),0.25)',padding:'1.5rem 2.5rem',marginBottom:'2rem',textAlign:'left',maxWidth:420}}>
        <div style={{fontSize:'0.60rem',letterSpacing:'3px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'0.75rem'}}>Your application summary</div>
        <div style={{fontSize:'0.90rem',color:'var(--mist)',lineHeight:2}}>
          <div><span style={{color:'var(--white)'}}>Business:</span> {form.biz}</div>
          <div><span style={{color:'var(--white)'}}>Cities:</span> {form.destinations.join(', ')}</div>
          <div><span style={{color:'var(--white)'}}>Plan interest:</span> {form.plan ? PLANS.find(p=>p.id===form.plan)?.name + ' — ' + PLANS.find(p=>p.id===form.plan)?.price + '/mo' : 'Not selected'}</div>
        </div>
      </div>
      <div style={{fontSize:'0.82rem',color:'var(--gold)',letterSpacing:'2px',textTransform:'uppercase'}}>BagFree Supplier Network · Powered by Valet By Nuor</div>
    </div>
  );

  // Step indicator
  const steps = ['Business Info', 'Products & Cities', 'Choose Plan'];

  return (
    <div style={{paddingTop:60,minHeight:'100vh',background:'var(--noir)'}}>

      {/* Header */}
      <div style={{padding:'4rem 3rem 3rem',background:'var(--gold)',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:'-30%',right:'-5%',width:400,height:400,background:'radial-gradient(ellipse,rgba(var(--bg-rgb),0.12),transparent 70%)',pointerEvents:'none'}}/>
        <div style={{fontSize:'0.72rem',letterSpacing:'4px',textTransform:'uppercase',color:'rgba(var(--bg-rgb),0.5)',marginBottom:'1rem',position:'relative'}}>Supplier Application</div>
        <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(2.5rem,5vw,4rem)',fontWeight:300,color:'var(--noir)',position:'relative'}}>
          Join the <em style={{fontStyle:'italic'}}>BagFree</em> Network
        </h1>
        <p style={{fontSize:'1.00rem',color:'rgba(var(--bg-rgb),0.6)',marginTop:'1rem',maxWidth:500,lineHeight:1.8,fontWeight:300,position:'relative'}}>
          Reach bag-free travelers in Florida, Georgia & the Caribbean. Apply for vetting — once approved, choose your subscription plan and go live.
        </p>
      </div>

      <div style={{maxWidth:780,margin:'0 auto',padding:'3rem 2rem'}}>

        {/* Step bar */}
        <div style={{display:'flex',marginBottom:'3rem',border:'1px solid var(--border)',overflow:'hidden'}}>
          {steps.map((s,i)=>(
            <div key={s} style={{flex:1,padding:'0.85rem',textAlign:'center',fontSize:'0.68rem',letterSpacing:'2px',textTransform:'uppercase',
              background:step===i+1?'var(--gold)':step>i+1?'rgba(var(--gold-rgb),0.12)':'transparent',
              color:step===i+1?'var(--noir)':step>i+1?'var(--gold)':'var(--mist)',
              borderRight:i<2?'1px solid var(--border)':'none',cursor:step>i+1?'pointer':'default',
              display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem'}}
              onClick={()=>step>i+1&&setStep(i+1)}>
              <span style={{width:18,height:18,borderRadius:'50%',
                background:step===i+1?'rgba(var(--bg-rgb),0.2)':step>i+1?'rgba(var(--gold-rgb),0.3)':'rgba(255,255,255,0.06)',
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.62rem',flexShrink:0}}>
                {step>i+1?'✓':i+1}
              </span>
              {s}
            </div>
          ))}
        </div>

        {/* STEP 1 — Business Info */}
        {step===1 && (
          <div style={{display:'flex',flexDirection:'column',gap:'1.1rem'}}>
            <div style={{fontSize:'0.60rem',letterSpacing:'3px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'0.25rem'}}>Tell us about your business</div>
            {[['biz','Business Name','text'],['contact','Contact Person','text'],['email','Email Address','email'],['phone','Phone / WhatsApp','tel'],['website','Website (optional)','text']].map(([k,l,t])=>(
              <div key={k}>
                <div style={{fontSize:'0.62rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--mist)',marginBottom:'0.4rem'}}>{l}</div>
                <input type={t} value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})}
                  style={{width:'100%',background:'var(--noir-2)',border:'1px solid var(--border)',color:'var(--white)',padding:'0.75rem 1rem',fontSize:'0.98rem',outline:'none',fontFamily:'var(--fb)',transition:'border-color 0.2s'}}
                  onFocus={e=>e.target.style.borderColor='rgba(var(--gold-rgb),0.5)'}
                  onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              </div>
            ))}
            <button onClick={()=>form.biz&&form.email&&setStep(2)}
              style={{background:'linear-gradient(135deg,var(--gold),#b8893e)',color:'var(--noir)',padding:'1rem',border:'none',fontSize:'0.78rem',fontWeight:600,letterSpacing:'3px',textTransform:'uppercase',opacity:(!form.biz||!form.email)?0.4:1,fontFamily:'var(--fb)',marginTop:'0.5rem'}}>
              Continue →
            </button>
          </div>
        )}

        {/* STEP 2 — Products & Cities */}
        {step===2 && (
          <div style={{display:'flex',flexDirection:'column',gap:'1.5rem'}}>
            <div>
              <div style={{fontSize:'0.62rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--mist)',marginBottom:'0.75rem'}}>Product Category</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
                {[["Women's Fashion",'👗'],["Men's Wear",'👔'],['Wellness','💊'],['Beauty & Grooming','💄'],['Baby & Family','🍼'],['Accessories','👜'],['Tech & Gadgets','📱'],['Food & Beverage','🍃'],['Other','✦']].map(([c,icon])=>(
                  <div key={c} onClick={()=>setForm({...form,category:c})}
                    style={{padding:'0.75rem',border:`1px solid ${form.category===c?'rgba(var(--gold-rgb),0.6)':'var(--border)'}`,cursor:'pointer',fontSize:'0.82rem',
                      color:form.category===c?'var(--white)':'var(--mist)',
                      background:form.category===c?'rgba(var(--gold-rgb),0.1)':'transparent',
                      textAlign:'center',transition:'all 0.2s'}}>
                    <div style={{fontSize:'1.2rem',marginBottom:'3px'}}>{icon}</div>
                    <div style={{fontSize:'0.68rem',letterSpacing:'0.5px'}}>{c}</div>
                  </div>
                ))}
              </div>
            </div>

            <div>
              <div style={{fontSize:'0.62rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--mist)',marginBottom:'0.5rem'}}>Cities You Serve</div>
              <div style={{fontSize:'0.72rem',color:'rgba(var(--gold-rgb),0.6)',marginBottom:'0.75rem'}}>Basic & Premium plans are priced per city. Elite covers all cities.</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
                {[
                  {id:'tampa',name:'Tampa Bay',state:'FL',img:'🌴'},
                  {id:'orlando',name:'Orlando',state:'FL',img:'🎆'},
                  {id:'miami',name:'Miami Beach',state:'FL',img:'🌊'},
                  {id:'keys',name:'Florida Keys',state:'FL',img:'🐠'},
                  {id:'atlanta',name:'Atlanta',state:'GA',img:'🏙️'},
                  {id:'savannah',name:'Savannah',state:'GA',img:'🌿'},
                  {id:'trinidad',name:'Trinidad & Tobago',state:'TT',img:'🏝️'},
                  {id:'svg',name:'St. Vincent & Grenadines',state:'VC',img:'⛵'},
                ].map(d=>(
                  <div key={d.id} onClick={()=>toggleDest(d.id)}
                    style={{padding:'0.75rem 1rem',border:`1px solid ${form.destinations.includes(d.id)?'rgba(var(--gold-rgb),0.6)':'var(--border)'}`,
                      cursor:'pointer',fontSize:'0.88rem',
                      color:form.destinations.includes(d.id)?'var(--white)':'var(--mist)',
                      background:form.destinations.includes(d.id)?'rgba(var(--gold-rgb),0.08)':'transparent',
                      display:'flex',alignItems:'center',gap:'0.6rem',transition:'all 0.2s'}}>
                    <span>{d.img}</span>
                    <div>
                      <div style={{fontSize:'0.82rem'}}>{d.name}</div>
                      <div style={{fontSize:'0.60rem',letterSpacing:'1px',color:'rgba(var(--gold-rgb),0.6)'}}>{d.state}</div>
                    </div>
                    {form.destinations.includes(d.id) && <span style={{marginLeft:'auto',color:'var(--gold)',fontSize:'0.72rem'}}>✓</span>}
                  </div>
                ))}
              </div>
            </div>

            <div>
              <div style={{fontSize:'0.62rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--mist)',marginBottom:'0.4rem'}}>Tell us about your products</div>
              <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={4}
                placeholder="Describe what you offer and why BagFree customers would love it..."
                style={{width:'100%',background:'var(--noir-2)',border:'1px solid var(--border)',color:'var(--white)',padding:'0.75rem 1rem',fontSize:'0.95rem',outline:'none',resize:'vertical',fontFamily:'var(--fb)',lineHeight:1.7}}/>
            </div>

            <div style={{display:'flex',gap:'1rem'}}>
              <button onClick={()=>setStep(1)} style={{background:'transparent',color:'var(--mist)',padding:'0.9rem 1.5rem',border:'1px solid var(--border)',fontSize:'0.75rem',letterSpacing:'2px',textTransform:'uppercase',fontFamily:'var(--fb)'}}>← Back</button>
              <button onClick={()=>form.category&&form.destinations.length>0&&form.description&&setStep(3)}
                style={{flex:1,background:'linear-gradient(135deg,var(--gold),#b8893e)',color:'var(--noir)',padding:'1rem',border:'none',fontSize:'0.78rem',fontWeight:600,letterSpacing:'3px',textTransform:'uppercase',fontFamily:'var(--fb)',
                  opacity:(!form.category||form.destinations.length===0||!form.description)?0.4:1}}>
                Continue →
              </button>
            </div>
          </div>
        )}

        {/* STEP 3 — Choose Plan */}
        {step===3 && (
          <div style={{display:'flex',flexDirection:'column',gap:'1.5rem'}}>
            {/* Business Type — Free Trial Eligibility */}
            <div style={{marginBottom:'1.5rem'}}>
              <div style={{fontSize:'0.60rem',letterSpacing:'3px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'0.5rem'}}>Business Type</div>
              <div style={{fontSize:'0.80rem',color:'var(--mist)',lineHeight:1.7,marginBottom:'1rem'}}>
                Select all that apply. Qualifying businesses receive a <strong style={{color:'var(--green)'}}>6-month free trial</strong> on their chosen plan — no card required until month 7.
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:'0.75rem'}}>
                {[
                  {id:'micro',    label:'Micro Business',    icon:'🌱', desc:'Under 10 employees'},
                  {id:'minority', label:'Minority Owned',    icon:'✊', desc:'Minority-owned & operated'},
                  {id:'veteran',  label:'Veteran Owned',     icon:'🎖', desc:'Military veteran owned'},
                  {id:'female',   label:'Female Owned',      icon:'⭐', desc:'Woman-owned business'},
                ].map(bt=>(
                  <div key={bt.id}
                    onClick={()=>setForm(f=>({...f,
                      bizTypes: f.bizTypes?.includes(bt.id)
                        ? f.bizTypes.filter(x=>x!==bt.id)
                        : [...(f.bizTypes||[]), bt.id]
                    }))}
                    style={{
                      padding:'0.85rem 1rem',
                      border:`1px solid ${form.bizTypes?.includes(bt.id)?'rgba(93,202,165,0.5)':'var(--border)'}`,
                      background:form.bizTypes?.includes(bt.id)?'rgba(93,202,165,0.06)':'transparent',
                      cursor:'pointer',transition:'all 0.2s',
                      display:'flex',alignItems:'center',gap:'0.65rem'
                    }}>
                    <span style={{fontSize:'1.1rem'}}>{bt.icon}</span>
                    <div>
                      <div style={{fontSize:'0.80rem',color:form.bizTypes?.includes(bt.id)?'var(--white)':'var(--mist)',fontWeight:form.bizTypes?.includes(bt.id)?500:400}}>{bt.label}</div>
                      <div style={{fontSize:'0.62rem',color:'rgba(var(--text-rgb),0.35)',marginTop:1}}>{bt.desc}</div>
                    </div>
                    {form.bizTypes?.includes(bt.id) && <span style={{marginLeft:'auto',color:'var(--green)',fontSize:'0.75rem',flexShrink:0}}>✓</span>}
                  </div>
                ))}
              </div>

              {/* Free trial banner */}
              {form.bizTypes?.length > 0 && (
                <div style={{background:'rgba(93,202,165,0.08)',border:'1px solid rgba(93,202,165,0.3)',padding:'1rem 1.25rem',display:'flex',alignItems:'center',gap:'1rem'}}>
                  <div style={{fontSize:'1.5rem',flexShrink:0}}>🎉</div>
                  <div>
                    <div style={{fontSize:'0.75rem',fontWeight:600,color:'var(--green)',letterSpacing:'1px',marginBottom:'2px'}}>
                      You qualify for a 6-month free trial!
                    </div>
                    <div style={{fontSize:'0.75rem',color:'rgba(var(--text-rgb),0.55)',lineHeight:1.6}}>
                      As a {form.bizTypes.map(t=>t==='micro'?'micro business':t==='minority'?'minority-owned':t==='veteran'?'veteran-owned':'female-owned').join(' & ')} business, your first 6 months are on us. Choose your plan below — you won&apos;t be charged until month 7.
                    </div>
                  </div>
                </div>
              )}

              {form.bizTypes?.length === 0 && (
                <div style={{fontSize:'0.72rem',color:'rgba(var(--text-rgb),0.3)',fontStyle:'italic',paddingLeft:'0.25rem'}}>
                  Not applicable? Leave unselected and proceed to choose your plan below.
                </div>
              )}
            </div>

            <div>
              <div style={{fontSize:'0.60rem',letterSpacing:'3px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'0.35rem'}}>Subscription Plans</div>
              <div style={{fontSize:'0.85rem',color:'var(--mist)',lineHeight:1.7,marginBottom:'1.5rem'}}>
                Select the plan that fits your goals. Payment is activated <strong style={{color:'var(--white)'}}>after your application is approved</strong> — you won&apos;t be charged now.
                {form.bizTypes?.length > 0 && <strong style={{color:'var(--green)'}}> Your 6-month free trial applies automatically.</strong>}
              </div>

              <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
                {PLANS.map(plan=>(
                  <div key={plan.id} onClick={()=>setForm({...form,plan:plan.id})}
                    style={{border:`1px solid ${form.plan===plan.id?plan.borderColor:'var(--border)'}`,
                      background:form.plan===plan.id?plan.color:'rgba(255,255,255,0.02)',
                      cursor:'pointer',padding:'1.5rem',transition:'all 0.25s',position:'relative'}}>
                    {plan.badge && (
                      <div style={{position:'absolute',top:'1rem',right:'1rem',fontSize:'0.58rem',letterSpacing:'2px',textTransform:'uppercase',
                        color:plan.id==='elite'?'var(--noir)':'var(--gold)',
                        background:plan.id==='elite'?'var(--gold)':'rgba(var(--gold-rgb),0.15)',
                        border:plan.id==='elite'?'none':'1px solid rgba(var(--gold-rgb),0.4)',
                        padding:'3px 10px'}}>
                        {plan.badge}
                      </div>
                    )}
                    {form.plan===plan.id && (
                      <div style={{position:'absolute',top:'1rem',left:'1rem',width:18,height:18,borderRadius:'50%',background:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.65rem',color:'var(--noir)',fontWeight:700}}>✓</div>
                    )}
                    <div style={{display:'flex',alignItems:'flex-start',gap:'1.25rem',paddingLeft:form.plan===plan.id?'1.75rem':'0'}}>
                      <div style={{flex:1}}>
                        <div style={{display:'flex',alignItems:'baseline',gap:'0.5rem',marginBottom:'0.25rem'}}>
                          <div style={{fontFamily:'var(--ff-display)',fontSize:'1.3rem',fontWeight:300,color:'var(--white)'}}>{plan.name}</div>
                          <div style={{fontFamily:'var(--ff-display)',fontSize:'2rem',fontWeight:300,color:'var(--gold)',lineHeight:1}}>{plan.price}</div>
                          <div style={{fontSize:'0.68rem',color:'var(--mist)',letterSpacing:'0.5px'}}>{plan.per}</div>
                        </div>

                        {/* Benefits */}
                        <div style={{display:'flex',flexDirection:'column',gap:'0.3rem',marginTop:'0.85rem'}}>
                          {plan.benefits.map(b=>(
                            <div key={b} style={{display:'flex',gap:'0.6rem',alignItems:'flex-start',fontSize:'0.82rem',color:'rgba(var(--text-rgb),0.7)'}}>
                              <span style={{color:'var(--green)',fontSize:'0.65rem',flexShrink:0,marginTop:3}}>✓</span>{b}
                            </div>
                          ))}
                          {plan.notIncluded.map(b=>(
                            <div key={b} style={{display:'flex',gap:'0.6rem',alignItems:'flex-start',fontSize:'0.82rem',color:'rgba(var(--text-rgb),0.28)'}}>
                              <span style={{fontSize:'0.65rem',flexShrink:0,marginTop:3}}>–</span>{b}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* City cost summary for Basic/Premium */}
            {form.plan && form.plan !== 'elite' && form.destinations.length > 0 && (
              <div style={{background:'rgba(var(--gold-rgb),0.06)',border:'1px solid rgba(var(--gold-rgb),0.2)',padding:'1.25rem'}}>
                <div style={{fontSize:'0.60rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'0.75rem'}}>Your estimated monthly cost</div>
                {form.destinations.map(d=>(
                  <div key={d} style={{display:'flex',justifyContent:'space-between',fontSize:'0.85rem',color:'var(--mist)',padding:'0.35rem 0',borderBottom:'1px solid rgba(var(--gold-rgb),0.08)'}}>
                    <span style={{color:'var(--white)'}}>{d.charAt(0).toUpperCase()+d.slice(1)}</span>
                    <span style={{color:'var(--gold)'}}>{form.plan==='basic'?'$59':'$99'}/mo</span>
                  </div>
                ))}
                <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.90rem',fontWeight:600,marginTop:'0.6rem',paddingTop:'0.6rem',borderTop:'1px solid rgba(var(--gold-rgb),0.2)'}}>
                  <span style={{color:'var(--white)'}}>Total</span>
                  <span style={{color:'var(--gold)',fontFamily:'var(--ff-display)',fontSize:'1.2rem',fontWeight:300}}>
                    ${form.destinations.length*(form.plan==='basic'?59:99)}/mo
                  </span>
                </div>
              </div>
            )}

            {form.plan === 'elite' && (
              <div style={{background:'rgba(var(--gold-rgb),0.08)',border:'1px solid rgba(var(--gold-rgb),0.35)',padding:'1.25rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:'0.60rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'0.25rem'}}>Elite — all cities included</div>
                  <div style={{fontSize:'0.82rem',color:'var(--mist)'}}>Unlimited city coverage · Home page placement</div>
                </div>
                <div style={{fontFamily:'var(--ff-display)',fontSize:'1.8rem',fontWeight:300,color:'var(--gold)'}}>$199/mo</div>
              </div>
            )}

            {/* 6 months free promo */}
            <div style={{background:'linear-gradient(135deg,rgba(93,202,165,0.12),rgba(93,202,165,0.06))',border:'1px solid rgba(93,202,165,0.35)',padding:'1.25rem',marginBottom:'0.25rem'}}>
              <div style={{display:'flex',alignItems:'center',gap:'0.6rem',marginBottom:'0.6rem'}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5DCAA5" strokeWidth="2.5"><circle cx="12" cy="8" r="6"/><path d="M12 14v8M8 18h8"/></svg>
                <span style={{fontSize:'0.62rem',letterSpacing:'2.5px',textTransform:'uppercase',color:'var(--green)',fontWeight:600}}>Founding Vendor Offer</span>
              </div>
              <div style={{fontSize:'0.92rem',color:'var(--white)',fontWeight:500,marginBottom:'0.4rem'}}>
                6 months free — then auto-converts to your chosen plan
              </div>
              <div style={{fontSize:'0.80rem',color:'rgba(var(--text-rgb),0.55)',lineHeight:1.8}}>
                Once approved, your listing goes live immediately at no charge for 6 months. At the end of the free period your Stripe subscription activates automatically on the plan you selected — no reapplication, no interruption. Cancel anytime before the 6 months ends.
              </div>
            </div>

            <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',padding:'1rem 1.25rem',fontSize:'0.78rem',color:'rgba(var(--text-rgb),0.4)',lineHeight:1.8,display:'flex',gap:'0.75rem',alignItems:'flex-start'}}>
              <span style={{color:'rgba(var(--gold-rgb),0.6)',flexShrink:0}}>ℹ</span>
              <span>You won&apos;t be charged during the 6-month free period. We&apos;ll send a Stripe setup link after approval to save your payment details — your card is only charged after month 6.</span>
            </div>

            <div style={{display:'flex',gap:'1rem'}}>
              <button onClick={()=>setStep(2)} style={{background:'transparent',color:'var(--mist)',padding:'0.9rem 1.5rem',border:'1px solid var(--border)',fontSize:'0.75rem',letterSpacing:'2px',textTransform:'uppercase',fontFamily:'var(--fb)'}}>← Back</button>
              <button
                onClick={async()=>{
                  if(!form.plan) return;
                  await Promise.all([
                    submitToFormspree({
                      type:'SUPPLIER APPLICATION',
                      business: form.biz,
                      contact: form.contact,
                      email: form.email,
                      phone: form.phone,
                      website: form.website || 'N/A',
                      category: form.category,
                      cities: form.destinations.join(', '),
                      planSelected: PLANS.find(p=>p.id===form.plan)?.name + ' — ' + PLANS.find(p=>p.id===form.plan)?.price + '/mo (6 months free, then auto-converts)',
                      description: form.description,
                      source:'BagFree Supplier Portal v2',
                    }),
                  ]);
                  setDone(true);
                }}
                style={{flex:1,background:'linear-gradient(135deg,var(--gold),#b8893e)',color:'var(--noir)',padding:'1rem',border:'none',
                  fontSize:'0.78rem',fontWeight:600,letterSpacing:'3px',textTransform:'uppercase',fontFamily:'var(--fb)',
                  opacity:!form.plan?0.4:1}}>
                Submit Application ✦
              </button>
            </div>

            <div style={{textAlign:'center',fontSize:'0.72rem',color:'rgba(var(--text-rgb),0.25)',lineHeight:1.7}}>
              6 months free · Auto-converts to chosen plan · Cancel before month 6 to avoid charges · BagFree Supplier Network
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── SHARED CART LOGIC ─────────────────────────────────────────────────────────
function useCart() {
  const [cart, setCart] = useState([]);
  function addToCart(product) {
    setCart(prev => {
      const exists = prev.find(i => i.id === product.id);
      if (exists) return prev.map(i => i.id === product.id ? {...i, qty: i.qty + 1} : i);
      return [...prev, {...product, qty: 1}];
    });
  }
  function removeFromCart(id) { setCart(prev => prev.filter(i => i.id !== id)); }
  function updateQty(id, qty) {
    if (qty < 1) return removeFromCart(id);
    setCart(prev => prev.map(i => i.id === id ? {...i, qty} : i));
  }
  const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
  const count = cart.reduce((sum, i) => sum + i.qty, 0);
  return {cart, addToCart, removeFromCart, updateQty, total, count};
}

async function stripeCheckout(cart) {
  const res = await fetch('/.netlify/functions/create-checkout', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      items: cart.map(i => ({id: i.id, name: i.name, price: i.price, qty: i.qty, desc: i.desc}))
    })
  });
  const data = await res.json();
  if (data.url) window.location.href = data.url;
  else alert('Checkout error. Please try again.');
}

              <button onClick={()=>removeFromCart(item.id)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.3)',cursor:'pointer',fontFamily:'var(--ff-body)',fontSize:'11px',marginLeft:4}}>✕</button>
            </div>
          </div>
        ))}
      </div>
      {cart.length > 0 && (
        <div style={{padding:'1.5rem',borderTop:'1px solid rgba(var(--gold-rgb),0.15)'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:'1.25rem'}}>
            <span style={{fontFamily:'var(--ff-body)',fontSize:'13px',color:'var(--mist)'}}>Total</span>

          </div>

            disabled={checking}
            style={{width:'100%',background:'var(--gold)',color:'var(--noir)',border:'none',padding:'0.9rem',fontFamily:'var(--ff-body)',fontSize:'12px',fontWeight:500,letterSpacing:'2px',textTransform:'uppercase',cursor:checking?'wait':'pointer',opacity:checking?0.7:1}}>
            {checking ? 'Redirecting...' : 'Checkout →'}
          </button>
          <div style={{fontFamily:'var(--ff-body)',fontSize:'10px',color:'rgba(245,237,216,0.3)',textAlign:'center',marginTop:'0.75rem',letterSpacing:'1px'}}>Secure checkout via Stripe</div>
        </div>
      )}
    </div>
  );
}

// ── PRODUCT CARD ──────────────────────────────────────────────────────────────
function ProductCard({product, onAdd}) {
  const [added, setAdded] = useState(false);
  function handleAdd() {
    onAdd(product);
    setAdded(true);
    setTimeout(() => setAdded(false), 1200);
  }
  return (
    <div style={{background:'var(--noir-2)',border:'1px solid rgba(var(--gold-rgb),0.1)',display:'flex',flexDirection:'column',position:'relative',transition:'border-color 0.2s'}}
      onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(var(--gold-rgb),0.3)'}
      onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(var(--gold-rgb),0.1)'}>
      {product.tag && (
        <div style={{position:'absolute',top:'0.75rem',right:'0.75rem',fontFamily:'var(--ff-body)',fontSize:'9px',letterSpacing:'2px',textTransform:'uppercase',background:product.tag==='Sale'?'rgba(var(--gold-rgb),0.9)':'rgba(var(--gold-rgb),0.15)',color:product.tag==='Sale'?'var(--noir)':'var(--gold)',padding:'3px 8px',border:'1px solid rgba(var(--gold-rgb),0.3)'}}>{product.tag}</div>
      )}
      <div style={{padding:'1.75rem 1.5rem',flex:1,display:'flex',flexDirection:'column'}}>
        <div style={{fontSize:'2rem',marginBottom:'0.75rem'}}>{product.icon}</div>
        <div style={{fontFamily:'var(--ff-display)',fontSize:'1rem',fontWeight:300,color:'var(--white)',marginBottom:'0.5rem',lineHeight:1.3,letterSpacing:'0.3px'}}>{product.name}</div>
        <div style={{fontFamily:'var(--ff-body)',fontSize:'12px',color:'rgba(245,237,216,0.45)',lineHeight:1.7,marginBottom:'1rem',flex:1,fontWeight:300}}>{product.desc}</div>
        <div style={{fontFamily:'var(--ff-display)',fontSize:'1.15rem',fontWeight:300,color:'var(--gold)',marginBottom:'1rem'}}>${product.price.toFixed(2)}</div>
        <button
          onClick={handleAdd}
          style={{background:added?'rgba(var(--gold-rgb),0.2)':'transparent',color:'var(--gold)',border:'1px solid rgba(var(--gold-rgb),0.35)',padding:'0.6rem 1rem',fontFamily:'var(--ff-body)',fontSize:'11px',letterSpacing:'2px',textTransform:'uppercase',cursor:'pointer',transition:'all 0.2s',width:'100%'}}>
          {added ? '✓ Added' : 'Add to Cart'}
        </button>
      </div>
    </div>
  );
}

// ── SHOP PAGE TEMPLATE ────────────────────────────────────────────────────────
function ShopPage({title, subtitle, gender, products, setPage}) {
  const {cart, addToCart, removeFromCart, updateQty, total, count} = useCart();
  const [cartOpen, setCartOpen] = useState(false);
  const [checking, setChecking] = useState(false);

  async function handleCheckout() {
    setChecking(true);
    await stripeCheckout(cart);
    setChecking(false);
  }

  return (
    <div style={{background:'var(--noir)',minHeight:'100vh'}}>
      {/* Header */}
      <div style={{background:'var(--noir-2)',borderBottom:'1px solid rgba(var(--gold-rgb),0.15)',padding:'1.25rem 2rem',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:100}}>
        <button onClick={()=>setPage('shop')} style={{background:'none',border:'none',color:'var(--mist)',cursor:'pointer',fontFamily:'var(--ff-body)',fontSize:'12px',letterSpacing:'2px',textTransform:'uppercase',display:'flex',alignItems:'center',gap:'6px'}}>← Shop</button>
        <div style={{fontFamily:'var(--ff-display)',fontSize:'1.1rem',fontWeight:300,color:'var(--white)',letterSpacing:'3px',textTransform:'uppercase'}}>{title}</div>
        <button onClick={()=>setCartOpen(true)} style={{background:'none',border:'1px solid rgba(var(--gold-rgb),0.3)',color:'var(--gold)',cursor:'pointer',fontFamily:'var(--ff-body)',fontSize:'11px',letterSpacing:'2px',textTransform:'uppercase',padding:'0.5rem 1rem',display:'flex',alignItems:'center',gap:'8px'}}>
          Cart {count > 0 && <span style={{background:'var(--gold)',color:'var(--noir)',borderRadius:'50%',width:18,height:18,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:700}}>{count}</span>}
        </button>
      </div>

      {/* Hero */}
      <div style={{padding:'3rem 2rem 2rem',textAlign:'center',borderBottom:'1px solid rgba(var(--gold-rgb),0.08)'}}>
        <div style={{fontFamily:'var(--ff-body)',fontSize:'10px',letterSpacing:'4px',color:'rgba(var(--gold-rgb),0.55)',textTransform:'uppercase',marginBottom:'1rem',display:'flex',alignItems:'center',justifyContent:'center',gap:'1rem'}}>
          <span style={{width:20,height:1,background:'rgba(var(--gold-rgb),0.3)',display:'inline-block'}}/>
          BagFree Collection
          <span style={{width:20,height:1,background:'rgba(var(--gold-rgb),0.3)',display:'inline-block'}}/>
        </div>
        <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(2rem,4vw,3rem)',fontWeight:300,color:'var(--white)',letterSpacing:'-0.3px',marginBottom:'0.5rem'}}>{subtitle}</h1>
        <p style={{fontFamily:'var(--ff-body)',fontSize:'13px',color:'rgba(245,237,216,0.4)',fontWeight:300}}>Delivered to your hotel room · Same-day available</p>
      </div>

      {/* Grid */}
      <div style={{maxWidth:1100,margin:'0 auto',padding:'2.5rem 1.5rem'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:1,background:'rgba(var(--gold-rgb),0.06)'}}>
          {products.filter(p=>p.category===gender).map(p => (
            <ProductCard key={p.id} product={p} onAdd={addToCart}/>
          ))}
        </div>
      </div>

      {/* Floating cart button on mobile */}
      {count > 0 && !cartOpen && (
        <div style={{position:'fixed',bottom:'2rem',right:'2rem',zIndex:99}}>
          <button onClick={()=>setCartOpen(true)} style={{background:'var(--gold)',color:'var(--noir)',border:'none',padding:'0.85rem 1.5rem',fontFamily:'var(--ff-body)',fontSize:'12px',fontWeight:500,letterSpacing:'2px',textTransform:'uppercase',cursor:'pointer',display:'flex',alignItems:'center',gap:'8px',boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
            Cart ({count}) · ${total.toFixed(2)}
          </button>
        </div>
      )}

      {/* Cart overlay */}
      {cartOpen && (
        <>
          <div onClick={()=>setCartOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:999}}/>
          <CartDrawer cart={cart} removeFromCart={removeFromCart} updateQty={updateQty} total={total} onClose={()=>setCartOpen(false)} onCheckout={handleCheckout} checking={checking}/>
        </>
      )}
    </div>
  );
}

// ── STEP 3: VENDOR SELECT ─────────────────────────────────────────────────────

  const categories = isMens ? MENS_CATEGORIES : WOMENS_CATEGORIES;
  const category = categories.find(c => c.id === categoryId) || categories[0];
  const catPage = isMens ? 'cat-mens' : 'cat-womens';

  // Determine which vendors carry this category
  const availableVendors = Object.values(VENDOR_OFFERINGS).filter(v =>
    v.categories.includes(categoryId) ||
    (categoryId === 'rental' && v.isRental)
  );

  // Future vendor slot
  const futureSlots = Math.max(0, 3 - availableVendors.length);

  function handleVendorClick(vendor) {
    if (vendor.url) {
      window.open(vendor.url, '_self');
    } else {
      // Go to the full shop page
      setPage(isMens ? 'shop-mens' : 'shop-womens');
    }

  return (
    <div style={{background:'var(--noir)',minHeight:'100vh',padding:'5rem 2rem 4rem'}}>

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState(() => {
    const h = window.location.hash.replace('#','');
    return h || 'home';
  });
  const [activeVendor, setActiveVendor] = useState('valet-by-nuor');

  function navigate(p) {
    window.location.hash = p;
    setPage(p);
    window.scrollTo(0,0);
  }

  React.useEffect(()=>{
    function onPop(){
      const h = window.location.hash.replace('#','');
      setPage(h||'home');
      window.scrollTo(0,0);
    }
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  },[]);

  return (
    <>
      <Nav page={page} setPage={navigate}/>
      {page==='home' && <Home setPage={navigate}/>}
      {page==='shop' && <ShopLanding setPage={navigate}/>}
      {page==='cat-mens' && <CategorySelectPage gender="mens" setPage={navigate}/>}
      {page==='cat-womens' && <CategorySelectPage gender="womens" setPage={navigate}/>}
      {/* Vendor select pages — mens */}
      {page==='vendors-mens-kits' && <VendorSelectPage gender="mens" categoryId="kits" setPage={navigate}/>}
      {page==='vendors-mens-shirts' && <VendorSelectPage gender="mens" categoryId="shirts" setPage={navigate}/>}
      {page==='vendors-mens-bottoms' && <VendorSelectPage gender="mens" categoryId="bottoms" setPage={navigate}/>}
      {page==='vendors-mens-essentials' && <VendorSelectPage gender="mens" categoryId="essentials" setPage={navigate}/>}
      {/* Vendor select pages — womens */}
      {page==='vendors-womens-kits' && <VendorSelectPage gender="womens" categoryId="kits" setPage={navigate}/>}
      {page==='vendors-womens-tops' && <VendorSelectPage gender="womens" categoryId="tops" setPage={navigate}/>}
      {page==='vendors-womens-bottoms' && <VendorSelectPage gender="womens" categoryId="bottoms" setPage={navigate}/>}
      {page==='vendors-womens-essentials' && <VendorSelectPage gender="womens" categoryId="essentials" setPage={navigate}/>}
      {page==='vendors-womens-rental' && <VendorSelectPage gender="womens" categoryId="rental" setPage={navigate}/>}
      {page==='shop-mens' && <ShopPage title="Men's" subtitle="Men's Collection" gender="mens" products={PRODUCTS} setPage={navigate}/>}
      {page==='shop-womens' && <ShopPage title="Women's" subtitle="Women's Collection" gender="womens" products={PRODUCTS} setPage={navigate}/>}
      {page==='vendors' && <VendorMarketplace setPage={navigate} setActiveVendor={setActiveVendor}/>}
      {page==='products' && <ProductsPage setPage={navigate}/>}
      {page==='hotel' && <HotelConcierge/>}
      {page==='style' && <StylePreference setPage={navigate}/>}
      {page==='supplier' && <SupplierPortal/>}
      {page==='cruise' && <CruisePage setPage={navigate}/>}
      <footer style={{background:'var(--noir-2)',padding:'2rem 3rem',display:'flex',justifyContent:'space-between',alignItems:'center',borderTop:'1px solid var(--border)',flexWrap:'wrap',gap:'1rem'}}>
        <div style={{fontFamily:'var(--ff-display)',fontSize:'1.2rem',fontWeight:300,letterSpacing:'3px',textTransform:'uppercase'}}>Bag<span style={{color:'var(--gold)'}}>Free</span></div>
        <div style={{fontSize:'0.78rem',color:'var(--mist)',letterSpacing:'1px'}}>
          Powered by Valet By Nuor · <a href="https://valetbynuor.com" target="_blank" style={{color:'var(--gold)',textDecoration:'none'}}>valetbynuor.com</a> · (813) 816-2448
        </div>
        <div style={{fontSize:'0.75rem',color:'var(--mist)'}}>© 2026 BagFree · All rights reserved</div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
function hpCalc() {
  const s = window._hpState || {};
  const days  = parseInt(s['hp-days']  || document.getElementById('hp-days')?.value  || 7);
  const style = s['hp-style'] || document.getElementById('hp-style')?.value || 'leisure';

  // Traditional costs — vary by days and style
  const checked    = days >= 10 ? 210 : 140;  // 2 bags for longer trips
  const overweight = Math.round(checked * 0.2);
  const laundry    = days >= 14 ? 160 : days >= 10 ? 120 : days >= 7 ? 85 : days >= 5 ? 55 : 30;
  const forgotten  = days >= 14 ? 160 : days >= 10 ? 130 : days >= 7 ? 95 : 65;

  const preShopping = {
    luxury:   480,
    business: 280,
    leisure:  180,
    wellness: 220,
  }[style] || 180;

  const tradTotal = checked + overweight + laundry + forgotten + preShopping;

  // BagFree costs — scale with trip length
  const kitBase   = { luxury:480, leisure:220, business:320, wellness:280 };
  const curators  = { luxury:280, leisure:130, business:180, wellness:140 };
  const kitMult   = days >= 14 ? 1.6 : days >= 10 ? 1.3 : 1.0;
  const kitPrice  = Math.round((kitBase[style] || 220) * kitMult);
  const curator   = curators[style] || 130;
  const delivery  = 35;
  const bfTotal  = kitPrice + curator + delivery;
  const saving   = tradTotal - bfTotal;

  const kitNames = { luxury:'Luxury Wardrobe Kit', leisure:'Stay Fresh Kit', business:'Business Travel Kit', wellness:'Wellness Travel Kit' };
  const shopLabels = {
    luxury:   'Pre-trip shopping (clothes, toiletries, accessories)',
    business: 'Pre-trip shopping (shirts, shoes, grooming)',
    leisure:  'Pre-trip shopping (clothes, sunscreen, toiletries)',
    wellness: 'Pre-trip shopping (activewear, supplements, gear)',
  };

  function row(label, val, color) {
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.65rem 0;border-bottom:1px solid rgba(var(--text-rgb),0.05);gap:1rem">
      <span style="font-size:1rem;color:rgba(var(--text-rgb),0.65);flex:1">${label}</span>
      <span style="font-size:1.05rem;font-weight:500;color:${color};white-space:nowrap">${val}</span>
    </div>`;
  }

  const tradEl = document.getElementById('hp-trad-items');
  if (tradEl) tradEl.innerHTML =
    row('Checked bag fee (round trip)', '$'+checked, 'rgba(var(--text-rgb),0.85)') +
    row('Overweight bag risk', '$'+overweight, 'rgba(var(--text-rgb),0.85)') +
    row(shopLabels[style] || shopLabels.leisure, '$'+preShopping, 'rgba(var(--text-rgb),0.85)') +
    row('Hotel laundry ('+days+' days)', '$'+laundry, 'rgba(var(--text-rgb),0.85)') +
    row('Forgotten & replacement items', '$'+forgotten, 'rgba(var(--text-rgb),0.85)');

  const bfEl = document.getElementById('hp-bf-items');
  if (bfEl) bfEl.innerHTML =
    row('Checked bag fee', '$0', 'var(--green)') +
    row('Pre-trip shopping', '$0', 'var(--green)') +
    row('Hotel laundry', '$0', 'var(--green)') +
    row('Forgotten items', '$0', 'var(--green)') +
    row(kitNames[style]+' · Valet by Nuor', '$'+kitPrice, 'var(--gold)') +
    row('Local curator curation', '$'+curator, 'var(--gold)') +
    row('Hotel delivery fee', '$'+delivery, 'var(--gold)');

  const tt = document.getElementById('hp-trad-total');
  if (tt) tt.textContent = '$'+tradTotal;
  const bt = document.getElementById('hp-bf-total');
  if (bt) bt.textContent = '$'+bfTotal;
  const sv = document.getElementById('hp-saving');
  if (sv) sv.textContent = saving > 0 ? '$'+saving : '—';
}
// Run on load and re-run whenever React re-mounts the cost section
window.hpCalc = hpCalc;
setTimeout(hpCalc, 1200);
setTimeout(hpCalc, 2500);

// Watch for the cost comparison elements appearing after React navigation
const _hpObserver = new MutationObserver(() => {
  const el = document.getElementById('hp-trad-items');
  if (el && el.innerHTML === '') {
    hpCalc();
  }
});
_hpObserver.observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
