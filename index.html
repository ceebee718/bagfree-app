<style>
:root{
  --bg:#0a0f1e; --bg-2:#0f1525; --card:#131a2c; --card-hover:#1a2238;
  --gold:#c9a96e; --gold-bright:#d4b87a; --gold-light:#e8cfa0;
  --white:#fdfcf8; --muted:rgba(253,252,248,0.62); --faint:rgba(253,252,248,0.38);
  --border:rgba(201,169,110,0.16); --border-soft:rgba(253,252,248,0.06);
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-body:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff-body);background:var(--bg);color:var(--white);font-weight:300;overflow-x:hidden;overflow-y:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,a{font-family:inherit;color:inherit;cursor:pointer}
button{background:none;border:none}
a{text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(201,169,110,0.18);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(201,169,110,0.35)}

.app{display:grid;grid-template-columns:260px 1fr 340px;min-height:100vh}
@media (max-width:1280px){.app{grid-template-columns:240px 1fr 300px}}
@media (max-width:1024px){.app{grid-template-columns:220px 1fr}.right-rail{display:none}}
/* mobile shell defaults (overridden in the 720px block) */
.mobile-bar{display:none}
.drawer-overlay{display:none}
.sidebar-close{display:none}
.hamburger{background:none;border:0;display:flex;flex-direction:column;gap:5px;padding:8px;cursor:pointer}
.hamburger span{display:block;width:22px;height:2px;background:var(--gold);border-radius:2px}
.mobile-brand{font-family:var(--ff-display);letter-spacing:5px;color:var(--gold);font-size:1.05rem;font-weight:500}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .mobile-bar{display:flex;align-items:center;gap:0.8rem;position:sticky;top:0;z-index:90;background:var(--bg-2);border-bottom:1px solid var(--border-soft);padding:0.6rem 1rem;height:56px}
  .mobile-bar-spacer{flex:1}
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100%;width:284px;max-width:84vw;z-index:120;transform:translateX(-100%);transition:transform .28s ease;border-right:1px solid var(--border-soft)}
  .sidebar.sidebar--open{transform:translateX(0)}
  .drawer-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:110;opacity:0;pointer-events:none;transition:opacity .28s}
  .drawer-overlay.show{opacity:1;pointer-events:auto}
  .sidebar-close{display:flex;align-items:center;justify-content:center;position:absolute;top:0.8rem;right:0.8rem;width:32px;height:32px;border:1px solid var(--border-soft);border-radius:50%;background:none;color:var(--white);cursor:pointer;z-index:2}
  .sidebar-close svg{width:15px;height:15px}
  .main{padding:1.2rem 1.1rem 4rem}
  .topbar{flex-direction:column;gap:0}
  .topbar-actions{display:none}
  .greeting-title{font-size:2rem}
}

.sidebar{background:var(--bg-2);border-right:1px solid var(--border-soft);padding:2rem 1.4rem;display:flex;flex-direction:column;gap:2.4rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:0.4rem;padding:0.4rem 0 0.6rem}
.brand-ornament{width:18px;height:18px;color:var(--gold);opacity:0.85;margin-bottom:0.2rem}
.brand-name{font-family:var(--ff-display);font-size:1.65rem;font-weight:500;letter-spacing:5px;color:var(--gold);line-height:1}
.brand-tag{font-size:0.58rem;letter-spacing:4.5px;color:var(--gold);opacity:0.7;font-weight:300}

.nav{display:flex;flex-direction:column;gap:0.15rem}
.nav-item{display:flex;align-items:center;gap:0.85rem;padding:0.78rem 0.95rem;border-radius:8px;color:var(--muted);font-size:0.92rem;font-weight:400;letter-spacing:0.2px;transition:all 0.2s ease;border:1px solid transparent}
.nav-item:hover{background:rgba(201,169,110,0.05);color:var(--white)}
.nav-item.active{background:rgba(201,169,110,0.08);color:var(--gold);border-color:rgba(201,169,110,0.18)}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:0.9}
.nav-item.active svg{opacity:1}

.rewards-card{margin-top:auto;background:linear-gradient(165deg,rgba(201,169,110,0.10),rgba(201,169,110,0.02));border:1px solid var(--border);border-radius:12px;padding:1.3rem 1.2rem;display:flex;flex-direction:column;gap:0.55rem}
.rewards-head{display:flex;align-items:center;gap:0.6rem;color:var(--gold);font-size:0.6rem;letter-spacing:3px;font-weight:600;text-transform:uppercase}
.rewards-head svg{width:14px;height:14px}
.rewards-points{font-family:var(--ff-display);font-size:2.4rem;font-weight:400;color:var(--white);line-height:1.1}
.rewards-label{font-size:0.72rem;color:var(--faint);letter-spacing:0.5px;margin-bottom:0.5rem}
.rewards-link{display:flex;align-items:center;gap:0.4rem;color:var(--gold);font-size:0.76rem;letter-spacing:1.5px;font-weight:500;text-transform:uppercase;padding-top:0.6rem;border-top:1px solid rgba(201,169,110,0.12);transition:gap 0.25s ease}
.rewards-link:hover{gap:0.7rem}
.rewards-link svg{width:14px;height:14px}

.main{padding:2rem 2.8rem 3rem;display:flex;flex-direction:column;gap:1.8rem;min-width:0}
@media (max-width:900px){.main{padding:1.4rem 1.4rem 2rem}}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;flex-wrap:wrap}
.greeting{display:flex;flex-direction:column;gap:0.45rem;min-width:0;flex:1}
.greeting-sub{display:flex;align-items:center;gap:0.5rem;color:var(--muted);font-size:0.92rem;font-weight:300}
.greeting-sub svg{width:16px;height:16px;color:var(--gold)}
.greeting-title{font-family:var(--ff-display);font-size:clamp(2.4rem,4.2vw,3.4rem);font-weight:400;letter-spacing:-0.5px;line-height:1.05;margin-top:0.2rem}
.greeting-tag{color:var(--muted);font-size:0.96rem;font-weight:300;margin-top:0.45rem}
.meta-row{display:flex;align-items:center;gap:1.4rem;margin-top:0.9rem;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:0.45rem;color:var(--muted);font-size:0.85rem}
.meta-item svg{width:14px;height:14px;color:var(--gold)}
.meta-item.clickable{cursor:pointer;padding:0.35rem 0.7rem;border-radius:30px;border:1px solid var(--border-soft);transition:all 0.2s;background:rgba(255,255,255,0.02)}
.meta-item.clickable:hover{border-color:var(--border);background:rgba(201,169,110,0.06);color:var(--white)}
.meta-item.clickable .chev{width:11px;height:11px;color:var(--muted);transition:transform 0.2s}
.meta-item.clickable.open .chev{transform:rotate(180deg)}

.city-menu{
  position:absolute;top:calc(100% + 8px);left:0;z-index:60;
  min-width:240px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;
  padding:0.4rem;box-shadow:0 20px 40px rgba(0,0,0,0.5);
  animation:menuIn 0.18s ease-out;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.city-menu-item{
  display:flex;align-items:center;justify-content:space-between;gap:0.8rem;
  padding:0.7rem 0.85rem;border-radius:6px;
  font-size:0.85rem;color:var(--white);font-weight:400;cursor:pointer;
  transition:background 0.15s;width:100%;text-align:left;
}
.city-menu-item:hover{background:rgba(201,169,110,0.08)}
.city-menu-item.active{color:var(--gold)}
.city-menu-item .city-region{font-size:0.7rem;color:var(--faint);font-weight:300;margin-top:0.15rem;display:block}
.city-menu-item .tick{color:var(--gold);font-size:0.85rem}
.city-menu-item.disabled{color:var(--faint);cursor:not-allowed}
.city-menu-item.disabled:hover{background:transparent}
.city-menu-item .soon{font-size:0.55rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);opacity:0.7;background:rgba(201,169,110,0.08);padding:0.15rem 0.4rem;border-radius:3px}
.meta-anchor{position:relative}

.sidebar-city{
  margin-top:-1.2rem;padding:0.75rem 0.95rem;border-radius:8px;
  border:1px solid var(--border-soft);background:rgba(201,169,110,0.03);
  display:flex;align-items:center;justify-content:space-between;gap:0.5rem;
  cursor:pointer;transition:all 0.2s;
}
.sidebar-city:hover{border-color:var(--border);background:rgba(201,169,110,0.06)}
.sidebar-city:hover .sidebar-city-chev{transform:translateX(3px);color:var(--gold)}
.sidebar-city-info{display:flex;flex-direction:column;gap:0.15rem;min-width:0;flex:1}
.sidebar-city-label{font-size:0.55rem;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;font-weight:600}
.sidebar-city-name{font-size:0.88rem;color:var(--white);font-weight:400;letter-spacing:0.3px;display:flex;align-items:center;gap:0.4rem}
.sidebar-city-name svg{width:11px;height:11px;color:var(--gold);flex-shrink:0}
.sidebar-city-chev{width:14px;height:14px;color:var(--faint);flex-shrink:0;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.sidebar-city-chev svg{width:100%;height:100%}

/* ── Search ───────────────────────────────────────────────────────── */
.search-wrap{position:relative;margin-top:1.4rem;max-width:780px}
.search-bar{
  display:flex;align-items:center;gap:0.9rem;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border-soft);
  border-radius:14px;padding:1.05rem 1.4rem;
  transition:all 0.25s ease;cursor:text;
}
.search-bar:hover,.search-bar.focused{
  border-color:rgba(201,169,110,0.4);
  background:rgba(201,169,110,0.04);
  box-shadow:0 0 0 4px rgba(201,169,110,0.06);
}
.search-bar > svg{width:20px;height:20px;color:var(--gold);flex-shrink:0}
.search-go{display:flex;align-items:center;cursor:pointer;flex-shrink:0}
.search-go:hover svg{color:var(--gold-light)}
.search-input{
  background:transparent;border:0;outline:0;
  font-family:var(--ff-body);font-size:0.98rem;
  color:var(--white);width:100%;font-weight:300;letter-spacing:0.2px;
}
.search-input::placeholder{color:var(--faint);font-style:italic;font-weight:300}
.search-kbd{font-size:0.62rem;letter-spacing:1.2px;color:var(--faint);border:1px solid var(--border-soft);padding:0.22rem 0.5rem;border-radius:5px;font-family:var(--ff-body);background:rgba(255,255,255,0.02);flex-shrink:0}
.search-clear{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.08);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s}
.search-clear:hover{background:rgba(201,169,110,0.15);color:var(--white)}
.search-clear svg{width:11px;height:11px}

.search-dropdown{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:40;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:0.5rem;box-shadow:0 30px 60px rgba(0,0,0,0.55),0 0 0 1px rgba(201,169,110,0.08);
  max-height:520px;overflow-y:auto;
  animation:menuIn 0.18s ease-out;
}
.search-section{padding:0.55rem 0.3rem}
.search-section+.search-section{border-top:1px solid var(--border-soft);margin-top:0.2rem;padding-top:0.7rem}
.search-section-label{display:flex;align-items:center;gap:0.5rem;font-size:0.55rem;letter-spacing:3px;color:var(--gold);font-weight:600;text-transform:uppercase;padding:0 0.7rem 0.55rem}
.search-section-label svg{width:11px;height:11px}
.search-section-header{display:flex;justify-content:space-between;align-items:baseline;padding:0 0.7rem 0.55rem;gap:0.6rem}
.search-section-header .search-section-label{padding:0}
.search-section-action{font-size:0.58rem;letter-spacing:1.5px;color:var(--faint);text-transform:uppercase;font-weight:500;cursor:pointer;transition:color 0.15s;background:none;border:0}
.search-section-action:hover{color:var(--gold)}
.search-suggest-remove{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--faint);opacity:0;transition:all 0.15s;flex-shrink:0;
  background:transparent;border:0;cursor:pointer;
}
.search-suggest:hover .search-suggest-remove{opacity:1}
.search-suggest-remove:hover{background:rgba(255,255,255,0.08);color:var(--white)}
.search-suggest-remove svg{width:11px;height:11px}
.search-suggest{
  display:flex;align-items:center;gap:0.85rem;
  padding:0.65rem 0.8rem;border-radius:8px;
  cursor:pointer;transition:background 0.15s;
  width:100%;text-align:left;color:var(--white);
}
.search-suggest:hover,.search-suggest.hi{background:rgba(201,169,110,0.08)}
.search-suggest-icon{
  width:34px;height:34px;border-radius:7px;
  background:rgba(201,169,110,0.06);
  border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);flex-shrink:0;overflow:hidden;
  background-size:cover;background-position:center;
}
.search-suggest-icon svg{width:14px;height:14px}
.search-suggest-icon.has-img{background-color:#1a2238}
.search-suggest-text{flex:1;min-width:0}
.search-suggest-title{font-size:0.88rem;color:var(--white);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-suggest-title mark{background:rgba(201,169,110,0.18);color:var(--gold-bright);padding:0 2px;border-radius:2px;font-weight:500}
.search-suggest-meta{font-size:0.7rem;color:var(--muted);margin-top:0.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-suggest-arrow{width:14px;height:14px;color:var(--faint);opacity:0;transition:all 0.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.search-suggest-arrow svg{width:100%;height:100%}
.search-suggest:hover .search-suggest-arrow{opacity:1;color:var(--gold);transform:translateX(2px)}
.search-empty{padding:1.5rem 1rem;text-align:center;color:var(--muted);font-size:0.85rem;font-style:italic}
.search-empty strong{color:var(--white);font-style:normal}

/* Search results page */
.results-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.results-title{font-family:var(--ff-display);font-size:clamp(1.8rem,3vw,2.4rem);font-weight:400;letter-spacing:-0.3px;line-height:1.1}
.results-title em{font-style:italic;color:var(--gold)}
.results-count{font-size:0.85rem;color:var(--muted);font-weight:300}
.results-clear{font-size:0.72rem;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.35rem;transition:gap 0.2s}
.results-clear:hover{gap:0.55rem}
.results-clear svg{width:12px;height:12px}

.smart-match{
  display:inline-flex;align-items:center;gap:0.5rem;
  background:linear-gradient(135deg,rgba(201,169,110,0.10),rgba(201,169,110,0.04));
  border:1px solid rgba(201,169,110,0.25);
  padding:0.55rem 0.9rem;border-radius:30px;margin-top:0.7rem;
  font-size:0.78rem;color:var(--white);font-weight:300;
}
.smart-match svg{width:13px;height:13px;color:var(--gold);flex-shrink:0}
.smart-match-label{color:var(--gold);font-weight:600;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;margin-right:0.15rem}
.smart-match-terms{color:var(--white);font-weight:400}

.results-group{display:flex;flex-direction:column;gap:1rem;margin-top:1.4rem}
.results-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:0.8rem;padding-left:0.2rem}
.results-group-title{font-family:var(--ff-display);font-size:1.4rem;font-weight:500;letter-spacing:-0.2px}
.results-group-count{font-size:0.7rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:600}

.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media (max-width:1200px){.results-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.results-grid{grid-template-columns:1fr}}

.result-card{
  background:var(--card);border:1px solid var(--border-soft);
  border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
  transition:all 0.3s ease;cursor:pointer;text-decoration:none;color:inherit;
}
.result-card:hover{transform:translateY(-3px);border-color:rgba(201,169,110,0.3);box-shadow:0 16px 36px -8px rgba(0,0,0,0.4)}
.result-img{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;background-color:#1a2238;position:relative}
.result-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(10,15,30,0.4))}
.result-cat{position:absolute;top:0.7rem;left:0.7rem;z-index:2;font-size:0.55rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(10,15,30,0.75);backdrop-filter:blur(8px);padding:0.3rem 0.55rem;border-radius:4px;font-weight:600;border:1px solid rgba(201,169,110,0.2)}
.result-rank{position:absolute;top:0.7rem;right:0.7rem;z-index:2;font-size:0.55rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--white);background:rgba(201,169,110,0.85);padding:0.3rem 0.5rem;border-radius:4px;font-weight:700;display:flex;align-items:center;gap:0.25rem}
.result-rank svg{width:9px;height:9px}
.result-body{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:0.55rem;flex:1}
.result-title{font-family:var(--ff-display);font-size:1.25rem;font-weight:500;line-height:1.15;letter-spacing:-0.2px}
.result-city{font-size:0.7rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:0.35rem}
.result-city svg{width:10px;height:10px;color:var(--gold)}
.result-desc{font-size:0.8rem;color:var(--muted);line-height:1.5;font-weight:300;flex:1}
.result-cta{display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;padding:0.65rem 0.85rem;border:1px solid var(--border);background:transparent;border-radius:8px;color:var(--gold);font-size:0.68rem;letter-spacing:2px;font-weight:600;text-transform:uppercase;transition:all 0.2s;margin-top:0.3rem}
.result-cta:hover{background:rgba(201,169,110,0.08);border-color:rgba(201,169,110,0.4)}
.result-cta svg{width:12px;height:12px}

.results-empty{padding:3rem 2rem;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--border-soft);border-radius:12px;margin-top:1.4rem}
.results-empty-title{font-family:var(--ff-display);font-size:1.4rem;color:var(--white);margin-bottom:0.5rem;font-weight:400}
.results-empty-tag{font-size:0.85rem;line-height:1.55}

/* Social result variants */
.result-card.social .result-img{aspect-ratio:1/1.1}
.result-platform{
  position:absolute;top:0.7rem;left:0.7rem;z-index:2;
  display:flex;align-items:center;gap:0.35rem;
  font-size:0.62rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--white);background:rgba(10,15,30,0.78);backdrop-filter:blur(8px);
  padding:0.3rem 0.55rem;border-radius:4px;font-weight:600;border:1px solid rgba(255,255,255,0.12);
}
.result-platform svg{width:11px;height:11px}
.result-platform.p-tiktok{background:rgba(0,242,234,0.18);border-color:rgba(0,242,234,0.4);color:#22f5ed}
.result-platform.p-instagram{background:linear-gradient(135deg,rgba(225,48,108,0.25),rgba(245,133,41,0.18));border-color:rgba(225,48,108,0.4);color:#f8a4be}
.result-platform.p-youtube{background:rgba(255,0,0,0.18);border-color:rgba(255,0,0,0.4);color:#ff7a7a}
.result-platform.p-threads{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);color:var(--white)}
.result-platform.p-twitter{background:rgba(29,161,242,0.15);border-color:rgba(29,161,242,0.4);color:#7fc9ff}
.result-platform.p-reddit{background:rgba(255,69,0,0.15);border-color:rgba(255,69,0,0.4);color:#ff9966}
.result-platform.p-vimeo{background:rgba(26,183,234,0.15);border-color:rgba(26,183,234,0.4);color:#5fcfee}
.result-play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
  pointer-events:none;
}
.result-play-btn{
  width:54px;height:54px;border-radius:50%;background:rgba(10,15,30,0.7);
  border:1.5px solid rgba(255,255,255,0.35);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;color:var(--white);
  transition:all 0.3s ease;
}
.result-card.social:hover .result-play-btn{background:var(--gold);color:var(--bg);transform:scale(1.05);border-color:var(--gold)}
.result-play-btn svg{width:20px;height:20px;margin-left:3px}
.result-creator{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;color:var(--muted);font-weight:400}
.result-creator-handle{color:var(--white);font-weight:500}
.result-creator-stats{margin-left:auto;font-size:0.7rem;color:var(--faint);display:flex;align-items:center;gap:0.3rem}
.result-creator-stats svg{width:11px;height:11px;color:var(--gold)}
.result-card.social .result-title{font-size:1.05rem;font-family:var(--ff-body);font-weight:500;letter-spacing:0;line-height:1.35}

/* ── Detail view (stays on BagFree domain) ──────────────────────────────── */
.detail-wrap{display:flex;flex-direction:column;gap:1.6rem}
.detail-back{
  display:inline-flex;align-items:center;gap:0.45rem;
  font-size:0.72rem;letter-spacing:1.5px;color:var(--gold);
  text-transform:uppercase;font-weight:600;cursor:pointer;
  padding:0.5rem 0;transition:gap 0.2s;align-self:flex-start;background:none;border:0;
}
.detail-back:hover{gap:0.7rem}
.detail-back svg{width:14px;height:14px}

.detail-hero{
  position:relative;width:100%;aspect-ratio:16/9;
  border-radius:16px;overflow:hidden;background-color:#1a2238;
  background-size:cover;background-position:center;
  cursor:pointer;transition:transform 0.35s ease;
  box-shadow:0 20px 50px -10px rgba(0,0,0,0.55);
}
.detail-hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 50%, rgba(10,15,30,0.45));
}
.detail-hero:hover{transform:translateY(-2px)}
.detail-hero-platform{position:absolute;top:1rem;left:1rem;z-index:2}
.detail-hero-overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none;
}
.detail-play{
  width:84px;height:84px;border-radius:50%;
  background:rgba(10,15,30,0.6);backdrop-filter:blur(10px);
  border:2px solid rgba(255,255,255,0.4);
  display:flex;align-items:center;justify-content:center;
  color:var(--white);transition:all 0.3s;
}
.detail-hero:hover .detail-play{background:var(--gold);color:var(--bg);border-color:var(--gold);transform:scale(1.05)}
.detail-play svg{width:32px;height:32px;margin-left:5px}

.detail-info{display:grid;grid-template-columns:1fr 280px;gap:2rem;align-items:flex-start}
@media (max-width:900px){.detail-info{grid-template-columns:1fr}}

.detail-main{display:flex;flex-direction:column;gap:1rem;min-width:0}
.detail-platform-row{
  display:flex;align-items:center;gap:0.55rem;
  font-size:0.62rem;letter-spacing:2.5px;color:var(--gold);
  text-transform:uppercase;font-weight:600;
}
.detail-platform-row svg{width:13px;height:13px}
.detail-title{
  font-family:var(--ff-display);font-size:clamp(1.8rem,3vw,2.6rem);
  font-weight:500;letter-spacing:-0.4px;line-height:1.1;
}
.detail-creator-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem;
  color:var(--muted);font-size:0.88rem;font-weight:300;
}
.detail-creator-row .handle{color:var(--white);font-weight:500}
.detail-creator-row .sep{color:var(--faint)}
.detail-creator-row .stat-inline{display:inline-flex;align-items:center;gap:0.3rem}
.detail-creator-row .stat-inline svg{width:12px;height:12px;color:var(--gold)}
.detail-description{color:var(--muted);font-size:1rem;line-height:1.65;font-weight:300}

.detail-actions{display:flex;gap:0.7rem;margin-top:0.6rem;flex-wrap:wrap}
.detail-cta-primary{
  display:inline-flex;align-items:center;gap:0.55rem;
  padding:0.95rem 1.7rem;background:var(--gold);color:var(--bg);
  border-radius:10px;font-size:0.74rem;letter-spacing:2px;font-weight:700;
  text-transform:uppercase;transition:all 0.2s;
  box-shadow:0 6px 18px rgba(201,169,110,0.3);text-decoration:none;
}
.detail-cta-primary:hover{background:var(--gold-bright);transform:translateY(-1px);box-shadow:0 10px 24px rgba(201,169,110,0.4)}
.detail-cta-primary svg{width:14px;height:14px}
.detail-cta-secondary{
  display:inline-flex;align-items:center;gap:0.55rem;
  padding:0.95rem 1.4rem;background:transparent;color:var(--gold);
  border:1px solid var(--border);border-radius:10px;
  font-size:0.74rem;letter-spacing:2px;font-weight:700;
  text-transform:uppercase;transition:all 0.2s;cursor:pointer;
}
.detail-cta-secondary:hover{background:rgba(201,169,110,0.08);border-color:rgba(201,169,110,0.4)}
.detail-cta-secondary svg{width:14px;height:14px}

.detail-aside{
  background:var(--card);border:1px solid var(--border-soft);
  border-radius:12px;padding:1.4rem;display:flex;flex-direction:column;gap:0.9rem;
}
.detail-aside-label{
  font-size:0.55rem;letter-spacing:3px;color:var(--gold);
  font-weight:600;text-transform:uppercase;
}
.detail-stat{display:flex;justify-content:space-between;align-items:center;gap:0.6rem}

<!-- Global error capture: shows any JS error in the red bar at the top -->
<script>
window.addEventListener('error', function(e){
  var box = document.getElementById('err-box');
  if(!box) return;
  box.style.display='block';
  box.textContent = '[ERROR] ' + (e.message || e.error || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
});
window.addEventListener('unhandledrejection', function(e){
  var box = document.getElementById('err-box');
  if(!box) return;
  box.style.display='block';
  box.textContent = '[PROMISE ERROR] ' + (e.reason && e.reason.message || e.reason || 'unknown');
});
</script>

  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = url;

}

function formatCount(n){
  if (n == null) return '';
  if (n >= 1000000) return (n / 1000000).toFixed(n >= 10000000 ? 0 : 1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K';
  return String(n);
}
function relativeTime(iso){
  if (!iso) return '';
  const then = new Date(iso).getTime();
  const days = Math.floor((Date.now() - then) / (1000 * 60 * 60 * 24));
  if (days < 1) return 'today';
  if (days < 7) return days + 'd ago';
  if (days < 30) return Math.floor(days / 7) + 'w ago';
  if (days < 365) return Math.floor(days / 30) + 'mo ago';
  return Math.floor(days / 365) + 'y ago';
}

// Shared helper: send a messages request to Claude via the proxy.
// Returns the parsed JSON (same shape as the Anthropic API response).
async function callClaude(payload) {
  const res = await fetch(CLAUDE_PROXY_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'apikey': SUPABASE_ANON_KEY
    },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
  return res.json();
}

async function fetchSearchableContent() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/searchable_content?select=*&order=popularity_score.desc&limit=500',
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json'
        }
      }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('empty response');
    return data.map(function(row) {
      return Object.assign({}, row, {
        tags: Array.isArray(row.tags) ? row.tags
              : typeof row.tags === 'string' ? row.tags.split(',').map(function(t){ return t.trim(); })
              : []
      });
    });
  } catch(e) {
    console.warn('[BagFree] Supabase fetch failed, using seed data:', e.message);
    return null;
  }
}

// ── Supabase live search (queries DB directly for real-time results) ────────────────────
async function supabaseSearch(query, cityId) {
  try {
    // Build a PostgREST full-text / ilike search across title, description, tags
    const q = encodeURIComponent('%' + query + '%');
    const cityFilter = cityId ? '&or=(city.eq.' + cityId + ',city.eq.all)' : '';
    const url = SUPABASE_URL + '/rest/v1/searchable_content?select=*' + cityFilter +
                '&or=(title.ilike.' + q + ',description.ilike.' + q + ')' +
                '&order=popularity_score.desc&limit=100';
    const res = await fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!Array.isArray(data)) return null;
    return data.map(function(row) {
      return Object.assign({}, row, {
        tags: Array.isArray(row.tags) ? row.tags
              : typeof row.tags === 'string' ? row.tags.split(',').map(function(t){ return t.trim(); })
              : []
      });
    });
  } catch(e) {
    return null;
  }
}

function expandQuery(qRaw) {
  const q = (qRaw || '').trim().toLowerCase();
  if (!q) return { original: qRaw, expanded: '', applied: false, matched: [] };
  const matched = [];
  const additions = [];
  for (let i = 0; i < CONCEPTS.length; i++) {
    const c = CONCEPTS[i];
    for (let j = 0; j < c.triggers.length; j++) {
      if (q.indexOf(c.triggers[j]) >= 0) {
        matched.push(c.triggers[j]);
        additions.push(c.expansion);
        break;
      }
    }
  }
  if (additions.length === 0) {
    return { original: qRaw, expanded: qRaw, applied: false, matched: [] };
  }
  return {
    original: qRaw,
    expanded: qRaw + ' ' + additions.join(' '),
    applied: true,
    matched: matched,
    expansion: additions.join(', ')
  };
}

// ── Ranking (Phase 1: client-side; mirror this in a Postgres view later) ────
function computeRealityRank(item){
  // Phase 1 placeholder: weighted average of popularity, conversion, freshness.
  // Future: + verified outcomes, curator trust, repeat visits, regret score.
  return Math.round(item.popularity_score * 0.4 + item.conversion_score * 0.4 + item.freshness_score * 0.2);
}
// Common English stopwords + question words that shouldn't drive product matches
var SEARCH_STOPWORDS = {
  'a':1,'an':1,'and':1,'are':1,'as':1,'at':1,'be':1,'by':1,'for':1,'from':1,'how':1,
  'in':1,'is':1,'it':1,'of':1,'on':1,'or':1,'the':1,'to':1,'was':1,'what':1,'when':1,
  'where':1,'which':1,'who':1,'why':1,'will':1,'with':1,'i':1,'me':1,'my':1,'do':1,
  'does':1,'can':1,'you':1,'your':1,'this':1,'that':1,'near':1,'get':1,'got':1,'now':1,
  'current':1,'currently':1,'time':1,'today':1,'uk':1,'us':1
};

function rankResults(query, cityId, items){
  const original = (query || '').trim();
  const exp = expandQuery(original);
  // Use the expanded query for matching, but keep original for display.
  const q = (exp.expanded || '').trim().toLowerCase();
  // Tokenise into meaningful words: length >= 3, not a stopword
  const allWords = q.split(/[^a-z0-9]+/).filter(Boolean);
  const words = allWords.filter(function(w){ return w.length >= 3 && !SEARCH_STOPWORDS[w]; });
  // How many distinct query words exist (used to require a minimum match ratio)
  const ranked = items
    .map(function(it){
      // Build a haystack of discrete, lowercased words for whole-word matching
      const haystackWords = (it.title + ' ' + it.description + ' ' + (it.tags || []).join(' ') + ' ' + it.city + ' ' + it.category)
        .toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
      const haystackSet = {};
      haystackWords.forEach(function(hw){ haystackSet[hw] = 1; });

      let kw = 0, hits = 0;
      words.forEach(function(w){
        if (haystackSet[w]) {
          // Whole-word match: strong signal
          kw += 25; hits++;
        } else if (w.length >= 5 && haystackWords.some(function(hw){ return hw.length >= 5 && (hw.indexOf(w) >= 0 || w.indexOf(hw) >= 0); })) {
          // Partial match only between two substantial words (both >=5 chars), e.g.
          // "sunscreen" <-> "sunscreens". The length floor prevents "london"~"on".
          kw += 10; hits++;
        }
      });
      const cityMatch = (cityId && (it.city === cityId || it.city === 'all')) ? 30 : 0;
      const realityRank = computeRealityRank(it);
      const score = kw + cityMatch + realityRank * 0.6;
      return Object.assign({}, it, { _score:score, _kw:kw, _hits:hits, reality_rank_score: computeRealityRank(it) });
    })
    // Require at least one real keyword hit. If the query had NO meaningful words
    // at all (e.g. only stopwords like "what is the time"), match nothing.
    .filter(function(it){ return words.length > 0 && it._hits > 0; })
    .sort(function(a,b){ return b._score - a._score; });
  // Attach expansion metadata so callers can show the "Smart match" hint
  ranked.expansion = exp.applied ? exp : null;
  return ranked;
}

// ── Analytics (Phase 1: localStorage + console; later: POST to /api/events) ─
// Keys whose values may contain user-typed free text — redacted before being
// persisted to localStorage so no personal info is stored at rest.
var SENSITIVE_ANALYTICS_KEYS = { q:1, seed:1, query:1, message:1, text:1 };

function track(event, data){
  const payload = Object.assign({ event:event, ts:new Date().toISOString() }, data || {});
  try {
    // Build a redacted copy for storage: keep the fact a field was present and
    // its length, but not the raw text.
    const safe = {};
    Object.keys(payload).forEach(function(k){
      if (SENSITIVE_ANALYTICS_KEYS[k] && typeof payload[k] === 'string') {
        safe[k] = '[redacted:' + payload[k].length + ']';
      } else {
        safe[k] = payload[k];
      }
    });
    const log = JSON.parse(localStorage.getItem('bf_events') || '[]');
    log.push(safe);
    if (log.length > 500) log.shift();
    localStorage.setItem('bf_events', JSON.stringify(log));
  } catch(e) {}
  // Full payload still goes to the console for live debugging (not persisted).
  if (window.console && console.log) console.log('[analytics]', payload);
  // TODO Phase 2: POST to a server endpoint over HTTPS instead of localStorage.
}

// ── Recent searches (localStorage-backed; Phase 2 will read from user's
// search_queries table once auth lands) ────────────────────────────────────
const RECENT_KEY = 'bf_recent_searches';
const RECENT_MAX = 5;

function getRecent(){
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function pushRecent(q){
  const trimmed = (q || '').trim();
  if (!trimmed) return;
  const list = getRecent().filter(function(x){ return x.toLowerCase() !== trimmed.toLowerCase(); });
  list.unshift(trimmed);
  const capped = list.slice(0, RECENT_MAX);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(capped)); } catch(e) {}
  return capped;
}
function removeRecent(q){
  const list = getRecent().filter(function(x){ return x !== q; });
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch(e) {}
  return list;
}
function clearRecent(){
  try { localStorage.removeItem(RECENT_KEY); } catch(e) {}
  return [];
}

// ── URL routing (lightweight, no router lib) ────────────────────────────────
// Encodes: q (search query), city (selected city id), view (item id being shown)
function readUrlState(){
  const params = new URLSearchParams(window.location.search);
  return {
    q:    params.get('q')    || '',
    city: params.get('city') || null,
    view: params.get('view') || null
  };
}
function writeUrlState(state, replace){
  const params = new URLSearchParams();
  if (state.q)    params.set('q', state.q);
  if (state.city) params.set('city', state.city);
  if (state.view) params.set('view', state.view);
  const qs = params.toString();
  const url = qs ? (window.location.pathname + '?' + qs) : window.location.pathname;
  try {
    if (replace) window.history.replaceState({}, '', url);
    else         window.history.pushState({}, '', url);
  } catch(e) {}
}

function highlight(text, q){
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return text;
  return [
    text.slice(0, i),
    <mark key="m">{text.slice(i, i + q.length)}</mark>,
    text.slice(i + q.length)
  ];
}

          <button key={c.id} className={cls}
            onClick={function(){ if(!c.soon){ props.setCity(c); props.close(); } }}>
            <span>
              {c.name}
              <span className="city-region">{c.region}{c.tag ? ' · ' + c.tag : ''}</span>
            </span>
            {c.soon
              ? <span className="soon">Soon</span>
              : (isActive ? <span className="tick">✓</span> : null)}
          </button>
        );
      })}
    </div>
  );
}

function SearchBar(props) {
  const qState = useState('');
  const q = qState[0]; const setQ = qState[1];
  const focusState = useState(false);
  const focused = focusState[0]; const setFocused = focusState[1];
  const hiState = useState(-1);
  const hi = hiState[0]; const setHi = hiState[1];
  const recentState = useState(getRecent());
  const recents = recentState[0]; const setRecents = recentState[1];
  const loadingState = useState(false);
  const loading = loadingState[0]; const setLoading = loadingState[1];
  const wrapRef = React.useRef(null);

  React.useEffect(function(){
    function onDoc(e){
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setFocused(false);
    }
    document.addEventListener('mousedown', onDoc);
    return function(){ document.removeEventListener('mousedown', onDoc); };
  }, []);

  const live = q.trim() ? rankResults(q, props.city.id, SEARCHABLE).slice(0, 6) : [];
  const showDrop = focused && !loading;
  const suggestions = getSuggested(props.city);

  // AI-powered query interpretation via Claude API
  async function interpretWithAI(rawQuery) {
    const categoryList = Object.entries(CATEGORIES).map(function([k,v]){ return k + ' (' + v.label + ')'; }).join(', ');
    const tagList = Array.from(new Set(SEARCHABLE.flatMap(function(x){ return x.tags || []; }))).slice(0, 60).join(', ');
    try {
      const data = await callClaude({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 150,
        system: 'You are a search assistant for BagFree, a travel concierge that delivers clothing rentals, meals, essentials, snacks, local favorites, experiences, and social content recommendations to hotel guests. Given a natural-language search query, respond ONLY with a JSON object (no markdown, no extra text) with two fields: "keywords" (3-8 space-separated search keywords that best map the intent to catalog items) and "hint" (a short plain-English note under 12 words explaining what you understood). Available categories: ' + categoryList + '. Common catalog tags: ' + tagList + '. Current city: ' + props.city.name + ', ' + props.city.region + '.',
        messages: [{ role: 'user', content: rawQuery }]
      });
      if (data.content && data.content[0] && data.content[0].text) {
        const cleaned = data.content[0].text.replace(/```json|```/g, '').trim();
        return JSON.parse(cleaned);
      }
    } catch(e) {}
    return null;
  }

  async function submit(query) {
    const final = (query || q).trim();
    if (!final) return;
    track('search_submit', { q: final, city: props.city.id });
    setLoading(true);
    setFocused(false);

    let searchQuery = final;
    let aiHint = null;

    // Run AI interpretation and Supabase search in parallel
    try {
      const [ai, dbRows] = await Promise.all([
        interpretWithAI(final),
        supabaseSearch(final, props.city.id)
      ]);
      if (ai && ai.keywords) {
        searchQuery = final + ' ' + ai.keywords;
        aiHint = ai.hint || null;
      }
      // If Supabase returned rows, use them as the ranking pool; else fall back to in-memory
      if (dbRows && dbRows.length > 0) {
        // Merge DB results with full SEARCHABLE so local ranking algo can score them
        const dbIds = new Set(dbRows.map(function(r){ return r.id; }));
        const merged = dbRows.concat(SEARCHABLE.filter(function(x){ return !dbIds.has(x.id); }));
        const results = rankResults(searchQuery, props.city.id, merged);
        if (results.length === 0) track('search_no_results', { q: final, city: props.city.id, source: 'supabase' });
        if (results.expansion) track('search_concept_expansion', { q: final, expansion: results.expansion.expansion, matched: results.expansion.matched });
        setRecents(pushRecent(final));
        setLoading(false);
        props.onSearch(final, results, results.expansion, aiHint);
        return;
      }
    } catch(e) {}

    const results = rankResults(searchQuery, props.city.id, SEARCHABLE);
    if (results.length === 0) track('search_no_results', { q: final, city: props.city.id });
    if (results.expansion) track('search_concept_expansion', { q: final, expansion: results.expansion.expansion, matched: results.expansion.matched });
    setRecents(pushRecent(final));
    setLoading(false);
    props.onSearch(final, results, results.expansion, aiHint);
  }

  function onSuggestClick(text){
    setQ(text);
    track('suggestion_click', { q: text, city: props.city.id });
    submit(text);
  }
  function onRecentClick(text){
    setQ(text);
    track('recent_click', { q: text, city: props.city.id });
    submit(text);
  }
  function onRecentRemove(e, text){
    e.stopPropagation();
    track('recent_remove', { q: text });
    setRecents(removeRecent(text));
  }
  function onRecentClear(e){
    e.stopPropagation();
    track('recent_clear', {});
    setRecents(clearRecent());
  }
  function onResultClick(item){
    track('result_click_inline', { id: item.id, q: q, city: props.city.id });
    props.onItemClick(item);
    setFocused(false);
  }
  function onKey(e){
    const items = live.length ? live : (recents.length ? recents.concat(suggestions) : suggestions);
    if (e.key === 'ArrowDown'){ e.preventDefault(); setHi(Math.min(hi + 1, items.length - 1)); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); setHi(Math.max(hi - 1, -1)); }
    else if (e.key === 'Enter'){
      e.preventDefault();
      // If the user arrowed onto a specific row, act on that row.
      if (hi >= 0 && live.length && live[hi]){ onResultClick(live[hi]); return; }
      if (hi >= 0 && !live.length && items[hi]){
        const item = items[hi];
        if (typeof item === 'string') onRecentClick(item);
        else onSuggestClick(item.q);
        return;
      }
      // Common case: run the full search and show the results page.
      if (q.trim()){ submit(); }
    }
    else if (e.key === 'Escape'){ setFocused(false); }
  }

  return (
    <div className="search-wrap" ref={wrapRef}>
      <div className={'search-bar' + (focused ? ' focused' : '') + (loading ? ' focused' : '')} onClick={function(){ if (!loading) setFocused(true); }}>
        <span className="search-go" role="button" tabIndex={0} title="Search"
          onClick={function(e){ e.stopPropagation(); if (q.trim() && !loading) submit(); }}
          onKeyDown={function(e){ if (e.key === 'Enter' && q.trim() && !loading) submit(); }}>
          {loading ? (
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--gold)" strokeWidth="2" fill="none" style={{ animation:'spin 0.8s linear infinite' }}>
              <circle cx="12" cy="12" r="10" stroke="rgba(201,169,110,0.25)" strokeWidth="2.5"/>
              <path d="M12 2 a10 10 0 010 20" strokeLinecap="round"/>
            </svg>
          ) : (
            <Icon.Search/>
          )}
        </span>
        <input className="search-input"
          placeholder={'Search your trip: meals, essentials, outfits, experiences\u2026'}
          value={q}
          disabled={loading}
          onChange={function(e){ setQ(e.target.value); setHi(-1); }}
          onFocus={function(){ setFocused(true); }}
          onKeyDown={onKey}
          style={loading ? { opacity: 0.6 } : {}}
        />
        {loading ? (
          <span className="search-kbd" style={{ color:'var(--gold)', borderColor:'rgba(201,169,110,0.3)', opacity:1 }}>AI ✦</span>
        ) : q ? (
          <span className="search-clear" onClick={function(e){ e.stopPropagation(); setQ(''); if (props.onClearResults) props.onClearResults(); }}><Icon.X/></span>
        ) : (
          <span className="search-kbd">ENTER</span>
        )}
      </div>

      {showDrop ? (
        <div className="search-dropdown">
          {q.trim() === '' ? (
            <React.Fragment>
              {recents.length > 0 ? (
                <div className="search-section">
                  <div className="search-section-header">
                    <div className="search-section-label"><Icon.Clock/> Recent</div>
                    <button className="search-section-action" onClick={onRecentClear}>Clear all</button>
                  </div>
                  {recents.map(function(r, idx){
                    const cls = 'search-suggest' + (idx === hi ? ' hi' : '');
                    return (
                      <button key={r} className={cls} onMouseEnter={function(){ setHi(idx); }}
                        onClick={function(){ onRecentClick(r); }}>
                        <span className="search-suggest-icon"><Icon.Clock/></span>
                        <span className="search-suggest-text">
                          <div className="search-suggest-title">{r}</div>
                        </span>
                        <button className="search-suggest-remove"
                          onClick={function(e){ onRecentRemove(e, r); }}
                          title="Remove from recent">
                          <Icon.X/>
                        </button>
                      </button>
                    );
                  })}
                </div>
              ) : null}
              <div className="search-section">
                <div className="search-section-label"><Icon.Sparkles/> Suggested searches</div>
                {suggestions.map(function(s, idx){
                  const I = Icon[s.icon] || Icon.Search;
                  const offset = recents.length;
                  const cls = 'search-suggest' + ((idx + offset) === hi ? ' hi' : '');
                  return (
                    <button key={s.q} className={cls} onMouseEnter={function(){ setHi(idx + offset); }}
                      onClick={function(){ onSuggestClick(s.q); }}>
                      <span className="search-suggest-icon"><I/></span>
                      <span className="search-suggest-text">
                        <div className="search-suggest-title">{s.q}</div>
                      </span>
                      <span className="search-suggest-arrow"><Icon.ArrowRight/></span>
                    </button>
                  );
                })}
              </div>
            </React.Fragment>
          ) : (
            <div>
              {live.length === 0 ? (
                <div className="search-empty">
                  No matches for <strong>"{q}"</strong>. Try a broader term.
                </div>
              ) : (
                <div className="search-section">
                  <div className="search-section-label"><Icon.Fire/> Top matches</div>
                  {live.map(function(it, idx){
                    const isSocial = it.category === 'social';
                    const platformIcon = isSocial && PLATFORM_ICONS[it.platform] ? Icon[PLATFORM_ICONS[it.platform]] : null;
                    const I = Icon[CATEGORIES[it.category] && CATEGORIES[it.category].icon] || Icon.Search;
                    const cls = 'search-suggest' + (idx === hi ? ' hi' : '');
                    return (
                      <button key={it.id} className={cls} onMouseEnter={function(){ setHi(idx); }}
                        onClick={function(){ onResultClick(it); }}>
                        <span className="search-suggest-icon has-img" style={{ backgroundImage:'url(' + it.image_url + ')' }}></span>
                        <span className="search-suggest-text">
                          <div className="search-suggest-title">{highlight(it.title, q)}</div>
                          <div className="search-suggest-meta">
                            {isSocial
                              ? (PLATFORM_LABELS[it.platform] || it.platform) + ' · ' + (it.creator_handle || '')
                              : CATEGORIES[it.category].label + ' · ' + (it.city === 'all' ? 'All cities' : ((CITIES.find(function(c){ return c.id === it.city; }) || {}).name || it.city))}
                          </div>
                        </span>
                        <span className="search-suggest-arrow"><Icon.ArrowRight/></span>
                      </button>
                    );
                  })}
                  <button className="search-suggest" style={{ justifyContent:'center', color:'var(--gold)', fontSize:'0.72rem', letterSpacing:'2px', textTransform:'uppercase', fontWeight:600 }}
                    onClick={function(){ submit(); }}>
                    See all results for "{q}"
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      ) : null}
    </div>
  );
}

function SearchResults(props) {
  const grouped = {};
  CATEGORY_ORDER.forEach(function(c){ grouped[c] = []; });
  props.results.forEach(function(r){
    if (grouped[r.category]) grouped[r.category].push(r);
  });

  return (
    <section>
      <div className="results-head">
        <div>
          <h2 className="results-title">Results for <em>"{props.query}"</em></h2>
          <div className="results-count" style={{ marginTop:'0.35rem' }}>{props.results.length} matches across BagFree</div>
          {props.expansion ? (
            <div className="smart-match">
              <Icon.Sparkles/>
              <span className="smart-match-label">Smart match</span>
              <span className="smart-match-terms">also searching: {props.expansion.expansion}</span>
            </div>

          {props.aiHint ? (
            <div className="smart-match" style={{ marginTop:'0.45rem', background:'linear-gradient(135deg,rgba(100,140,255,0.10),rgba(100,140,255,0.04))', borderColor:'rgba(100,140,255,0.25)' }}>
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#7aa2f7" strokeWidth="1.5"><path d="M12 3 L13.5 9 L19.5 10.5 L13.5 12 L12 18 L10.5 12 L4.5 10.5 L10.5 9 Z"/></svg>
              <span className="smart-match-label" style={{ color:'#7aa2f7' }}>AI</span>
              <span className="smart-match-terms">{props.aiHint}</span>
            </div>
          ) : null}

      {props.results.length === 0 ? (
        <div className="results-empty">
          <div className="results-empty-title">No matches in the catalog</div>
          <div className="results-empty-tag">We couldn’t find a BagFree item for “{props.query}”. Our concierge can help with travel questions, recommendations, and anything we don’t stock.</div>
          <button className="empty-concierge" onClick={function(){ if(props.onAskConcierge) props.onAskConcierge(props.query); }}>
            <Icon.Chat/> Ask the Concierge

      ) : (
        CATEGORY_ORDER.filter(function(c){ return grouped[c].length > 0; }).map(function(catKey){

          return (
            <div key={catKey} className="results-group">
              <div className="results-group-head">
                <h3 className="results-group-title">{cat.label}</h3>
                <span className="results-group-count">{items.length} {items.length === 1 ? 'result' : 'results'}</span>
              </div>
              <div className="results-grid">
                {items.map(function(it){
                  const isSocial = it.category === 'social';
                  const platformIcon = isSocial && PLATFORM_ICONS[it.platform] ? Icon[PLATFORM_ICONS[it.platform]] : null;
                  const platformLabel = isSocial ? (PLATFORM_LABELS[it.platform] || it.platform) : null;
                  return (
                    <div key={it.id}
                         className={'result-card' + (isSocial ? ' social' : '')}
                         style={{ cursor:'pointer' }}
                         onClick={function(){ props.onItemClick(it); }}>
                      <div className="result-img" style={{ backgroundImage:'url(' + it.image_url + ')' }}>
                        {isSocial && platformIcon ? (
                          <span className={'result-platform p-' + it.platform}>
                            {React.createElement(platformIcon)} {platformLabel}
                          </span>
                        ) : (
                          <span className="result-cat">{cat.label}</span>
                        )}
                        <span className="result-rank"><Icon.Trophy/> {it.reality_rank_score}</span>
                        {isSocial ? (
                          <div className="result-play"><span className="result-play-btn"><Icon.Play/></span></div>
                        ) : null}
                      </div>
                      <div className="result-body">
                        <div className="result-title">{it.title}</div>
                        {isSocial ? (
                          <div className="result-creator">
                            <span className="result-creator-handle">{it.creator_handle}</span>
                            <span>· {relativeTime(it.posted_at)}</span>
                            {it.view_count ? (
                              <span className="result-creator-stats"><Icon.Eye/> {formatCount(it.view_count)}</span>
                            ) : null}
                          </div>
                        ) : (
                          <div className="result-city"><Icon.Pin/> {it.city === 'all' ? 'All cities' : (CITIES.find(function(c){ return c.id === it.city; }) || {}).name || it.city}</div>
                        )}
                        <div className="result-desc">{it.description}</div>
                        <span className="result-cta">View details <Icon.ArrowRight/></span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })
      )}
    </section>
  );
}

function relatedItems(item, all){
  const myTags = item.tags || [];
  return all
    .filter(function(x){ return x.id !== item.id; })
    .map(function(x){
      let score = 0;
      const itsTags = x.tags || [];
      myTags.forEach(function(t){ if (itsTags.indexOf(t) >= 0) score += 3; });
      if (x.city === item.city) score += 2;
      else if (x.city === 'all') score += 1;
      if (item.category === 'social' && x.category !== 'social') score += 0.5;
      return Object.assign({}, x, { _related: score });
    })
    .filter(function(x){ return x._related > 0; })
    .sort(function(a,b){ return b._related - a._related; })
    .slice(0, 6);
}

                    {isSoc && pIcon ? (
                      <span className={'result-platform p-' + it.platform}>
                        {React.createElement(pIcon)} {pLabel}
                      </span>
                    ) : (
                      <span className="result-cat">{CATEGORIES[it.category].label}</span>
                    )}
                  </div>
                  <div className="result-body">
                    <div className="result-title">{it.title}</div>
                    {isSoc ? (
                      <div className="result-creator">
                        <span className="result-creator-handle">{it.creator_handle}</span>
                        {it.view_count ? (<span className="result-creator-stats"><Icon.Eye/> {formatCount(it.view_count)}</span>) : null}

                    ) : (
                      <div className="result-city"><Icon.Pin/> {it.city === 'all' ? 'All cities' : ((CITIES.find(function(c){ return c.id === it.city; }) || {}).name || it.city)}</div>
                    )}
                    <div className="result-desc">{it.description}</div>
                    <span className="result-cta">View details <Icon.ArrowRight/></span>
                  </div>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      ) : null}
    </section>
  );
}

function ConciergeChat(props) {
  const open = props.open;
  const setOpen = props.setOpen;
  const city = props.city;

  const msgsState = useState([]);
  const msgs = msgsState[0]; const setMsgs = msgsState[1];
  const inputState = useState('');
  const input = inputState[0]; const setInput = inputState[1];
  const busyState = useState(false);
  const busy = busyState[0]; const setBusy = busyState[1];
  const bodyRef = React.useRef(null);
  const seedHandled = React.useRef(false);

  // Auto-scroll to newest message
  React.useEffect(function(){
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [msgs, busy, open]);

  // Greeting on first open
  React.useEffect(function(){
    if (open && msgs.length === 0 && !props.seed) {
      setMsgs([{ role:'bot', text:'Hi! I\u2019m your BagFree concierge for ' + city.name + '. Ask me anything \u2014 what to pack, where to eat, things to do, or help with your order.' }]);
    }
  }, [open]);

  // If opened with a seed query (from a failed search), send it automatically
  React.useEffect(function(){
    if (open && props.seed && !seedHandled.current) {
      seedHandled.current = true;
      sendMessage(props.seed);
    }
    if (!open) seedHandled.current = false;
  }, [open, props.seed]);

  async function callConcierge(history) {
    const catalogSummary = SEARCHABLE.slice(0, 40).map(function(it){
      return '- ' + it.title + ' (' + (CATEGORIES[it.category] ? CATEGORIES[it.category].label : it.category) + ', ' + (it.city === 'all' ? 'all cities' : it.city) + ')';
    }).join('\n');
    const systemPrompt =
      'You are the BagFree concierge, a warm, concise travel assistant. BagFree delivers clothing rentals, meals, snacks, essentials, local experiences, and curator services to hotel guests in these cities: Savannah, Atlanta, Tampa, Orlando, and Miami. ' +
      'The guest is currently in ' + city.name + ', ' + (city.region || '') + '. ' +
      'Help with travel questions, recommendations, packing, and what BagFree offers. Keep replies short (2-4 sentences) and friendly. ' +
      'If asked about something outside the cities BagFree serves, gently note BagFree operates in the Southeast US but still try to be helpful. ' +
      'You cannot access real-time data (exact current time, live weather, flight status). If asked for those, say so briefly and suggest how they could check. ' +
      'When relevant, mention specific BagFree items from this catalog:\n' + catalogSummary;

    const apiMessages = history.map(function(m){
      return { role: m.role === 'user' ? 'user' : 'assistant', content: m.text };
    });

    const data = await callClaude({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 400,
      system: systemPrompt,
      messages: apiMessages
    });
    if (data && data.content && data.content[0] && data.content[0].text) {
      return data.content[0].text;
    }
    throw new Error('No response');
  }

  async function sendMessage(text) {
    const content = (text || input).trim().slice(0, 2000);  // cap to server limit
    if (!content || busy) return;
    track('concierge_message', { city: city.id });
    const userMsg = { role:'user', text: content };
    // Keep only the most recent turns so the request stays within server caps
    const nextMsgs = msgs.concat([userMsg]).slice(-18);
    setMsgs(nextMsgs);
    setInput('');
    setBusy(true);
    try {
      const reply = await callConcierge(nextMsgs);
      setMsgs(nextMsgs.concat([{ role:'bot', text: reply }]));
    } catch(e) {
      setMsgs(nextMsgs.concat([{ role:'bot', text:'Sorry \u2014 I had trouble responding just now. Please try again in a moment.' }]));
    }
    setBusy(false);
  }

  function onKey(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  const starters = ['What should I pack?', 'Best dinner in ' + city.name + '?', 'Things to do nearby'];

  if (!open) {
    return (
      <button className="concierge" onClick={function(){ setOpen(true); track('concierge_open', { city: city.id }); }}>
        <Icon.Chat/> Concierge Chat
      </button>
    );
  }

  return (
    <div className="chat-panel">
      <div className="chat-head">
        <div className="chat-head-avatar"><Icon.Chat/></div>
        <div className="chat-head-info">
          <div className="chat-head-title">BagFree Concierge</div>
          <div className="chat-head-sub"><span className="chat-head-dot"></span> Online · {city.name}</div>
        </div>
        <button className="chat-close" aria-label="Close chat" onClick={function(){ setOpen(false); }}><Icon.X/></button>
      </div>

      <div className="chat-body" ref={bodyRef}>
        {msgs.map(function(m, i){
          return <div key={i} className={'chat-msg ' + (m.role === 'user' ? 'user' : 'bot')}>{m.text}</div>;
        })}
        {busy ? (
          <div className="chat-msg bot">
            <span className="chat-typing"><span></span><span></span><span></span></span>
          </div>
        ) : null}
        {msgs.length <= 1 && !busy ? (
          <div className="chat-suggest-row">
            {starters.map(function(s){
              return <button key={s} className="chat-chip" onClick={function(){ sendMessage(s); }}>{s}</button>;
            })}
          </div>
        ) : null}
      </div>

      <div className="chat-foot">
        <textarea className="chat-input" rows={1} maxLength={2000}
          placeholder="Message the concierge…"
          value={input}
          onChange={function(e){ setInput(e.target.value); }}
          onKeyDown={onKey}/>
        <button className="chat-send" disabled={busy || !input.trim()} onClick={function(){ sendMessage(); }} aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  );
}

function App() {
  const stateActive = useState('home');
  const active = stateActive[0];
  const setActive = stateActive[1];

  const initCity = (function(){
    // URL > localStorage > default
    try {
      const urlCity = new URLSearchParams(window.location.search).get('city');
      if (urlCity) {
        const c = CITIES.find(function(x){ return x.id === urlCity; });
        if (c && !c.soon) return c;
      }
      const saved = localStorage.getItem('bf_city');
      if (saved) {
        const c = CITIES.find(function(x){ return x.id === saved; });
        if (c && !c.soon) return c;
      }
    } catch(e) {}
    return CITIES[0];
  })();

  const stateCity = useState(initCity);
  const city = stateCity[0];
  const setCityState = stateCity[1];

  const searchState = useState({ query:'', results:null, expansion:null, aiHint:null });
  const search = searchState[0];
  const setSearch = searchState[1];

  const viewingState = useState(null);
  const viewing = viewingState[0];
  const setViewing = viewingState[1];

  const drawerState = useState(false);
  const drawerOpen = drawerState[0];
  const setDrawerOpen = drawerState[1];

  const chatOpenState = useState(false);
  const chatOpen = chatOpenState[0];
  const setChatOpen = chatOpenState[1];
  const chatSeedState = useState(null);
  const chatSeed = chatSeedState[0];
  const setChatSeed = chatSeedState[1];

  // Open the concierge chat, optionally seeding it with a question
  function askConcierge(seedText){
    setChatSeed(seedText || null);
    setChatOpen(true);
    track('concierge_open_from_search', { seed: seedText || null, city: cityRef.current.id });
  }

  // Ref so popstate (with stale closure) can read current city
  const cityRef = React.useRef(city);
  React.useEffect(function(){ cityRef.current = city; }, [city]);
  const searchQueryRef = React.useRef('');
  React.useEffect(function(){ searchQueryRef.current = search.query; }, [search.query]);

  // ── On mount: restore state from URL ───────────────────────────────────
  React.useEffect(function(){
    const url = readUrlState();
    if (url.q) {
      const ranked = rankResults(url.q, cityRef.current.id, SEARCHABLE);
      setSearch({ query: url.q, results: ranked, expansion: ranked.expansion || null, aiHint: null });
      track('search_restored_from_url', { q: url.q, city: cityRef.current.id });
    }
    if (url.view) {
      const item = SEARCHABLE.find(function(x){ return x.id === url.view; });
      if (item) setViewing(item);
    }
    // Normalize URL (e.g. strip stale params, ensure city present if search active)
    writeUrlState({
      q:    url.q || '',
      city: (url.q || url.view) ? cityRef.current.id : '',
      view: url.view || ''
    }, true);
  }, []);

  // ── Back / forward navigation ──────────────────────────────────────────
  React.useEffect(function(){
    function onPop(){
      const url = readUrlState();
      // City
      if (url.city) {
        const c = CITIES.find(function(x){ return x.id === url.city; });
        if (c && !c.soon && c.id !== cityRef.current.id) {
          try { localStorage.setItem('bf_city', c.id); } catch(e) {}
          setCityState(c);
        }
      }
      // Search
      if (url.q) {
        const ranked = rankResults(url.q, (url.city || cityRef.current.id), SEARCHABLE);
        setSearch({ query: url.q, results: ranked, expansion: ranked.expansion || null, aiHint: null });
      } else {
        setSearch({ query:'', results:null, expansion:null, aiHint:null });
      }
      // View
      if (url.view) {
        const item = SEARCHABLE.find(function(x){ return x.id === url.view; });
        setViewing(item || null);
      } else {
        setViewing(null);
      }
    }
    window.addEventListener('popstate', onPop);
    return function(){ window.removeEventListener('popstate', onPop); };
  }, []);

  function setCity(c) {
    if (c.soon) return;
    try { localStorage.setItem('bf_city', c.id); } catch(e) {}
    setCityState(c);
    if (search.results !== null && search.query) {
      track('search_recompute_city', { q: search.query, from: city.id, to: c.id });
      const reranked = rankResults(search.query, c.id, SEARCHABLE);
      setSearch({ query: search.query, results: reranked, expansion: reranked.expansion || null, aiHint: null });
      writeUrlState({ q: search.query, city: c.id, view: viewing ? viewing.id : '' }, true);
    } else if (readUrlState().city) {
      // Only persist city to URL if it was already there (avoid polluting the homepage URL)
      const url = readUrlState();
      writeUrlState({ q: url.q, city: c.id, view: url.view }, true);
    }
  }

  function onSearch(query, results, expansion, aiHint){
    setSearch({ query: query, results: results, expansion: expansion || null, aiHint: aiHint || null });
    setViewing(null);
    writeUrlState({ q: query, city: city.id }, false);  // push
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // If the catalog had nothing, gently open the concierge after a beat so the
    // user sees the "no matches" message first, then the chat slides up seeded
    // with their question. Set AUTO_OPEN_CONCIERGE to false to require a click instead.
    var AUTO_OPEN_CONCIERGE = true;
    if (AUTO_OPEN_CONCIERGE && results && results.length === 0 && query && query.trim()) {
      setTimeout(function(){ askConcierge(query); }, 900);
    }
  }
  function clearSearch(){
    setSearch({ query:'', results:null, expansion:null, aiHint:null });
    setViewing(null);
    writeUrlState({}, false);  // push (so back returns to results)
    track('search_clear', {});
  }

  function openItem(item){
    track('result_view_detail', { id: item.id, category: item.category, platform: item.platform || null });
    setViewing(item);
    writeUrlState({
      q: searchQueryRef.current,
      city: city.id,
      view: item.id
    }, false);  // push (back returns to results)
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function closeDetail(){
    setViewing(null);
    writeUrlState({
      q: searchQueryRef.current,
      city: searchQueryRef.current ? city.id : ''
    }, true);  // replace (no extra history entry)
  }

  return (
    <div className="app">
      <div className="mobile-bar">
        <button className="hamburger" aria-label="Open menu" onClick={function(){ setDrawerOpen(true); }}>
          <span></span><span></span><span></span>
        </button>
        <a href="/" className="brand-link"><img src={LOGO_SRC} alt="BagFree" className="brand-img--sm"/></a>
        <div className="mobile-bar-spacer"></div>
      </div>
      <div className={'drawer-overlay' + (drawerOpen ? ' show' : '')} onClick={function(){ setDrawerOpen(false); }}></div>
      <Sidebar mobileOpen={drawerOpen} onClose={function(){ setDrawerOpen(false); }} active={active} setActive={setActive} city={city} setCity={setCity}/>
      <main className="main">
        <TopBar city={city} setCity={setCity} onSearch={onSearch} onItemClick={openItem} onClearResults={clearSearch}/>
        {viewing ? (
          <ResultDetail item={viewing} onBack={closeDetail} onItemClick={openItem}/>
        ) : search.results === null ? (
          <React.Fragment>
            <Grid/>
            <QuoteSection/>
            <VideoSection/>
          </React.Fragment>
        ) : (
          <SearchResults query={search.query} results={search.results} expansion={search.expansion} aiHint={search.aiHint} onClear={clearSearch} onItemClick={openItem} onAskConcierge={askConcierge}/>
        )}
      </main>
      <RightRail city={city}/>
      <ConciergeChat open={chatOpen} setOpen={setChatOpen} city={city} seed={chatSeed}/>
    </div>
  );
}

const rootEl = document.getElementById('root');
if (!rootEl) {
  throw new Error('Root element #root not found');
}

// Show a "Connecting…" state while we fetch live data from Supabase
function renderApp(searchable) {
  if (searchable) {
    SEARCHABLE = searchable;
    console.log('[BagFree] Loaded ' + searchable.length + ' items from Supabase');
  } else {
    console.log('[BagFree] Using ' + SEED_SEARCHABLE.length + ' seed items');
  }
  ReactDOM.render(<App/>, rootEl);
}

// Fetch live content then render; if fetch takes >4s just render with seed data
const fetchTimeout = setTimeout(function(){ renderApp(null); }, 4000);
fetchSearchableContent().then(function(data) {
  clearTimeout(fetchTimeout);
  renderApp(data);
}).catch(function() {
  clearTimeout(fetchTimeout);
  renderApp(null);
});

// Hide loader once rendered
setTimeout(function(){
  const loader = document.getElementById('loader');
  if (loader) {
    loader.classList.add('hide');
    setTimeout(function(){ loader.remove(); }, 500);
  }
}, 100);

} catch (err) {
  const box = document.getElementById('err-box');
  if (box) {
    box.style.display = 'block';
    box.textContent = '[BABEL/RENDER ERROR] ' + (err.message || err);
  }
  console.error('Render error:', err);
}
</script>
