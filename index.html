<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* ── RGB triplets (swap between themes) ── */
  --text-rgb: 253, 252, 248;
  --bg-rgb: 8, 14, 26;
  --gold-rgb: 201, 169, 110;
  /* ── Dark theme values ── */
  --noir:#0D1525;
  --noir-2:#111C30;
  --noir-3:#172138;
  --noir-4:#1E2D45;
  --gold:#C9A96E;
  --gold-light:#E8D5B0;
  --gold-dim:#8A6F45;
  --gold-xlight:#C9A96E;
  --white:rgb(var(--text-rgb));
  --mist:rgba(var(--text-rgb),0.5);
  --mist-low:rgba(var(--text-rgb),0.15);
  --mist-xlow:rgba(var(--text-rgb),0.06);
  --border:rgba(var(--gold-rgb),0.16);
  --border-hi:rgba(var(--gold-rgb),0.42);
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-body:'Jost',sans-serif;
  --green:#5DCAA5;
}

/* ── LIGHT THEME — warm cream + deep navy + richer gold (luxury hotel stationery) ── */
:root[data-theme="light"]{
  --text-rgb: 13, 21, 37;
  --bg-rgb: 245, 239, 228;
  --gold-rgb: 166, 134, 74;
  --noir:#F5EFE4;
  --noir-2:#FAF7F0;
  --noir-3:#EDE5D5;
  --noir-4:#E0D6C2;
  --gold:#A6864A;
  --gold-light:#8A6B33;
  --gold-dim:#C9A96E;
  --gold-xlight:#A6864A;
  --green:#2D8A60;
}

/* Smooth theme transitions on common elements */
body, nav, section, button, span, p, h1, h2, h3, h4, a, div[style*="background"], div[style*="border"] {
  transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
}

/* Hero image — slight desaturation in light mode so it blends with cream UI */
:root[data-theme="light"] .bf-hero-right img {
  filter: brightness(0.94) contrast(1.04) saturate(0.88) !important;
}
:root[data-theme="light"] select option { background:#FAF7F0!important; color:#0D1525!important; }
:root[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(var(--gold-rgb), 0.5); }

/* Theme toggle button */
.bf-theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(var(--gold-rgb), 0.32);
  background: rgba(var(--gold-rgb), 0.05);
  color: var(--gold);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(.4,0,.2,1);
  padding: 0;
  flex-shrink: 0;
}
.bf-theme-toggle:hover {
  background: rgba(var(--gold-rgb), 0.14);
  border-color: var(--gold);
  transform: scale(1.06) rotate(15deg);
  box-shadow: 0 4px 14px rgba(var(--gold-rgb), 0.22);
}
.bf-theme-toggle svg {
  width: 16px;
  height: 16px;
}
/* Nav overflow prevention */
.bf-nav { overflow: visible !important; }
.bf-nav-links { flex-wrap: nowrap !important; white-space: nowrap; }
@media(max-width:768px){ .bf-nav-links { display:none; } .bf-hamburger { display:block !important; } }
body{font-family:var(--ff-body);background:var(--noir);color:var(--white);font-weight:300;overflow-x:hidden;}
button{font-family:var(--ff-body);cursor:pointer}
input,select,textarea{font-family:var(--ff-body)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--noir)}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
select option{background:#172138!important;color:rgb(var(--text-rgb))!important}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── MOBILE RESPONSIVE ───────────────────────────────────────── */
@media(max-width:768px){

  /* Hero — stack vertically on mobile */
  .bf-hero-wrap{flex-direction:column !important;}
  .bf-hero-left{width:100% !important;padding:5rem 1.5rem 2.5rem !important;}
  .bf-hero-right{width:100% !important;height:45vh !important;min-height:260px !important;flex-shrink:0 !important;}

  /* Promo bar */
  

  /* Nav — hide text links, show hamburger */
  .bf-nav-links{display:none;}
  .bf-hamburger{display:block !important;}
  .bf-nav{padding:0.75rem 1.25rem !important;}

  /* Announcement bar */

  /* Sections — reduce horizontal padding */
  .bf-section-pad{padding-left:1.25rem !important; padding-right:1.25rem !important;}

  /* 3-col grids → 1 col on mobile */
  .bf-grid-3{grid-template-columns:1fr !important;}

  /* 2-col grids → 1 col on mobile */
  .bf-grid-2{grid-template-columns:1fr !important;}

  /* Hotel concierge form 2-col → 1 col */
  .bf-form-2col{grid-template-columns:1fr !important;}

  /* Departure lounge teaser 2-col → 1 col */
  .bf-lounge-grid{grid-template-columns:1fr !important; gap:2rem !important;}

  /* Lounge feature grid 4x2 → 2x4 stays, but icons grid 2-col is fine */

  /* Hotel section 2-col → 1 col */
  .bf-hotel-grid{grid-template-columns:1fr !important; gap:2rem !important;}

  /* Stats row — wrap */
  .bf-stats{gap:2rem !important; flex-wrap:wrap !important;}

  /* Caribbean cards margin fix */
  .bf-caribbean-panel{margin:0 -1.25rem -1.25rem -1.25rem !important; padding:2rem 1.25rem !important;}
}

@media(max-width:480px){
  .bf-nav{padding:0.65rem 1rem !important;}
  .bf-section-pad{padding-left:1rem !important; padding-right:1rem !important;}
}

@keyframes bfFadeUp{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes bfHeroDrift{
  0%{transform:scale(1.04) translate3d(0,0,0)}
  100%{transform:scale(1.08) translate3d(-0.6%, -0.8%, 0)}
}


.bf-hero-primary,.bf-hero-secondary{transition:transform .28s cubic-bezier(.4,0,.2,1),box-shadow .28s ease,background .28s ease,border-color .28s ease,opacity .28s ease,color .28s ease,letter-spacing .28s ease}
.bf-hero-primary:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(var(--gold-rgb),0.38), 0 4px 12px rgba(var(--gold-rgb),0.18), inset 0 1px 0 rgba(255,255,255,0.35);background:linear-gradient(135deg,#e8c685 0%,#d4a55c 50%,#b8893e 100%);letter-spacing:4px}
.bf-hero-secondary:hover{transform:translateY(-3px);opacity:1;border-color:rgba(var(--gold-rgb),0.55);color:var(--white);background:rgba(var(--gold-rgb),0.06);box-shadow:0 10px 28px rgba(0,0,0,0.3)}
.bf-nav-link{position:relative;padding:0.3rem 0;transition:color 0.25s ease}
.bf-nav-link::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 0.3s cubic-bezier(.4,0,.2,1)}
.bf-nav-link:hover{color:var(--gold) !important}
.bf-nav-link:hover::after{transform:scaleX(1)}
.bf-nav-lounge{transition:all 0.25s ease}
.bf-nav-lounge:hover{background:rgba(var(--gold-rgb),0.1);border-color:var(--gold) !important;transform:translateY(-1px)}
.bf-trusted-row{display:flex;align-items:center;gap:.85rem;margin:-.25rem 0 2.25rem 0;color:rgba(var(--text-rgb),0.56);font-size:.76rem;letter-spacing:1.1px;text-transform:uppercase}
.bf-trusted-dots{display:flex;align-items:center;gap:.45rem}
.bf-trusted-dots span{width:7px;height:7px;border-radius:50%;background:rgba(var(--gold-rgb),.82);box-shadow:0 0 0 1px rgba(var(--gold-rgb),.18)}
.bf-scroll-cue{position:absolute;left:50%;bottom:1.35rem;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:.45rem;color:rgba(var(--text-rgb),.56);font-size:.6rem;letter-spacing:3px;text-transform:uppercase;pointer-events:none}
.bf-scroll-cue-line{width:1px;height:34px;background:linear-gradient(to bottom,rgba(var(--gold-rgb),.82),rgba(var(--gold-rgb),0));animation:bfScrollCue 1.8s ease-in-out infinite}
@keyframes bfScrollCue{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(8px);opacity:1}}

/* ─── STYLE PREFERENCE PAGE ─── */
.bf-sp-page{padding-top:60px;min-height:100vh;background:var(--noir);position:relative}
.bf-sp-page::before{content:'';position:absolute;top:60px;left:0;right:0;height:600px;background:radial-gradient(ellipse 80% 60% at 30% 0%,rgba(var(--gold-rgb),0.045),transparent 70%);pointer-events:none;z-index:0}
.bf-sp-steprail{display:flex;align-items:center;gap:1.5rem;padding:1.5rem 3rem;border-bottom:1px solid var(--border);background:rgba(var(--bg-rgb),0.4);position:relative;z-index:1;overflow-x:auto;scrollbar-width:none}
.bf-sp-steprail::-webkit-scrollbar{display:none}
.bf-sp-step{display:flex;align-items:center;gap:0.85rem;flex-shrink:0;cursor:default}
.bf-sp-step.clickable{cursor:pointer}
.bf-sp-step-num{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.78rem;font-family:var(--ff-body);color:var(--mist);transition:all .3s;flex-shrink:0}
.bf-sp-step.done .bf-sp-step-num{border-color:var(--gold);color:var(--gold);background:rgba(var(--gold-rgb),0.08)}
.bf-sp-step.active .bf-sp-step-num{border-color:var(--gold);background:var(--gold);color:var(--noir);font-weight:500}
.bf-sp-step-meta{display:flex;flex-direction:column;line-height:1.3}
.bf-sp-step-label{font-size:0.68rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--mist);transition:color .3s}
.bf-sp-step.active .bf-sp-step-label{color:var(--gold)}
.bf-sp-step.done .bf-sp-step-label{color:var(--white)}
.bf-sp-step-sub{font-size:0.72rem;color:var(--mist);font-weight:300;margin-top:2px;font-family:var(--ff-body)}
.bf-sp-step-sep{color:var(--gold-dim);font-size:0.9rem;opacity:0.5}
.bf-sp-wrap{display:grid;grid-template-columns:1fr 380px;gap:3rem;max-width:1480px;margin:0 auto;padding:2.5rem 3rem 4rem;position:relative;z-index:1}
.bf-sp-h-eyebrow{font-size:0.62rem;letter-spacing:3.5px;text-transform:uppercase;color:var(--gold-dim);margin-bottom:1rem}
.bf-sp-h-title{font-family:var(--ff-display);font-size:clamp(2.4rem,4vw,3.6rem);font-weight:300;line-height:1.05;letter-spacing:-0.5px;color:var(--white);margin-bottom:0.9rem}
.bf-sp-h-title em{font-style:italic;color:var(--gold)}
.bf-sp-h-sub{font-size:1rem;color:var(--mist);line-height:1.7;font-weight:300;max-width:540px;margin-bottom:2.5rem}
.bf-sp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}
.bf-sp-card{position:relative;aspect-ratio:0.78;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--noir-2);border:1px solid var(--border);transition:transform .5s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .4s;animation:bfSpCardIn .7s cubic-bezier(.2,.7,.2,1) both}
.bf-sp-card:hover{transform:translateY(-4px);border-color:rgba(var(--gold-rgb),0.35);box-shadow:0 18px 50px -12px rgba(0,0,0,0.65),0 0 0 1px rgba(var(--gold-rgb),0.08)}
.bf-sp-card.selected{border:1.5px solid var(--gold);box-shadow:0 0 0 1px rgba(var(--gold-rgb),0.4),0 22px 60px -14px rgba(201,169,110,0.28)}
.bf-sp-card-img{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .5s;filter:saturate(0.95) contrast(1.02)}
.bf-sp-card:hover .bf-sp-card-img{transform:scale(1.06);filter:saturate(1) contrast(1.04)}
.bf-sp-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,21,37,0.05) 0%,rgba(13,21,37,0.15) 45%,rgba(13,21,37,0.85) 100%);pointer-events:none}
.bf-sp-card.selected .bf-sp-card-overlay{background:linear-gradient(180deg,rgba(13,21,37,0.05) 0%,rgba(13,21,37,0.2) 45%,rgba(13,21,37,0.9) 100%)}
.bf-sp-card-content{position:absolute;left:0;right:0;bottom:0;padding:1rem 1rem 1.25rem;text-align:center}
.bf-sp-card-title{font-family:var(--ff-body);font-size:0.78rem;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--white);line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,0.55);margin-bottom:0.6rem}
.bf-sp-card-radio{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(var(--text-rgb),0.6);margin:0 auto;display:flex;align-items:center;justify-content:center;transition:all .3s;background:rgba(13,21,37,0.4);backdrop-filter:blur(4px)}
.bf-sp-card.selected .bf-sp-card-radio{border-color:var(--gold);background:var(--gold)}
.bf-sp-card-check{opacity:0;color:var(--noir);font-size:0.7rem;font-weight:700;transition:opacity .25s}
.bf-sp-card.selected .bf-sp-card-check{opacity:1}
.bf-sp-novibe{margin-top:4rem;text-align:center}
.bf-sp-novibe-title{font-family:var(--ff-display);font-size:1.65rem;font-weight:400;font-style:italic;color:var(--white);margin-bottom:0.5rem}
.bf-sp-novibe-sub{font-size:0.92rem;color:var(--mist);margin-bottom:2rem;font-weight:300}
.bf-sp-novibe-actions{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:720px;margin:0 auto}
.bf-sp-novibe-btn{display:flex;align-items:center;gap:1rem;padding:1.25rem 1.5rem;border:1px solid var(--border);border-radius:4px;background:rgba(var(--gold-rgb),0.03);cursor:pointer;text-align:left;transition:all .3s;font-family:var(--ff-body)}
.bf-sp-novibe-btn:hover,.bf-sp-novibe-btn.open{border-color:var(--border-hi);background:rgba(var(--gold-rgb),0.07)}
.bf-sp-novibe-btn-icon{width:38px;height:38px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.bf-sp-novibe-btn-label{font-size:0.72rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:3px}
.bf-sp-novibe-btn-desc{font-size:0.82rem;color:var(--mist);font-weight:300}
.bf-sp-novibe-foot{margin-top:1.75rem;font-size:0.82rem;color:var(--mist);display:flex;align-items:center;justify-content:center;gap:0.55rem;font-weight:300}
.bf-sp-novibe-foot svg{color:var(--gold);opacity:0.8}
.bf-sp-describe{margin:1.75rem auto 0;max-width:720px;border:1px solid var(--border);border-radius:4px;background:var(--noir-2);padding:1.5rem;text-align:left}
.bf-sp-describe-label{font-size:0.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:0.85rem}
.bf-sp-describe-textarea{width:100%;background:rgba(var(--bg-rgb),0.4);border:1px solid var(--border);color:var(--white);padding:0.9rem 1rem;font-size:0.95rem;font-family:var(--ff-body);font-weight:300;outline:none;resize:vertical;line-height:1.7;border-radius:3px;min-height:90px;transition:border-color .2s}
.bf-sp-describe-textarea:focus{border-color:rgba(var(--gold-rgb),0.5)}
.bf-sp-describe-hints{display:flex;flex-wrap:wrap;gap:0.45rem;margin-top:0.85rem}
.bf-sp-describe-hint{font-size:0.72rem;color:var(--mist);padding:0.4rem 0.75rem;border:1px solid var(--border);border-radius:99px;cursor:pointer;font-style:italic;font-family:var(--ff-display);transition:all .2s}
.bf-sp-describe-hint:hover{border-color:var(--border-hi);color:var(--white)}
.bf-sp-upload{margin:1.75rem auto 0;max-width:720px;border:1.5px dashed var(--border);border-radius:4px;padding:2.5rem 1.5rem;text-align:center;background:rgba(var(--gold-rgb),0.02);transition:all .3s}
.bf-sp-upload.drag{border-color:var(--gold);background:rgba(var(--gold-rgb),0.08)}
.bf-sp-upload-icon{color:var(--gold);margin-bottom:0.85rem}
.bf-sp-upload-text{font-size:0.92rem;color:var(--white);margin-bottom:0.3rem}
.bf-sp-upload-sub{font-size:0.78rem;color:var(--mist);font-weight:300}
.bf-sp-upload-link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.bf-sp-upload-previews{display:flex;flex-wrap:wrap;gap:0.6rem;margin-top:1.25rem;justify-content:center}
.bf-sp-upload-preview{width:64px;height:64px;border-radius:4px;background-size:cover;background-position:center;position:relative;border:1px solid var(--border)}
.bf-sp-upload-preview-rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--noir);border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:0.7rem;cursor:pointer;line-height:1}
.bf-sp-side{position:sticky;top:88px;align-self:start;border:1px solid var(--border);border-radius:6px;background:var(--noir-2);overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,0.5)}
.bf-sp-side-hero{position:relative;height:200px;background-size:cover;background-position:center}
.bf-sp-side-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,21,37,0.1) 0%,rgba(13,21,37,0.6) 60%,rgba(13,21,37,0.95) 100%)}
.bf-sp-side-hero-content{position:absolute;left:1.5rem;right:1.5rem;bottom:1.25rem;z-index:1}
.bf-sp-side-eyebrow{font-size:0.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light);margin-bottom:0.4rem;opacity:0.85}
.bf-sp-side-dest{font-family:var(--ff-display);font-size:1.85rem;font-weight:400;color:var(--white);line-height:1.1;margin-bottom:0.4rem;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
.bf-sp-side-dates{font-size:0.85rem;color:rgba(var(--text-rgb),0.8);font-weight:300;letter-spacing:0.5px}
.bf-sp-side-body{padding:1.5rem}
.bf-sp-side-row{display:flex;gap:0.85rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);margin-bottom:1.25rem}
.bf-sp-side-row-icon{flex-shrink:0;width:32px;height:32px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.bf-sp-side-row-content{flex:1;min-width:0}
.bf-sp-side-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.3rem}
.bf-sp-side-row-label{font-size:0.58rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-dim)}
.bf-sp-side-row-edit{font-size:0.7rem;color:var(--gold);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:400}
.bf-sp-side-row-value{font-size:0.92rem;color:var(--white);line-height:1.4;font-weight:400}
.bf-sp-side-row-sub{font-size:0.78rem;color:var(--mist);font-weight:300;margin-top:2px;line-height:1.4}
.bf-sp-side-style{display:flex;gap:0.85rem;align-items:center}
.bf-sp-side-style-thumb{width:54px;height:54px;border-radius:4px;background-size:cover;background-position:center;flex-shrink:0;border:1px solid var(--border)}
.bf-sp-side-style-title{font-size:0.92rem;color:var(--white);font-weight:500;margin-bottom:2px;letter-spacing:0.3px}
.bf-sp-side-style-desc{font-size:0.76rem;color:var(--mist);font-weight:300;line-height:1.45}
.bf-sp-side-style-empty{font-size:0.85rem;color:var(--mist);font-style:italic;font-family:var(--ff-display)}
.bf-sp-side-incl-label{font-size:0.58rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-dim);margin-bottom:0.85rem}
.bf-sp-side-incl{display:flex;flex-direction:column;gap:0.85rem;margin-bottom:1.5rem}
.bf-sp-side-incl-row{display:flex;gap:0.75rem;align-items:center}
.bf-sp-side-incl-icon{width:28px;height:28px;color:var(--gold);opacity:0.85;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.bf-sp-side-incl-text{font-size:0.85rem;color:var(--white);font-weight:400;line-height:1.2}
.bf-sp-side-incl-sub{font-size:0.74rem;color:var(--mist);font-weight:300;line-height:1.3}
.bf-sp-side-cta{width:100%;background:var(--gold);color:var(--noir);padding:1.05rem;border:none;border-radius:4px;font-size:0.78rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;font-family:var(--ff-body);cursor:pointer;transition:all .3s;margin-bottom:0.85rem}
.bf-sp-side-cta:hover:not(:disabled){background:var(--gold-light);transform:translateY(-1px);box-shadow:0 12px 28px -8px rgba(201,169,110,0.5)}
.bf-sp-side-cta:disabled{opacity:0.4;cursor:not-allowed}
.bf-sp-side-secure{font-size:0.72rem;color:var(--mist);text-align:center;display:flex;align-items:center;justify-content:center;gap:0.45rem;font-weight:300}
.bf-sp-side-secure svg{color:var(--gold);opacity:0.7}
.bf-sp-trust{border-top:1px solid var(--border);padding:2.5rem 3rem;background:rgba(var(--bg-rgb),0.5)}
.bf-sp-trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;max-width:1480px;margin:0 auto}
.bf-sp-trust-item{display:flex;gap:1rem;align-items:flex-start}
.bf-sp-trust-icon{color:var(--gold);flex-shrink:0;opacity:0.9}
.bf-sp-trust-label{font-size:0.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:0.35rem}
.bf-sp-trust-text{font-size:0.84rem;color:var(--mist);font-weight:300;line-height:1.5}
@keyframes bfSpCardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:1180px){.bf-sp-grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1024px){
  .bf-sp-wrap{grid-template-columns:1fr;gap:2rem;padding:2rem 1.75rem}
  .bf-sp-side{position:relative;top:0;order:-1}
  .bf-sp-side-hero{height:170px}
  .bf-sp-steprail{padding:1.25rem 1.75rem;gap:1rem}
  .bf-sp-trust{padding:2rem 1.75rem}
  .bf-sp-trust-grid{grid-template-columns:repeat(2,1fr);gap:1.5rem}
}
@media (max-width:768px){
  .bf-sp-grid{grid-template-columns:repeat(2,1fr);gap:0.75rem}
  .bf-sp-card{aspect-ratio:0.82}
  .bf-sp-card-title{font-size:0.7rem;letter-spacing:2px}
  .bf-sp-h-title{font-size:2rem}
  .bf-sp-novibe-actions{grid-template-columns:1fr}
  .bf-sp-step-meta{display:none}
  .bf-sp-step{gap:0}
  .bf-sp-steprail{gap:0.5rem}
  .bf-sp-step-sep{display:none}
  .bf-sp-trust-grid{grid-template-columns:1fr}
}
@media (max-width:420px){.bf-sp-wrap{padding:1.5rem 1rem}.bf-sp-grid{gap:0.6rem}}

</style>

  } catch(e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>

// ── LOGO COMPONENT ────────────────────────────────────────────────────────────
// If you have real logo image URLs, set VALET_LOGO_URL above.t logo automatically.
function VendorLogo({vendor, height=60, dark=false}) {
  const [errored, setErrored] = useState(false);
  const url = VALET_LOGO_URL;
  const hasUrl = url && url !== null;

  // Styled text logo fallback (also used when image fails)
  if (!hasUrl || errored) {
    if (vendor.id === 'valet-by-nuor') {
      return (
        <div style={{lineHeight:1}}>
          <div style={{fontFamily:'var(--ff-display)',fontSize:'1.65rem',fontWeight:300,letterSpacing:'4px',textTransform:'uppercase',color:dark?'var(--gold-light)':'var(--noir)',lineHeight:1}}>
            Valet
          </div>
          <div style={{fontFamily:'var(--ff-display)',fontSize:'0.82rem',fontWeight:300,letterSpacing:'6px',textTransform:'uppercase',color:dark?'rgba(var(--gold-rgb),0.6)':'rgba(var(--bg-rgb),0.45)',marginTop:4}}>
            By Nuor
          </div>
        </div>
      );
    }
    if (vendor.id === 'pod-collection') {
      return (
        <div style={{lineHeight:1}}>
          <div style={{fontFamily:'var(--ff-display)',fontSize:'1.65rem',fontWeight:300,letterSpacing:'4px',textTransform:'uppercase',color:dark?'var(--gold-light)':'var(--noir)',lineHeight:1}}>
            Pod™ Collection
          </div>
        </div>
      );
    }
    return null;
  }

  return (
    <img
      src={url}
      alt={vendor.name}
      style={{height:height, width:'auto', objectFit:'contain', display:'block'}}
      onError={() => setErrored(true)}
    />
  );
}

// ── THEME TOGGLE ──────────────────────────────────────────────────────────────
function ThemeToggle() {
  const [theme, setTheme] = React.useState(() => document.documentElement.getAttribute('data-theme') || 'dark');
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('bf-theme', theme); } catch(e) {}
  }, [theme]);
  const isDark = theme === 'dark';
  return (
    <button
      className="bf-theme-toggle"
      aria-label={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
      title={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
      onClick={() => setTheme(isDark ? 'light' : 'dark')}
    >
      {isDark ? (
        // Sun icon — shown in dark mode to indicate "click for light"
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      ) : (
        // Moon icon — shown in light mode to indicate "click for dark"
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      )}
    </button>
  );
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function Home({setPage}) {
  const heroImageRef = React.useRef(null);
  const heroContentRef = React.useRef(null);

  React.useEffect(() => {
    const onScroll = () => {
      const y = Math.min(window.scrollY || 0, 320);
      if (heroImageRef.current) {
        heroImageRef.current.style.transform = `scale(1.04) translate3d(0, ${y * 0.08}px, 0)`;
      }
      if (heroContentRef.current) {
        heroContentRef.current.style.transform = `translate3d(0, ${y * 0.035}px, 0)`;
        heroContentRef.current.style.opacity = String(Math.max(0.72, 1 - y / 900));
      }
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div style={{paddingTop:60}}>


      <div style={{minHeight:'75vh',position:'relative',display:'flex',alignItems:'stretch'}} className="bf-hero-wrap">
        <div className="bf-hero-left" style={{position:'relative',zIndex:2,background:'var(--noir)',display:'flex',alignItems:'center',width:'50%',flexShrink:0}}>
          <div ref={heroContentRef} style={{padding:'4rem 5rem 4rem 6rem',width:'100%',className:'bf-hero-content',transition:'transform 180ms ease-out, opacity 180ms ease-out',willChange:'transform, opacity',animation:'bfFadeUp 900ms ease-out'}}>
            <div style={{fontSize:'0.72rem',letterSpacing:'5px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'2rem',display:'flex',alignItems:'center',gap:'0.9rem'}}>
              <span style={{width:8,height:8,background:'var(--gold)',display:'inline-block',transform:'rotate(45deg)',boxShadow:'0 0 12px rgba(var(--gold-rgb),0.55)'}}></span>
              <span style={{width:42,height:1,background:'linear-gradient(to right, var(--gold), rgba(var(--gold-rgb),0.1))',display:'inline-block'}}></span>
              <span style={{fontWeight:400}}>Arrive to everything</span>
            </div>
            <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(3.2rem,5vw,5.8rem)',fontWeight:300,lineHeight:1.08,letterSpacing:'-2.9px',marginBottom:'1.65rem',color:'var(--white)',maxWidth:560}}>
              BagFree.<br />Travel, <em style={{fontStyle:'italic',color:'var(--gold)'}}>Redefined.</em>
            </h1>
            <p style={{fontSize:'1.12rem',color:'rgba(var(--text-rgb),0.76)',lineHeight:1.7,maxWidth:'100%',marginBottom:'2.15rem',fontWeight:300}}>
              The way travel should feel.<span style={{display:'block',marginTop:'0.6rem',fontSize:'1.00rem',color:'rgba(var(--text-rgb),0.5)',fontWeight:300}}>Arrive to everything. No bags. No lines. No friction.</span>
            </p>
            <div style={{display:'flex',flexDirection:'column',gap:'0.7rem',marginBottom:'2.05rem'}}>
              {['No luggage to check or carry','No waiting at baggage claim','Everything waiting at arrival','Same-day delivery — FL & GA'].map((t, i) => (
                <div key={i} style={{display:'flex',alignItems:'center',gap:'0.95rem',fontSize:'1.02rem',color:'rgba(var(--text-rgb),0.72)'}}>
                  <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:18,height:18,borderRadius:'50%',border:'1px solid rgba(var(--gold-rgb),0.45)',flexShrink:0}}>
                    <span style={{width:5,height:5,borderRadius:'50%',background:'var(--gold)'}}></span>
                  </span>
                  <span>{t}</span>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',marginTop:'1.75rem',marginBottom:'1.15rem'}}>
              <button className="bf-hero-primary" onClick={() => setPage('vendors')} style={{background:'linear-gradient(135deg,var(--gold) 0%,#d8b06a 50%,#b8893e 100%)',color:'var(--noir)',padding:'1.15rem 2.9rem',border:'none',fontSize:'0.84rem',fontWeight:600,letterSpacing:'3.5px',textTransform:'uppercase',cursor:'pointer',fontFamily:'var(--ff-body)',position:'relative',boxShadow:'0 8px 24px rgba(var(--gold-rgb),0.22), inset 0 1px 0 rgba(255,255,255,0.25)'}}>
                Get Started
              </button>
              <button className="bf-hero-secondary" onClick={() => window.open('/departure-lounge-landing','_self')} style={{background:'rgba(var(--text-rgb),0.01)',color:'rgba(var(--text-rgb),0.82)',padding:'1.15rem 2.3rem',border:'1px solid rgba(var(--gold-rgb),0.32)',fontSize:'0.84rem',letterSpacing:'2.8px',textTransform:'uppercase',cursor:'pointer',fontFamily:'var(--ff-body)',display:'inline-flex',alignItems:'center',gap:'0.5rem'}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:'var(--gold)',display:'inline-block',animation:'pulse 2s ease-in-out infinite'}}></span>
                Enter the Lounge ↗
              </button>
            </div>
            <div className="bf-trusted-row">
              <div className="bf-trusted-dots"><span></span><span></span><span></span></div>
              <span>Trusted by travelers across Florida & Georgia</span>
            </div>
            <div className="bf-stats" style={{display:'flex',gap:'2.5rem',paddingTop:'2.25rem',borderTop:'1px solid rgba(var(--gold-rgb),0.18)',flexWrap:'wrap',position:'relative'}}>
              {[['38+','Products'],['6','Destinations'],['Same-Day','FL & GA'],['Valet By Nuor','Partner']].map(([n, l], idx) => (
                <div key={l} style={{position:'relative',paddingRight:idx<3?'2.5rem':0,borderRight:idx<3?'1px solid rgba(var(--gold-rgb),0.14)':'none'}}>
                  <div style={{fontFamily:'var(--ff-display)',fontSize:'2.1rem',fontWeight:300,color:'var(--gold)',lineHeight:1,letterSpacing:'-0.5px'}}>{n}</div>
                  <div style={{fontSize:'0.62rem',letterSpacing:'2.5px',textTransform:'uppercase',color:'rgba(var(--text-rgb),0.42)',marginTop:7,fontWeight:400}}>{l}</div>
                </div>
              ))}
            </div>
          </div>

function VendorMarketplace({setPage, setActiveVendor}) {
  const [atVendors, setAtVendors] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  React.useEffect(()=>{
    fetchApprovedVendors().then(v=>{ setAtVendors(v); setLoading(false); });
  },[]);

  // Static vendors (always shown) + approved Airtable vendors + apply slots
  const staticCore = VENDORS.filter(v => v.color !== 'apply');
  const applySlots = VENDORS.filter(v => v.color === 'apply');
  const activeCity = window._activeDestCity || null;

  // Filter vendors by destination — vendors with specific city dest only show for that city
  const filteredCore = staticCore.filter(v => {
    if (!activeCity) return true;
    // The Nuor Edit is Tampa Bay only
    if (v.id === 'nuor-edit') return activeCity === 'Tampa Bay';
    return true;
  });

  const allVendors = [...filteredCore, ...atVendors, ...applySlots];

  return (
    <div style={{paddingTop:60}}>
      <div style={{padding:'5rem 3rem 4rem',background:'var(--gold)',position:'relative',overflow:'hidden'}}>
        <div style={{fontSize:'0.72rem',letterSpacing:'4px',textTransform:'uppercase',color:'rgba(var(--bg-rgb),0.5)',marginBottom:'1.25rem',display:'flex',alignItems:'center',gap:'1rem',position:'relative'}}>
          <span style={{width:24,height:1,background:'var(--noir)',opacity:0.3,display:'inline-block'}}/>BagFree Marketplace
        </div>
        <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(2.5rem,5vw,4.5rem)',fontWeight:300,color:'var(--noir)',letterSpacing:'-0.5px',position:'relative'}}>
          Our <em style={{fontStyle:'italic'}}>Supplier</em> Network
        </h1>
        <p style={{fontSize:'1.02rem',color:'rgba(var(--bg-rgb),0.6)',marginTop:'1rem',maxWidth:500,lineHeight:1.8,fontWeight:300,position:'relative'}}>Browse verified suppliers delivering to your destination. Click any vendor to explore their products.</p>
        {activeCity && (
          <div style={{display:'inline-flex',alignItems:'center',gap:'0.75rem',marginTop:'1rem',background:'rgba(var(--bg-rgb),0.15)',border:'1px solid rgba(var(--bg-rgb),0.25)',padding:'0.4rem 0.85rem',position:'relative'}}>
            <span style={{fontSize:'0.62rem',letterSpacing:'2px',textTransform:'uppercase',color:'rgba(var(--bg-rgb),0.7)'}}>Showing vendors for {activeCity}</span>
            <span onClick={()=>{window._activeDestCity=null;setPage('vendors');}} style={{fontSize:'0.70rem',color:'rgba(var(--bg-rgb),0.5)',cursor:'pointer',marginLeft:'0.25rem'}}>✕ Clear</span>
          </div>
        )}
      </div>
      <div style={{padding:'3rem',background:'var(--noir)'}}>
        {loading ? (
          <div style={{textAlign:'center',padding:'3rem',color:'var(--mist)',fontSize:'0.90rem',letterSpacing:'2px',textTransform:'uppercase'}}>
            <div style={{animation:'pulse 1.5s ease-in-out infinite',display:'inline-block'}}>Loading suppliers...</div>
          </div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:1,background:'var(--border)',border:'1px solid var(--border)'}}>
            {allVendors.map(v=>(
              <VendorCard key={v.id} vendor={v} setPage={setPage} setActiveVendor={setActiveVendor} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function VendorCard({vendor:v, setPage, setActiveVendor}) {
  const isApply = v.color === 'apply';
  const isShop = v.url !== null;

  if (isApply) return (
    <div onClick={()=>setPage('supplier')}
      style={{background:'var(--noir-2)',padding:'2.5rem',cursor:'pointer',border:'1px dashed rgba(var(--gold-rgb),0.25)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',minHeight:280,transition:'all 0.25s'}}
      onMouseEnter={e=>e.currentTarget.style.background='var(--noir-3)'}
      onMouseLeave={e=>e.currentTarget.style.background='var(--noir-2)'}>
      <div style={{fontSize:'2.5rem',color:'var(--border-hi)',marginBottom:'1rem',fontWeight:100}}>+</div>
      <div style={{fontFamily:'var(--ff-display)',fontSize:'1.4rem',fontWeight:300,color:'var(--mist)',marginBottom:'0.5rem'}}>Your Brand Here</div>
      <div style={{fontSize:'0.84rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gold)',marginBottom:'1rem'}}>Open Supplier Slot</div>
      <div style={{fontSize:'0.90rem',color:'var(--mist)',lineHeight:1.7,maxWidth:260}}>{v.desc}</div>
      <div style={{marginTop:'1.5rem',fontSize:'0.75rem',letterSpacing:'2.5px',textTransform:'uppercase',color:'var(--gold)',border:'1px solid var(--border-hi)',padding:'0.5rem 1.25rem'}}>Apply to Join →</div>
    </div>
  );

  const isLogoVendor = v.id === 'valet-by-nuor';
  const isSelena = v.id === 'nuor-edit';

  return (
    <div
      style={{background:v.color==='selena'?'#1A1218':v.highlight?'var(--noir-3)':'var(--noir-2)',padding:'2.5rem',cursor:'pointer',position:'relative',transition:'background 0.25s',display:'flex',flexDirection:'column'}}
      onMouseEnter={e=>e.currentTarget.style.background=v.color==='selena'?'#231820':'var(--noir-4)'}
      onMouseLeave={e=>e.currentTarget.style.background=v.color==='selena'?'#1A1218':v.highlight?'var(--noir-3)':'var(--noir-2)'}
      onClick={()=>isShop?window.open(v.url,'_blank'):null}>
      {v.highlight && (
        <div style={{position:'absolute',top:'1.25rem',right:'1.25rem',fontSize:'0.62rem',letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--gold)',border:'1px solid var(--border-hi)',padding:'3px 10px',background:'rgba(var(--gold-rgb),0.08)'}}>Official Partner</div>
      )}
      {isSelena && (
        <div style={{position:'absolute',top:'1.25rem',right:'1.25rem',fontSize:'0.62rem',letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--noir)',border:'1px solid rgba(var(--bg-rgb),0.3)',padding:'3px 10px',background:'rgba(var(--bg-rgb),0.1)'}}>Curated Partner</div>
      )}
      <div style={{marginBottom:'1.25rem',minHeight:'3rem',display:'flex',alignItems:'center'}}>
        {isLogoVendor
          ? <VendorLogo vendor={v} height={60} dark={true} />
          : isSelena
          ? <div style={{display:'flex',alignItems:'center',gap:'0.65rem'}}>
              <img src="https://raw.githubusercontent.com/ceebee718/bagfree-app/main/images/nuor-edit-logo.png" alt="The Nuor Edit" style={{height:52,width:'auto',objectFit:'contain'}}/>
              <div style={{fontFamily:'var(--ff-display)',fontSize:'1.2rem',fontWeight:300,color:'var(--noir)',letterSpacing:'0.5px',lineHeight:1.2}}>The Nuor<br/><span style={{color:'rgba(var(--bg-rgb),0.7)',fontStyle:'italic'}}>Edit</span></div>
            </div>
          : <span style={{fontSize:'2.5rem',opacity:0.25}}>{v.icon}</span>
        }
      </div>
      {/* Only show name as text for non-logo vendors; logo vendors show name via the logo component */}
      {(!isLogoVendor && !isSelena) && (
        <div style={{fontFamily:'var(--ff-display)',fontSize:'1.5rem',fontWeight:300,color:'var(--white)',marginBottom:'0.35rem'}}>{v.name}</div>
      )}
      {(isLogoVendor || isSelena) && (
        <div style={{marginBottom:'0.35rem'}}/>
      )}
      <div style={{fontSize:'0.72rem',letterSpacing:'2px',textTransform:'uppercase',color:v.highlight?'var(--gold)':isSelena?'rgba(var(--bg-rgb),0.5)':'var(--mist)',marginBottom:'0.5rem'}}>{v.category}</div>
      <div style={{fontSize:'0.82rem',color:'var(--mist)',marginBottom:'1.25rem',letterSpacing:'0.5px',display:'flex',alignItems:'center',gap:'0.5rem'}}>
        {v.dest}
        {isSelena && <span style={{fontSize:'0.60rem',letterSpacing:'1.5px',textTransform:'uppercase',color:'rgba(var(--bg-rgb),0.6)',border:'1px solid rgba(var(--bg-rgb),0.2)',padding:'1px 6px',background:'rgba(var(--bg-rgb),0.05)'}}>Tampa Bay Only</span>}
      </div>
      <p style={{fontSize:'0.95rem',color:'var(--mist)',lineHeight:1.8,marginBottom:'1.5rem',fontWeight:300}}>{v.desc}</p>
      {v.products.length > 0 && (
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:'1.5rem'}}>
          {v.products.map(p=>(
            <span key={p} style={{fontSize:'0.72rem',color:v.highlight?'var(--gold-dim)':'var(--mist)',border:`1px solid ${v.highlight?'var(--border)':'rgba(var(--text-rgb),0.08)'}`,padding:'3px 10px',letterSpacing:'0.5px'}}>{p}</span>
          ))}
        </div>
      )}
      <div style={{marginTop:'auto'}}>
        {isShop ? (
          <button
            onClick={(e)=>{e.stopPropagation(); if(v.url.startsWith('https://bagfree.app/#')){window.location.hash=v.url.replace('https://bagfree.app/#','');}else{window.open(v.url,'_self');}}}
            style={{background:'var(--gold)',color:'var(--noir)',padding:'0.75rem 1.75rem',border:'none',fontSize:'0.78rem',fontWeight:500,letterSpacing:'2.5px',textTransform:'uppercase',width:'100%',cursor:'pointer',fontFamily:'var(--ff-body)'}}>
            Shop {v.name} →
          </button>
        ) : (
          <button
            onClick={(e)=>{e.stopPropagation();setPage('supplier');}}
            style={{background:'transparent',color:'var(--gold)',padding:'0.75rem 1.75rem',border:'1px solid var(--border-hi)',fontSize:'0.78rem',fontWeight:400,letterSpacing:'2.5px',textTransform:'uppercase',width:'100%',cursor:'pointer',transition:'all 0.2s',fontFamily:'var(--ff-body)'}}
            onMouseEnter={e=>{e.currentTarget.style.background='rgba(var(--gold-rgb),0.08)';e.currentTarget.style.borderColor='var(--gold)';}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='var(--border-hi)';}}>
            Apply to List Your Brand →
          </button>
        )}
      </div>
    </div>
  );
}

// ── PRODUCTS PAGE ─────────────────────────────────────────────────────────────
function ProductsPage({setPage}) {
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);

  const filtered = PRODUCTS.filter(p => {
    if (cat !== 'all' && p.category !== cat) return false;
    if (search && !p.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  if (selected) return <ProductDetail product={selected} onBack={()=>setSelected(null)}/>;

  return (
    <div style={{paddingTop:60}}>
      <div style={{padding:'1.5rem 2.5rem',background:'var(--noir-2)',borderBottom:'1px solid var(--border)',display:'flex',gap:'1rem',flexWrap:'wrap',alignItems:'center'}}>
        <span onClick={()=>setPage('vendors')} style={{fontSize:'0.78rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gold)',cursor:'pointer',marginRight:'0.5rem'}}>← Vendors</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products..."
          style={{flex:1,minWidth:180,background:'var(--mist-xlow)',border:'1px solid var(--border)',color:'var(--white)',padding:'0.6rem 1rem',fontSize:'0.98rem',outline:'none'}}/>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {CATEGORIES.map(c=>(
            <button key={c.id} onClick={()=>setCat(c.id)}
              style={{background:cat===c.id?'var(--gold)':'transparent',color:cat===c.id?'var(--noir)':'var(--mist)',border:`1px solid ${cat===c.id?'var(--gold)':'var(--border)'}`,padding:'0.45rem 0.9rem',fontSize:'0.75rem',letterSpacing:'1.5px',textTransform:'uppercase'}}>
              {c.icon} {c.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:'2rem 2.5rem',background:'var(--noir)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.5rem'}}>
          <div style={{fontSize:'0.90rem',color:'var(--mist)'}}>{filtered.length} products · Valet By Nuor</div>
          <a href="https://valetbynuor.com" target="_blank" style={{fontSize:'0.78rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gold)',textDecoration:'none'}}>Visit valetbynuor.com ↗</a>
        </div>
        {filtered.length === 0 ? (
          <div style={{textAlign:'center',padding:'5rem',color:'var(--mist)'}}>
            <div style={{fontFamily:'var(--ff-display)',fontSize:'2rem',fontWeight:300,marginBottom:'0.75rem'}}>No products found</div>
            <button onClick={()=>{setSearch('');setCat('all');}} style={{background:'var(--gold)',color:'var(--noir)',padding:'0.7rem 2rem',border:'none',fontSize:'0.78rem',letterSpacing:'2px',textTransform:'uppercase',marginTop:'1rem'}}>Clear Filters</button>
          </div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:12}}>
            {filtered.map(p=>(
              <div key={p.id}
                style={{background:'var(--noir-3)',border:'1px solid var(--border)',padding:'1.5rem',cursor:'pointer',transition:'border-color 0.2s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='var(--border-hi)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}
                onClick={()=>setSelected(p)}>
                {p.tag && <div style={{fontSize:'0.62rem',letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--gold)',border:'1px solid var(--border-hi)',padding:'2px 8px',display:'inline-block',marginBottom:'0.75rem'}}>{p.tag}</div>}
                <div style={{fontSize:'2.5rem',opacity:0.4,marginBottom:'0.75rem'}}>{p.icon}</div>
                <div style={{fontSize:'0.65rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gold-dim)',marginBottom:'0.35rem'}}>{CATEGORIES.find(c=>c.id===p.category)?.label}</div>
                <div style={{fontFamily:'var(--ff-display)',fontSize:'1.15rem',fontWeight:300,color:'var(--white)',marginBottom:'0.5rem',lineHeight:1.25}}>{p.name}</div>
                <div style={{fontSize:'0.84rem',color:'var(--mist)',lineHeight:1.7,marginBottom:'0.75rem'}}>{p.desc.slice(0,75)}...</div>
                <div style={{fontFamily:'var(--ff-display)',fontSize:'1.3rem',fontWeight:300,color:'var(--gold)',marginBottom:'0.75rem'}}>{p.price ? `$${p.price}` : 'View'}</div>
                <button
                  onClick={e=>{e.stopPropagation();window.open(p.url,'_blank');}}
                  style={{width:'100%',background:'transparent',color:'var(--gold)',padding:'0.55rem',border:'1px solid var(--border-hi)',fontSize:'0.72rem',letterSpacing:'2px',textTransform:'uppercase'}}>
                  {p.price ? `Shop Now — $${p.price} ↗` : 'View Collection ↗'}
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function ProductDetail({product:p, onBack}) {

            <div style={{fontSize:'0.90rem',color:'var(--mist)',lineHeight:1.8}}>Delivered to your hotel, airport, or accommodation. Same-day across Florida & Georgia.</div>

        <div>
          <div style={{fontSize:'0.70rem',letterSpacing:'3px',textTransform:'uppercase',color:'var(--gold-dim)',marginBottom:'0.75rem'}}>{CATEGORIES.find(c=>c.id===p.category)?.label} · Valet By Nuor</div>
          <h1 style={{fontFamily:'var(--ff-display)',fontSize:'2.5rem',fontWeight:300,lineHeight:1.1,marginBottom:'1.5rem'}}>{p.name}</h1>
          <p style={{fontSize:'1.02rem',color:'var(--mist)',lineHeight:1.9,marginBottom:'2rem',fontWeight:300}}>{p.desc}</p>
          <div style={{fontFamily:'var(--ff-display)',fontSize:'2.5rem',fontWeight:300,color:'var(--gold)',marginBottom:'2rem'}}>{p.price ? `$${p.price}` : 'View Pricing'}</div>
          <button onClick={()=>window.open(p.url,'_blank')} style={{width:'100%',background:'var(--gold)',color:'var(--noir)',padding:'1rem',border:'none',fontSize:'0.84rem',fontWeight:500,letterSpacing:'3px',textTransform:'uppercase'}}>
            {p.price ? `Shop on Valet By Nuor — $${p.price} ↗` : 'View Collection ↗'}
          </button>
          <div style={{marginTop:'1.5rem',display:'flex',flexDirection:'column',gap:'0.6rem'}}>
            {['Delivered to your hotel','Same-day across Florida & Georgia','Brand new from Valet By Nuor','Call (813) 816-2448 for help'].map(f=>(
              <div key={f} style={{display:'flex',gap:'0.75rem',alignItems:'center',fontSize:'0.90rem',color:'var(--mist)'}}><span style={{color:'var(--gold)',fontSize:'0.70rem'}}>◆</span>{f}</div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

  headset:(p)=><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 14v3a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2zM3 14v3a2 2 0 0 0 2 2h1v-7H5a2 2 0 0 0-2 2z"/></svg>,
};

function StylePreference({setPage}) {
  // Read existing trip state from window._hpState (set by Home page calculator)
  const hp = (typeof window !== 'undefined' && window._hpState) || {};
  const tripDays = parseInt(hp['hp-days'] || 7);
  const tripStyle = hp['hp-style'] || 'leisure';
  const defaultStyleId = SP_HPSTYLE_MAP[tripStyle] || 'coastal-minimal';

  // Format trip dates from today + tripDays
  const tripDates = React.useMemo(()=>{
    const start = new Date();
    const end = new Date(); end.setDate(start.getDate() + tripDays);
    const fmt = (d) => d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
    return `${fmt(start)} – ${fmt(end)}`;
  }, [tripDays]);

  const [selectedId, setSelectedId] = React.useState(defaultStyleId);
  const [openPanel, setOpenPanel] = React.useState(null); // 'upload' | 'describe' | null
  const [files, setFiles] = React.useState([]);
  const [description, setDescription] = React.useState('');
  const [drag, setDrag] = React.useState(false);
  const fileInputRef = React.useRef(null);

  const selectedStyle = SP_STYLES.find(s => s.id === selectedId) || null;
  const canContinue = !!selectedStyle || files.length > 0 || description.trim().length > 0;

  const addFiles = (fileList) => {
    const arr = Array.from(fileList).slice(0, 6 - files.length);
    const next = [...files, ...arr.map(f => ({ name: f.name, url: URL.createObjectURL(f) }))];
    setFiles(next);
  };

  const steps = [
    { n:1, label:'Destination', sub:'Miami, FL', target:'home' },
    { n:2, label:'Trip Details', sub:tripDates, target:'home' },
    { n:3, label:'Style Preference', sub:'Your Look, Your Vibe', target:null },
    { n:4, label:'Review & Checkout', sub:'Confirm Your Order', target:null },
  ];
  const current = 3;

  return (
    <div className="bf-sp-page">
      {/* Step rail */}
      <div className="bf-sp-steprail">
        {steps.map((s, i) => (
          <React.Fragment key={s.n}>
            <div
              className={`bf-sp-step ${current === s.n ? 'active' : current > s.n ? 'done clickable' : ''}`}
              onClick={() => { if (current > s.n && s.target) setPage(s.target); }}
            >
              <div className="bf-sp-step-num">{current > s.n ? '✓' : s.n}</div>
              <div className="bf-sp-step-meta">
                <div className="bf-sp-step-label">{s.label}</div>
                <div className="bf-sp-step-sub">{s.sub}</div>
              </div>
            </div>
            {i < steps.length - 1 && <div className="bf-sp-step-sep">›</div>}
          </React.Fragment>
        ))}
      </div>

      <div className="bf-sp-wrap">
        {/* LEFT: main */}
        <main>
          <div className="bf-sp-h-eyebrow">Step 3 of 4</div>
          <h1 className="bf-sp-h-title">What's your <em>style</em>?</h1>
          <p className="bf-sp-h-sub">Choose the vibe that fits your trip. We'll curate everything — from the linen to the loafers — and have it waiting in your suite.</p>

          <div className="bf-sp-grid">
            {SP_STYLES.map((s, i) => (
              <div
                key={s.id}
                className={`bf-sp-card ${selectedId === s.id ? 'selected' : ''}`}
                onClick={() => setSelectedId(s.id)}
                style={{ animationDelay: `${i * 60}ms` }}
                role="button"
                aria-pressed={selectedId === s.id}
                aria-label={`Select ${s.name} style`}
              >
                <div className="bf-sp-card-img" style={{ backgroundImage: `url(${s.img})` }} />
                <div className="bf-sp-card-overlay" />
                <div className="bf-sp-card-content">
                  <div className="bf-sp-card-title">{s.name}</div>
                  <div className="bf-sp-card-radio">
                    <span className="bf-sp-card-check">✓</span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="bf-sp-novibe">
            <div className="bf-sp-novibe-title">Don't see your vibe?</div>
            <div className="bf-sp-novibe-sub">Upload inspiration or describe your style and we'll take care of the rest.</div>
            <div className="bf-sp-novibe-actions">
              <div className={`bf-sp-novibe-btn ${openPanel === 'upload' ? 'open' : ''}`} onClick={() => setOpenPanel(openPanel === 'upload' ? null : 'upload')}>
                <div className="bf-sp-novibe-btn-icon"><SPI.upload /></div>
                <div>
                  <div className="bf-sp-novibe-btn-label">Upload Inspiration</div>
                  <div className="bf-sp-novibe-btn-desc">Add photos of looks you love</div>
                </div>
              </div>
              <div className={`bf-sp-novibe-btn ${openPanel === 'describe' ? 'open' : ''}`} onClick={() => setOpenPanel(openPanel === 'describe' ? null : 'describe')}>
                <div className="bf-sp-novibe-btn-icon"><SPI.pencil /></div>
                <div>
                  <div className="bf-sp-novibe-btn-label">Describe Your Style</div>
                  <div className="bf-sp-novibe-btn-desc">Tell us your preferences</div>
                </div>
              </div>
            </div>

            {openPanel === 'upload' && (
              <div
                className={`bf-sp-upload ${drag ? 'drag' : ''}`}
                onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
                onDragLeave={() => setDrag(false)}
                onDrop={(e) => { e.preventDefault(); setDrag(false); addFiles(e.dataTransfer.files); }}
              >
                <SPI.upload className="bf-sp-upload-icon" />
                <div className="bf-sp-upload-text">
                  Drop inspiration here or <span className="bf-sp-upload-link" onClick={() => fileInputRef.current && fileInputRef.current.click()}>browse your photos</span>
                </div>
                <div className="bf-sp-upload-sub">Outfit shots, Pinterest saves, screenshots — up to 6 images.</div>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  multiple
                  style={{ display: 'none' }}
                  onChange={(e) => addFiles(e.target.files)}
                />
                {files.length > 0 && (
                  <div className="bf-sp-upload-previews">
                    {files.map((f, i) => (
                      <div key={i} className="bf-sp-upload-preview" style={{ backgroundImage: `url(${f.url})` }}>
                        <div className="bf-sp-upload-preview-rm" onClick={() => setFiles(files.filter((_, j) => j !== i))}>×</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {openPanel === 'describe' && (
              <div className="bf-sp-describe">
                <div className="bf-sp-describe-label">Tell us your preferences</div>
                <textarea
                  className="bf-sp-describe-textarea"
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  placeholder="Colors, brands, fabrics, references — anything that helps us understand you."
                />
                <div className="bf-sp-describe-hints">
                  {SP_HINTS.map((h) => (
                    <div key={h} className="bf-sp-describe-hint" onClick={() => setDescription(description ? `${description} ${h}.` : `${h}.`)}>
                      "{h}"
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="bf-sp-novibe-foot">
              <SPI.sparkle /> Our stylists will curate pieces that match your style, location, and plans.
            </div>
          </div>
        </main>

        {/* RIGHT: Sticky summary */}
        <aside className="bf-sp-side">
          <div className="bf-sp-side-hero" style={{ backgroundImage: 'url(https://images.unsplash.com/photo-1583265627959-fb7042f5133b?w=900&q=80)' }}>
            <div className="bf-sp-side-hero-content">
              <div className="bf-sp-side-eyebrow">Your Trip</div>
              <div className="bf-sp-side-dest">Miami, FL</div>
              <div className="bf-sp-side-dates">{tripDates}</div>
            </div>
          </div>

          <div className="bf-sp-side-body">
            <div className="bf-sp-side-row">
              <div className="bf-sp-side-row-icon"><SPI.bag /></div>
              <div className="bf-sp-side-row-content">
                <div className="bf-sp-side-row-top">
                  <div className="bf-sp-side-row-label">Delivering To</div>
                  <div className="bf-sp-side-row-edit" onClick={() => setPage('hotel')}>Edit</div>
                </div>
                <div className="bf-sp-side-row-value">1 Hotel South Beach</div>
                <div className="bf-sp-side-row-sub">2341 Collins Ave, Miami Beach, FL 33139</div>
              </div>
            </div>

            <div className="bf-sp-side-row">
              <div className="bf-sp-side-row-content" style={{ width: '100%' }}>
                <div className="bf-sp-side-row-top">
                  <div className="bf-sp-side-row-label">Your Style</div>
                  {selectedStyle && <div className="bf-sp-side-row-edit" onClick={() => setSelectedId(null)}>Edit</div>}
                </div>
                {selectedStyle ? (
                  <div className="bf-sp-side-style" style={{ marginTop: '0.5rem' }}>
                    <div className="bf-sp-side-style-thumb" style={{ backgroundImage: `url(${selectedStyle.img})` }} />
                    <div>
                      <div className="bf-sp-side-style-title">{selectedStyle.name}</div>
                      <div className="bf-sp-side-style-desc">{selectedStyle.tagline}</div>
                    </div>
                  </div>
                ) : (
                  <div className="bf-sp-side-style-empty" style={{ marginTop: '0.4rem' }}>
                    Choose a vibe to begin.
                  </div>
                )}
              </div>
            </div>

            <div className="bf-sp-side-incl-label">What's Included</div>
            <div className="bf-sp-side-incl">
              {[
                { icon: <SPI.shirt />, t:'Clothing', s:'Handpicked outfits' },
                { icon: <SPI.shoe />, t:'Footwear', s:'Comfort meets style' },
                { icon: <SPI.bottle />, t:'Toiletries', s:'Premium essentials' },
                { icon: <SPI.acc />, t:'Accessories', s:'Finishing touches' },
              ].map((r) => (
                <div key={r.t} className="bf-sp-side-incl-row">
                  <div className="bf-sp-side-incl-icon">{r.icon}</div>
                  <div>
                    <div className="bf-sp-side-incl-text">{r.t}</div>
                    <div className="bf-sp-side-incl-sub">{r.s}</div>
                  </div>
                </div>
              ))}
            </div>

            <button
              className="bf-sp-side-cta"
              disabled={!canContinue}
              onClick={() => {
                // Persist the picked style + extras into window state so checkout can read it
                window._spState = {
                  styleId: selectedId,
                  styleName: selectedStyle ? selectedStyle.name : null,
                  description,
                  fileCount: files.length,
                };
                setPage('hotel');
              }}
            >
              Continue to Review →
            </button>
            <div className="bf-sp-side-secure">
              <SPI.lock /> Secure Checkout
            </div>
          </div>
        </aside>
      </div>

      {/* Trust strip */}
      <section className="bf-sp-trust">
        <div className="bf-sp-trust-grid">
          {[
            { icon: <SPI.hanger />, label:'Curated For You', text:'Personalized looks by our style experts.' },
            { icon: <SPI.truck />, label:'Delivered To Your Hotel', text:'On time, every time.' },
            { icon: <SPI.shield />, label:'Premium Quality', text:'Top brands, handpicked for your trip.' },
            { icon: <SPI.headset />, label:'24/7 Concierge', text:"We're here for you all trip long." },
          ].map((it) => (
            <div key={it.label} className="bf-sp-trust-item">
              <div className="bf-sp-trust-icon">{it.icon}</div>
              <div>
                <div className="bf-sp-trust-label">{it.label}</div>
                <div className="bf-sp-trust-text">{it.text}</div>
              </div>
            </div>
          ))}
        </div>
      </section>
    </div>
  );
}

// ── HOTEL CONCIERGE ───────────────────────────────────────────────────────────
function HotelConcierge() {
  const [done, setDone] = useState(false);

  if (done) return (

        <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(2.5rem,5vw,4rem)',fontWeight:300,color:'var(--noir)'}}>Book your <em style={{fontStyle:'italic'}}>perfect stay</em></h1>

          <div className="bf-form-2col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}>
            {[['name','Full Name','text'],['email','Email','email']].map(([k,l,t])=>(
              <div key={k}>
                <div style={{fontSize:'0.70rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--mist)',marginBottom:'0.4rem'}}>{l}</div>

                <option value="500+">$500+ luxury</option>

          <div>
            <div style={{fontSize:'0.70rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--mist)',marginBottom:'0.75rem'}}>Trip Type</div>

          <div>

            <textarea value={form.requests} onChange={e=>f('requests',e.target.value)} rows={3} placeholder="Ocean view, pet-friendly, early check-in..." style={{width:'100%',background:'var(--mist-xlow)',border:'1px solid var(--border)',color:'var(--white)',padding:'0.75rem 1rem',fontSize:'0.98rem',outline:'none',resize:'vertical',fontFamily:'var(--ff-body)',lineHeight:1.7}}/>
          </div>
          <button
            onClick={async()=>{if(form.name&&form.email&&form.dest){await submitToFormspree({type:'HOTEL REQUEST',...form,source:'BagFree Hotel Concierge'});setDone(true);}}}
            style={{background:'var(--gold)',color:'var(--noir)',padding:'1rem',border:'none',fontSize:'0.84rem',fontWeight:500,letterSpacing:'3px',textTransform:'uppercase',opacity:(!form.name||!form.email||!form.dest)?0.4:1}}>
            Submit Hotel Request
          </button>
        </div>
      </div>
    </div>
  );
}
