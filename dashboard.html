<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — BagFree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- React-via-Babel on Larry's cdnjs convention -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<!-- Supabase on the same jsdelivr path the existing account page uses -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#071B3A;            /* brief: dark navy background */
  --navy-2:#0A2349;          /* raised panels */
  --navy-3:#0E2C58;          /* hover wells */
  --navy-ink:#04122A;        /* deepest wells / sidebar */
  --gold:#D4AF6A;            /* brief: gold accent */
  --gold-soft:#E8CF9E;
  --gold-rgb:212,175,106;
  --cream:#F4EFE3;           /* brief: cream typography */
  --cream-rgb:244,239,227;
  --em:#5DCAA5;              /* Larry's locked teal — "live" / points / eco */
  --em-rgb:93,202,165;
  --coral:#E08A6E;
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-body:'DM Sans','Helvetica Neue',sans-serif;
  --line:rgba(var(--gold-rgb),0.14);
  --line-soft:rgba(var(--cream-rgb),0.08);
  --glass:rgba(255,255,255,0.028);
  --glass-2:rgba(255,255,255,0.05);
  --shadow:0 24px 60px rgba(2,8,20,0.55);
}
html.light{
  --navy:#F6F2E9; --navy-2:#FFFFFF; --navy-3:#F1EADC; --navy-ink:#EFE9DC;
  --gold:#9A7B3D; --gold-soft:#B89A5C; --gold-rgb:154,123,61;
  --cream:#21304A; --cream-rgb:33,48,74; --em:#2C8E6E; --em-rgb:44,142,110;
  --line:rgba(154,123,61,0.18); --line-soft:rgba(33,48,74,0.08);
  --glass:rgba(33,48,74,0.022); --glass-2:rgba(33,48,74,0.045);
  --shadow:0 22px 50px rgba(120,104,70,0.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--ff-body);
  color:rgba(var(--cream-rgb),0.86);
  background:var(--navy);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* ambient grain + glow behind everything */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 600px at 78% -8%, rgba(var(--gold-rgb),0.10), transparent 60%),
    radial-gradient(800px 700px at -10% 110%, rgba(var(--em-rgb),0.07), transparent 60%);
}
a{color:var(--gold);text-decoration:none}
button{cursor:pointer;border:none;font-family:var(--ff-body);background:none;color:inherit}
::selection{background:rgba(var(--gold-rgb),0.25);color:var(--cream)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}

.eyebrow{font-size:.56rem;letter-spacing:3.4px;text-transform:uppercase;font-weight:600;color:var(--gold)}
.serif{font-family:var(--ff-display);font-weight:300}

/* ─────────── App frame ─────────── */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* ─────────── Sidebar ─────────── */
.side{
  position:sticky;top:0;align-self:start;height:100vh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--navy-ink),color-mix(in srgb,var(--navy-ink) 86%, #000));
  border-right:1px solid var(--line);
  padding:1.6rem 1.1rem 1.2rem;
}
html.light .side{background:linear-gradient(180deg,var(--navy-ink),#E8E0CF)}
.brand{display:flex;align-items:center;gap:.55rem;padding:.2rem .5rem 1.4rem;text-decoration:none;cursor:pointer;}
.brand-logo-img{width:130px;max-width:100%;height:auto;object-fit:contain;display:block}
.brand-mark{width:30px;height:30px;flex-shrink:0}
.brand-name{font-family:var(--ff-display);font-size:1.55rem;color:var(--gold);line-height:1}
.nav-group-label{font-size:.5rem;letter-spacing:2.6px;text-transform:uppercase;color:rgba(var(--cream-rgb),0.32);font-weight:600;padding:.9rem .75rem .4rem}
.nav-item{
  display:flex;align-items:center;gap:.7rem;width:100%;
  padding:.62rem .75rem;border-radius:11px;
  font-size:.82rem;font-weight:500;color:rgba(var(--cream-rgb),0.6);
  text-align:left;transition:all .2s ease;position:relative;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.8}
.nav-item:hover{color:var(--cream);background:var(--glass)}
.nav-item.active{
  color:var(--navy-ink);font-weight:600;
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));
  box-shadow:0 8px 22px rgba(var(--gold-rgb),0.28);
}
html.light .nav-item.active{color:#FFF}
.nav-item.muted{color:rgba(var(--cream-rgb),0.4)}
.nav-item.muted:hover{color:rgba(var(--cream-rgb),0.7)}
.side-spacer{flex:1}
.invite-card{
  border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;background:var(--glass);
  margin-bottom:.7rem;
}
.invite-card .t{font-size:.78rem;color:rgba(var(--cream-rgb),0.72);line-height:1.4;margin-bottom:.35rem}
.invite-card .a{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.2rem .4rem}
.help{display:flex;align-items:center;gap:.5rem;font-size:.74rem;color:rgba(var(--cream-rgb),0.5)}
.theme-switch{position:relative;width:62px;height:31px;border-radius:31px;border:1px solid var(--line);background:var(--glass);display:flex;align-items:center;justify-content:space-between;padding:0 8px;cursor:pointer;transition:border-color .25s,background .25s;flex-shrink:0}
.theme-switch:hover{border-color:rgba(var(--gold-rgb),0.45);background:var(--glass-2)}
.theme-switch svg{width:14px;height:14px;position:relative;z-index:2;transition:color .3s}
.theme-switch .ts-sun{color:rgba(var(--cream-rgb),0.4)}
.theme-switch .ts-moon{color:#3a2c12}
html.light .theme-switch .ts-sun{color:#3a2c12}
html.light .theme-switch .ts-moon{color:rgba(var(--cream-rgb),0.4)}
.ts-thumb{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-soft),var(--gold));box-shadow:0 3px 9px rgba(0,0,0,.35),0 0 0 1px rgba(var(--gold-rgb),0.35),inset 0 1px 1px rgba(255,255,255,.4);transform:translateX(31px);transition:transform .36s cubic-bezier(.4,0,.2,1);z-index:1}
html.light .ts-thumb{transform:translateX(0)}

/* ─────────── Topbar ─────────── */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:flex-end;gap:.9rem;
  padding:1rem 2.2rem;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--navy) 80%, transparent);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:40;
}
.hamburger{display:none;margin-right:auto}
.hamburger svg{width:24px;height:24px;color:var(--cream)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:rgba(var(--cream-rgb),0.7);transition:.2s}
.bell:hover{color:var(--gold);border-color:rgba(var(--gold-rgb),0.4)}
.bell .dot{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.user-chip{display:flex;align-items:center;gap:.55rem;padding:.32rem .35rem .32rem .7rem;border:1px solid var(--line);border-radius:30px;transition:.2s}
.user-chip:hover{border-color:rgba(var(--gold-rgb),0.4)}
.user-name{font-size:.82rem;color:rgba(var(--cream-rgb),0.8)}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(var(--gold-rgb),0.12);border:1px solid rgba(var(--gold-rgb),0.4);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--ff-display);font-size:.95rem}

/* ─────────── Content ─────────── */
.content{padding:2rem 2.2rem 4rem;max-width:1180px;width:100%;margin:0 auto}
.reveal{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* Hero */
.mem-success-banner{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.4rem;margin-bottom:1.4rem;border-radius:12px;border:1.5px solid rgba(93,202,165,0.4);background:rgba(93,202,165,0.06);animation:heroFade 0.5s ease}
.msb-icon{width:40px;height:40px;border-radius:50%;background:rgba(93,202,165,0.15);color:#5DCAA5;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;flex-shrink:0}
.msb-text{flex:1;min-width:0}
.msb-title{font-family:var(--ff-display);font-size:1.15rem;color:#5DCAA5;font-weight:500}
.msb-sub{font-size:0.82rem;color:var(--sub);margin-top:0.2rem;line-height:1.5}
.msb-close{background:none;border:none;color:var(--sub);font-size:1.1rem;cursor:pointer;padding:0.3rem;flex-shrink:0;line-height:1}
.msb-close:hover{color:#5DCAA5}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
.hero h1{font-family:var(--ff-display);font-weight:300;font-size:clamp(2rem,4.2vw,3.05rem);color:var(--cream);line-height:1.04;letter-spacing:-.5px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{font-size:.92rem;color:rgba(var(--cream-rgb),0.5);margin-top:.45rem;font-weight:300}
.hero-chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:.45rem;border:1px solid var(--line);border-radius:30px;padding:.45rem .85rem;font-size:.72rem;color:rgba(var(--cream-rgb),0.78);background:var(--glass)}
.chip b{color:var(--gold);font-weight:600}
.chip .ic{display:flex}

/* Metric strip */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin:0 0 1.6rem}
.metric{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;
  padding:1.15rem 1.2rem;background:var(--glass);transition:transform .25s,border-color .25s,box-shadow .25s;
}
.metric:hover{transform:translateY(-3px);border-color:rgba(var(--gold-rgb),0.4);box-shadow:var(--shadow)}
.metric .ml{display:flex;align-items:center;gap:.5rem;font-size:.54rem;letter-spacing:2.4px;text-transform:uppercase;color:rgba(var(--cream-rgb),0.45);font-weight:600;margin-bottom:.55rem}
.metric .ml svg{width:15px;height:15px;color:var(--gold)}
.metric .mv{font-family:var(--ff-display);font-size:2.05rem;color:var(--cream);line-height:1;font-weight:400}
.metric .mv .u{font-size:.95rem;color:var(--gold);margin-left:.15rem}
.metric .ms{font-size:.72rem;color:rgba(var(--cream-rgb),0.42);margin-top:.4rem}
.metric.streak .mv{color:var(--gold)}
.metric .flame{position:absolute;right:-6px;top:-10px;font-size:3.2rem;opacity:.12;filter:saturate(1.2)}
.streak-bar{height:5px;border-radius:4px;background:rgba(var(--cream-rgb),0.08);margin-top:.6rem;overflow:hidden}
.streak-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--coral),var(--gold))}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.grid-passport-map{display:grid;grid-template-columns:340px 1fr;gap:1.1rem;align-items:stretch}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:2.2rem 0 1rem}
.sec-h h2{font-family:var(--ff-display);font-weight:400;font-size:1.55rem;color:var(--cream)}
.sec-h .link{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:.3rem}

.card{border:1px solid var(--line);border-radius:18px;background:var(--glass);position:relative;overflow:hidden}
.card-pad{padding:1.4rem}

/* ── Passport (signature) ── */
.passport{
  display:flex;flex-direction:column;
  background:
    linear-gradient(180deg, rgba(var(--gold-rgb),0.05), transparent 40%),
    var(--glass);
  border:1px solid rgba(var(--gold-rgb),0.28);
}
.passport .pp-top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.3rem .6rem}
.pp-title{font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.pp-i{width:18px;height:18px;color:rgba(var(--cream-rgb),0.4)}
.pp-hero{margin:0 1rem;border-radius:13px;overflow:hidden;position:relative;height:138px;background:var(--navy-ink)}
.pp-hero svg{width:100%;height:100%;display:block;transition:transform .6s}
.passport:hover .pp-hero svg{transform:scale(1.05)}
.pp-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(4,18,42,0.85))}
.pp-city{position:absolute;left:.8rem;bottom:.6rem;z-index:2;font-family:var(--ff-display);font-style:italic;font-size:1.15rem;color:var(--cream);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.pp-stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;padding:.9rem 1.3rem .4rem}
.stamp{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:transform .25s}
.stamp.filled{border:1.5px solid var(--gold);background:radial-gradient(circle,rgba(var(--gold-rgb),0.22),rgba(var(--gold-rgb),0.06));color:var(--gold);box-shadow:0 4px 12px rgba(var(--gold-rgb),0.2)}
.stamp.filled:hover{transform:scale(1.12) rotate(-6deg)}
.stamp.empty{border:1.5px dashed rgba(var(--cream-rgb),0.18);color:rgba(var(--cream-rgb),0.22)}
.stamp.next{border:1.5px dashed var(--em);color:var(--em);animation:beacon 2.2s ease-in-out infinite}
@keyframes beacon{0%,100%{box-shadow:0 0 0 0 rgba(var(--em-rgb),0.4)}50%{box-shadow:0 0 0 7px rgba(var(--em-rgb),0)}}
.pp-count{padding:.7rem 1.3rem 0;display:flex;align-items:baseline;gap:.5rem}
.pp-count .n{font-family:var(--ff-display);font-size:2.6rem;color:var(--cream);line-height:1}
.pp-count .d{font-size:.95rem;color:rgba(var(--cream-rgb),0.4)}
.pp-count .lbl{font-size:.72rem;color:rgba(var(--cream-rgb),0.5);margin-left:auto}
.pp-progress{height:7px;border-radius:5px;background:rgba(var(--cream-rgb),0.08);margin:.7rem 1.3rem 0;overflow:hidden}
.pp-progress i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.pp-next{margin:1rem 1.3rem 0;padding:.8rem .9rem;border-radius:12px;border:1px solid var(--line-soft);background:var(--glass-2);display:flex;align-items:center;gap:.7rem}
.pp-next .pin{width:30px;height:30px;border-radius:50%;background:rgba(var(--em-rgb),0.12);display:flex;align-items:center;justify-content:center;color:var(--em);flex-shrink:0}
.pp-next .info{flex:1;min-width:0}
.pp-next .info .nm{font-size:.84rem;color:var(--cream);font-weight:500}
.pp-next .info .ds{font-size:.68rem;color:rgba(var(--cream-rgb),0.45)}
.pts-pill{font-size:.62rem;font-weight:700;color:var(--gold);border:1px solid rgba(var(--gold-rgb),0.35);border-radius:20px;padding:.28rem .6rem;background:rgba(var(--gold-rgb),0.07);white-space:nowrap}
.pp-cta{margin:1.1rem 1.3rem 1.3rem;padding:.85rem;border-radius:12px;text-align:center;font-size:.62rem;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;color:var(--em);border:1px solid rgba(var(--em-rgb),0.35);transition:.25s}
.pp-cta:hover{background:rgba(var(--em-rgb),0.1);color:var(--em)}

/* ── Explore map (centerpiece) ── */
.mapcard{display:flex;flex-direction:column}
.map-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.3rem .4rem}
.map-head .t{font-size:.6rem;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.map-head .v{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:rgba(var(--cream-rgb),0.55);display:flex;align-items:center;gap:.3rem}
.map-head .v:hover{color:var(--gold)}
.map-stage{position:relative;flex:1;min-height:340px;margin:.7rem 1rem 0;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#082046,#05152f)}
html.light .map-stage{background:linear-gradient(160deg,#EDE6D6,#E4DAC4)}
.map-grid{position:absolute;inset:0;opacity:.6}
.you{position:absolute;left:48%;top:54%;width:16px;height:16px;border-radius:50%;background:#3B82F6;border:2px solid #fff;transform:translate(-50%,-50%);z-index:6;box-shadow:0 0 0 0 rgba(59,130,246,.5)}
.you::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(59,130,246,.5);animation:sonar 2.6s ease-out infinite}
@keyframes sonar{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.6);opacity:0}}
.mk{position:absolute;transform:translate(-50%,-100%);z-index:4;cursor:pointer;transition:opacity .3s,transform .3s}
.mk.dim{opacity:.22;filter:grayscale(.4)}
.mk-pin{width:38px;height:38px;border-radius:50% 50% 50% 12%;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(var(--gold-rgb),0.5);background:rgba(8,28,62,0.9);box-shadow:0 8px 18px rgba(0,0,0,.4);transition:.25s;animation:float 5s ease-in-out infinite}
html.light .mk-pin{background:rgba(255,255,255,0.95)}
.mk-pin svg{transform:rotate(-45deg);width:17px;height:17px;color:var(--em)}
.mk:hover .mk-pin,.mk.sel .mk-pin{border-color:var(--gold);background:var(--gold);transform:rotate(45deg) scale(1.08)}
.mk:hover .mk-pin svg,.mk.sel .mk-pin svg{color:var(--navy-ink)}
@keyframes float{0%,100%{margin-top:0}50%{margin-top:-5px}}
.mk-label{position:absolute;left:46px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(4,18,42,0.92);border:1px solid var(--line);border-radius:10px;padding:.4rem .6rem;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(6px)}
html.light .mk-label{background:rgba(255,255,255,0.96)}
.mk:hover .mk-label,.mk.sel .mk-label{opacity:1}
.mk-label .n{font-size:.72rem;color:var(--cream);font-weight:600}
.mk-label .m{font-size:.62rem;color:rgba(var(--cream-rgb),0.5)}
.mk-label .p{font-size:.62rem;color:var(--gold);font-weight:700;margin-top:.1rem}
.map-tabs{display:flex;gap:.45rem;flex-wrap:wrap;padding:.9rem 1rem 1.1rem}
.tab{font-size:.66rem;font-weight:600;padding:.45rem .85rem;border-radius:30px;border:1px solid var(--line);color:rgba(var(--cream-rgb),0.6);transition:.2s;letter-spacing:.3px}
.tab:hover{color:var(--cream);border-color:rgba(var(--gold-rgb),0.4)}
.tab.active{background:linear-gradient(135deg,var(--em),#4DBF95);color:var(--navy-ink);border-color:transparent;font-weight:700;box-shadow:0 6px 16px rgba(var(--em-rgb),0.3)}

/* ── Happening feed ── */
.feed-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:.9rem}
.fpost{border:1px solid var(--line);border-radius:15px;background:var(--glass);padding:1rem;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.fpost:hover{transform:translateY(-3px);border-color:rgba(var(--gold-rgb),0.35)}
.fp-head{display:flex;align-items:center;gap:.55rem;margin-bottom:.7rem}
.fp-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
.fp-av.ic{display:flex;align-items:center;justify-content:center;background:rgba(var(--gold-rgb),0.1);color:var(--gold)}
.fp-name{font-size:.78rem;color:var(--cream);font-weight:600;line-height:1.1}
.fp-time{font-size:.62rem;color:rgba(var(--cream-rgb),0.4)}
.tagpill{font-size:.5rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;padding:.16rem .42rem;border-radius:5px;align-self:flex-start;margin-bottom:.5rem}
.tag-traveler{background:rgba(var(--em-rgb),0.12);color:var(--em)}

.trip-tag{position:absolute;z-index:2;left:1rem;top:1rem;font-size:.5rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--gold);background:rgba(4,18,42,0.7);border:1px solid var(--line);border-radius:20px;padding:.3rem .7rem;backdrop-filter:blur(4px)}

.trip-cta{display:block;text-align:center;margin-top:1.1rem;padding:.8rem;border-radius:11px;border:1px solid rgba(var(--gold-rgb),0.4);font-size:.62rem;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;color:var(--gold);transition:.25s}

.imp{border:1px solid var(--line-soft);border-radius:13px;padding:1rem;background:var(--glass-2);text-align:center;transition:.25s}

.boot .sp{width:42px;height:42px;border:2px solid rgba(var(--gold-rgb),0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
.boot .t{font-family:var(--ff-display);font-style:italic;font-size:1.1rem;color:rgba(var(--cream-rgb),0.5)}
@keyframes spin{to{transform:rotate(360deg)}}

.scrim{display:none}

  .adv-img{height:140px}

@media(prefers-reduced-motion:reduce){

}

function SkylineHero({city}){
  const heights=CITY_SKYLINE[city]||CITY_SKYLINE['Savannah, GA'];
  const w=700,h=400,barW=w/heights.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMax slice" width="100%" height="100%" style={{display:'block'}}>
      <defs>
        <linearGradient id="skySky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="rgba(var(--gold-rgb),0.16)"/>
          <stop offset="100%" stopColor="rgba(var(--em-rgb),0.06)"/>
        </linearGradient>
        <linearGradient id="skyBldg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--gold-soft)"/>
          <stop offset="100%" stopColor="var(--gold)"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width={w} height={h} fill="url(#skySky)"/>
      {heights.map((pct,i)=>{
        const bh=(pct/100)*h*0.62, x=i*barW+barW*0.12, bw=barW*0.76;
        return <rect key={i} x={x} y={h-bh} width={bw} height={bh} rx="2" fill="url(#skyBldg)" opacity={0.5+ (i%3)*0.12}/>;
      })}
    </svg>
  );
}

/* ───────────────────── App ───────────────────── */
function App(){
  const [light,setLight]=useState(()=>{try{return localStorage.getItem('bf-theme')==='light';}catch(e){return false;}});
  const [navOpen,setNavOpen]=useState(false);
  const [membershipSuccess,setMembershipSuccess]=useState(()=>{
    try{var p=new URLSearchParams(window.location.search);if(p.get('membership')==='success'){window.history.replaceState({},'',window.location.pathname);return p.get('tier')||'member';}return null;}catch(e){return null;}
  });
  const [loading,setLoading]=useState(true);
  const [data,setData]=useState({
    name:'Traveler', initial:'T', city:'Savannah, GA', level:'Explorer', streak:8,
    pts:940, value:9.40, tier:'Free', stamps:4, total:10, notif:2,
    trip:{city:'Savannah, GA',dates:'May 24 – May 28, 2025',nights:4,hotel:'Historic Inn'},
    impact:{garments:12,waste:34,hotels:3,local:2},
    preferredSize:'M',
    orders:[
      {id:'m1',created_at:'2025-05-20',city:'Savannah, GA',status:'delivered',total:149,
        items:[{title:"Men's 7-Day Travel Essentials",qty:1,size:'M'}]},
      {id:'m2',created_at:'2025-04-02',city:'Atlanta, GA',status:'delivered',total:198,
        items:[{title:"Women's Business Kit",qty:1,size:'S'},{title:'Second Journey Trial',qty:1,size:'M'}]},
    ],
  });

  useEffect(()=>{document.documentElement.classList.toggle('light',light);},[light]);
  const toggleTheme=()=>{setLight(v=>{const nv=!v;try{localStorage.setItem('bf-theme',nv?'light':'dark');}catch(e){}return nv;});};

  // Load real Supabase data over the mock defaults (graceful if unauthenticated)
  const sbUserRef=useRef(null);
  useEffect(()=>{(async()=>{
    if(!sb){setLoading(false);return;}
    try{
      const {data:s}=await sb.auth.getSession();
      if(!s.session){
        if(REQUIRE_AUTH){window.location.href='/account-login.html';return;}
        setLoading(false);return; // preview with mock data
      }
      const u=s.session.user;
      sbUserRef.current=u;
      const next={};
      const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).single();
      if(p){
        const nm=p.first_name||u.email.split('@')[0];
        next.name=nm; next.initial=nm.charAt(0).toUpperCase();
        if(p.preferred_city) next.city=p.preferred_city;
        if(p.preferred_size) next.preferredSize=p.preferred_size;
        if(typeof p.bag_balance==='number'){next.value=p.bag_balance;next.pts=Math.round(p.bag_balance*100);}
      }
      const {data:mems}=await sb.from('memberships').select('*').eq('user_id',u.id).eq('status','active').order('created_at',{ascending:false}).limit(1);
      if(mems&&mems.length){const tn={secondjourney:'Second Journey',emerald:'Emerald',gold:'Gold'};next.tier=tn[mems[0].tier]||mems[0].tier;}
      const {data:orders}=await sb.from('orders').select('*').eq('user_id',u.id).order('created_at',{ascending:false}).limit(20);
      if(orders&&orders.length){
        next.orders=orders; // full history feeds the Recent Orders card
        const active=orders.filter(o=>['pending','confirmed','delivered'].includes(o.status));
        if(active.length){const o=active[0];const fmt=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
          next.trip={city:o.city||data.city,dates:fmt(o.arrival_date)+' – '+fmt(o.departure_date),
            nights:(o.arrival_date&&o.departure_date)?Math.max(1,Math.round((new Date(o.departure_date)-new Date(o.arrival_date))/864e5)):4,
            hotel:o.hotel||'Your hotel'};}
      } else {
        next.orders=[];
      }
      const {data:don}=await sb.from('donations').select('bag_credits_awarded,items_description').eq('user_id',u.id);
      if(don&&don.length){next.impact={...data.impact,garments:don.length*3,hotels:Math.max(1,don.length)};}
      const {data:gp}=await sb.from('game_profiles').select('level,cities_visited,badges').eq('user_id',u.id).single();
      if(gp){const lv=gp.level||1;next.level=lv>=5?'Voyager':lv>=3?'Wayfarer':lv>=2?'Explorer':'Wanderer';}
      setData(d=>({...d,...next}));
    }catch(e){console.warn('Dashboard load (preview mode):',e&&e.message);}
    setLoading(false);
  })();},[]);

  // Lets the traveler correct their saved size directly from the dashboard;
  // this is the same field the checkout size selector reads/writes.
  const updatePreferredSize=async(size)=>{
    setData(d=>({...d,preferredSize:size}));
    if(sb&&sbUserRef.current){
      try{ await sb.from('profiles').update({preferred_size:size}).eq('id',sbUserRef.current.id); }
      catch(e){ console.warn('Could not save preferred size:',e&&e.message); }
    }
  };

  const onNav=(n,e)=>{ if(n.href==='#'||n.href.startsWith('#')){ e.preventDefault(); if(n.href.length>1){const el=document.querySelector(n.href); if(el)el.scrollIntoView({behavior:'smooth'});} } };

  // Hands the last order's items off to the checkout page via localStorage,
  // then sends the traveler there with everything pre-filled.
  const handleReorder=(order)=>{
    try{
      localStorage.setItem('bf-reorder', JSON.stringify({
        items:(order.items||[]).map(it=>({id:it.id,qty:it.qty||1,size:it.size||'M'})),
        city:order.city||data.city,
        saved_at:new Date().toISOString()
      }));
    }catch(e){}
    window.location.href='/departure-lounge-landing.html?reorder=1';
  };

  return (
    <div className={'app'+(navOpen?' nav-open':'')}>
      <Sidebar active="dashboard" onNav={onNav} light={light} toggleTheme={toggleTheme} closeNav={()=>setNavOpen(false)}/>
      <div className="scrim" onClick={()=>setNavOpen(false)}></div>
      <div className="main">
        <div className="topbar">
          <button className="hamburger" onClick={()=>setNavOpen(true)} aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <ThemeToggle light={light} toggleTheme={toggleTheme}/>
          <button className="bell" aria-label="Notifications"><Icon d={I.bell}/>{data.notif>0&&<span className="dot">{data.notif}</span>}</button>
          <a className="user-chip" href="/account.html">
            <span className="user-name">{data.name}</span>
            <span className="avatar">{data.initial}</span>
          </a>
        </div>

        <div className="content">
          {membershipSuccess && (
            <div className="mem-success-banner reveal">
              <div className="msb-icon">✓</div>
              <div className="msb-text">
                <div className="msb-title">Welcome to BagFree{membershipSuccess!=='member'?' — '+membershipSuccess.charAt(0).toUpperCase()+membershipSuccess.slice(1):''}!</div>
                <div className="msb-sub">Your membership is active. You're ready to travel light, experience more, and leave less behind.</div>
              </div>
              <button className="msb-close" onClick={()=>setMembershipSuccess(null)} aria-label="Dismiss">✕</button>
            </div>
          )}
          <div className="hero reveal">
            <div>
              <h1>Welcome back, <em>{data.name}.</em></h1>
              <p>Travel light. Experience more. Leave less behind.</p>
            </div>
            <div className="hero-chips">
              <span className="chip"><span className="ic"><Icon d={I.pin} style={{width:14,height:14,color:'var(--gold)'}}/></span><b>{data.city}</b></span>
              <span className="chip"><Icon d={I.passport} style={{width:14,height:14,color:'var(--gold)'}}/> {data.level}</span>
              <span className="chip"><Icon d={I.fire} style={{width:14,height:14,color:'var(--coral)'}}/> {data.streak}-day streak</span>
              <SizePref size={data.preferredSize} onChange={updatePreferredSize}/>
            </div>
          </div>

          <Metrics pts={data.pts} value={data.value} streak={data.streak} tier={data.tier} level={data.level}/>

          <div className="grid-passport-map">
            <Passport city={data.city} filled={data.stamps} total={data.total} level={data.level}/>
            <ExploreMap/>
          </div>

          <Happening/>

          <div className="sec-h"><h2>Your Journey</h2></div>
          <div className="grid-2">
            <UpcomingTrip trip={data.trip}/>
            <Impact impact={data.impact}/>
          </div>

          <OrderHistory orders={data.orders}/>

          <div className="sec-h" style={{marginBottom:'1rem'}}><h2>Today's Adventure</h2></div>
          <Adventure/>

          <QuickActions lastOrder={data.orders&&data.orders[0]} onReorder={handleReorder}/>
        </div>
      </div>
      {loading&&<div className="boot"><div className="sp"></div><div className="t">Preparing your journey…</div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
